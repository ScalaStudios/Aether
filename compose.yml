name: aether

x-mail-env: &mail-env
  AETHER_MAIL_HOSTNAME: ${AETHER_MAIL_HOSTNAME:?set AETHER_MAIL_HOSTNAME in .env}
  AETHER_MAIL_DB_PASSWORD: ${AETHER_MAIL_DB_PASSWORD:?run scripts/setup.sh}
  AETHER_DOVECOT_MASTER_PASSWORD: ${AETHER_DOVECOT_MASTER_PASSWORD:?run scripts/setup.sh}
  AETHER_SIEVE_RELAY_PASSWORD: ${AETHER_SIEVE_RELAY_PASSWORD:?run scripts/setup.sh or add AETHER_SIEVE_RELAY_PASSWORD to .env}

x-api-env: &api-env
  AETHER_DATABASE_URL: postgres://aether:${POSTGRES_PASSWORD}@postgres:5432/aether?sslmode=disable
  AETHER_PUBLIC_URL: ${AETHER_PUBLIC_URL:?set AETHER_PUBLIC_URL in .env}
  AETHER_SECRET_KEY: ${AETHER_SECRET_KEY:?run scripts/setup.sh}
  AETHER_MAIL_DB_PASSWORD: ${AETHER_MAIL_DB_PASSWORD}
  AETHER_MAIL_HOSTNAME: ${AETHER_MAIL_HOSTNAME}
  AETHER_MAIL_TLS_CA_FILE: ${AETHER_MAIL_TLS_CA_FILE:-/tls/fullchain.pem}
  SSL_CERT_FILE: ${AETHER_TEST_SSL_CERT_FILE:-}
  AETHER_IMAP_ADDR: ${AETHER_IMAP_ADDR:-dovecot:143}
  AETHER_DOVECOT_API_URL: ${AETHER_DOVECOT_API_URL:-http://dovecot:8089}
  AETHER_DOVECOT_MASTER_PASSWORD: ${AETHER_DOVECOT_MASTER_PASSWORD}
  AETHER_DOVECOT_API_KEY: ${AETHER_DOVECOT_API_KEY}
  AETHER_POSTFIX_API_KEY: ${AETHER_POSTFIX_API_KEY:-}
  AETHER_VALKEY_PASSWORD: ${AETHER_VALKEY_PASSWORD}
  AETHER_RSPAMD_CONTROLLER_PASSWORD: ${AETHER_RSPAMD_CONTROLLER_PASSWORD}
  AETHER_SIEVE_RELAY_PASSWORD: ${AETHER_SIEVE_RELAY_PASSWORD}
  AETHER_TRUST_PROXY: "true"
  AETHER_METRICS_LISTEN: ":9090"
  AETHER_LOCAL_LOGIN: ${AETHER_LOCAL_LOGIN:-true}
  AETHER_OIDC_ALLOW_HTTP: ${AETHER_OIDC_ALLOW_HTTP:-false}
  AETHER_MTA_STS_MODE: ${AETHER_MTA_STS_MODE:-testing}
  AETHER_BACKUP_MX: ${AETHER_BACKUP_MX:-}
  AETHER_WEBHOOK_ALLOW_PRIVATE: ${AETHER_WEBHOOK_ALLOW_PRIVATE:-false}
  AETHER_SEND_REPORTS: ${AETHER_SEND_REPORTS:-true}
  AETHER_REPORT_FROM: ${AETHER_REPORT_FROM:-}
  AETHER_REPORT_ORG_NAME: ${AETHER_REPORT_ORG_NAME:-}
  AETHER_RELAYHOST: ${AETHER_RELAYHOST:-}
  AETHER_MAIL_LOG: ${AETHER_MAIL_LOG-/var/log/postfix/mail.log}
  AETHER_CUSTOM_CSS: ${AETHER_CUSTOM_CSS:-true}
  AETHER_AUTH_BLOCK_THRESHOLD: ${AETHER_AUTH_BLOCK_THRESHOLD:-10}
  AETHER_AUTH_BLOCK_ALLOW_NETS: ${AETHER_AUTH_BLOCK_ALLOW_NETS:-}
  AETHER_QUOTA_CHECK_INTERVAL: ${AETHER_QUOTA_CHECK_INTERVAL:-5m}
  AETHER_VAPID_PUBLIC_KEY: ${AETHER_VAPID_PUBLIC_KEY:-}
  AETHER_VAPID_PRIVATE_KEY: ${AETHER_VAPID_PRIVATE_KEY:-}
  AETHER_APNS_CERT_FILE: ${AETHER_APNS_CERT_FILE:-}
  AETHER_APNS_KEY_FILE: ${AETHER_APNS_KEY_FILE:-}
  AETHER_APNS_SANDBOX: ${AETHER_APNS_SANDBOX:-false}
  AETHER_MESSAGE_SIZE_LIMIT: ${AETHER_MESSAGE_SIZE_LIMIT:-52428800}
  AETHER_MAX_LINK_BYTES: ${AETHER_MAX_LINK_BYTES:-2147483648}
  AETHER_MAX_STORAGE_BYTES: ${AETHER_MAX_STORAGE_BYTES:-107374182400}
  AETHER_AUDIT_RETENTION_DAYS: ${AETHER_AUDIT_RETENTION_DAYS:-}
  AETHER_AUDIT_SYSLOG_ADDR: ${AETHER_AUDIT_SYSLOG_ADDR:-}
  AETHER_AUDIT_SYSLOG_NETWORK: ${AETHER_AUDIT_SYSLOG_NETWORK:-}
  AETHER_AUDIT_SYSLOG_FACILITY: ${AETHER_AUDIT_SYSLOG_FACILITY:-}
  AETHER_AUDIT_SYSLOG_APP_NAME: ${AETHER_AUDIT_SYSLOG_APP_NAME:-}
  AETHER_AUDIT_OTLP_ENDPOINT: ${AETHER_AUDIT_OTLP_ENDPOINT:-}
  AETHER_AUDIT_OTLP_HEADERS: ${AETHER_AUDIT_OTLP_HEADERS:-}
  AETHER_ALERT_EVAL_INTERVAL: ${AETHER_ALERT_EVAL_INTERVAL:-}
  AETHER_ALERT_FROM: ${AETHER_ALERT_FROM:-}
  AETHER_POSTFIX_EXPORTER_URL: ${AETHER_POSTFIX_EXPORTER_URL:-}
  AETHER_RSPAMD_METRICS_URL: ${AETHER_RSPAMD_METRICS_URL:-}
  AETHER_RSPAMD_METRICS_PASSWORD: ${AETHER_RSPAMD_METRICS_PASSWORD:-}
  AETHER_VMAIL_PATH: ${AETHER_VMAIL_PATH:-}
  AETHER_PGDATA_PATH: ${AETHER_PGDATA_PATH:-}
  AETHER_PGDATA_MAX_BYTES: ${AETHER_PGDATA_MAX_BYTES:-}
  AETHER_CLAMAV_ADDR: ${AETHER_CLAMAV_ADDR:-}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aether
      POSTGRES_USER: aether
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/setup.sh}
      AETHER_MAIL_DB_PASSWORD: ${AETHER_MAIL_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aether -d aether"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--requirepass", "${AETHER_VALKEY_PASSWORD:?run scripts/setup.sh}", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$AETHER_VALKEY_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      AETHER_VALKEY_PASSWORD: ${AETHER_VALKEY_PASSWORD}

  unbound:
    build: ./infrastructure/docker/unbound
    image: aether/unbound:dev
    restart: unless-stopped
    networks:
      default:
      resolver:
        ipv4_address: 172.29.53.53

  tls-init:
    build: ./infrastructure/docker/dovecot
    image: aether/dovecot:dev
    entrypoint: ["/usr/local/bin/tls-init.sh"]
    environment:
      AETHER_MAIL_HOSTNAME: ${AETHER_MAIL_HOSTNAME}
    volumes:
      - tls:/tls

  rspamd:
    build: ./infrastructure/docker/rspamd
    image: aether/rspamd:dev
    restart: unless-stopped
    environment:
      TZ: UTC
      AETHER_VALKEY_PASSWORD: ${AETHER_VALKEY_PASSWORD}
      AETHER_SEND_REPORTS: ${AETHER_SEND_REPORTS:-true}
      AETHER_RSPAMD_METRICS_PASSWORD: ${AETHER_RSPAMD_METRICS_PASSWORD:-}
      AETHER_RSPAMD_CONTROLLER_PASSWORD: ${AETHER_RSPAMD_CONTROLLER_PASSWORD:?run scripts/setup.sh or add AETHER_RSPAMD_CONTROLLER_PASSWORD to .env}
      AETHER_CLAMAV_ADDR: ${AETHER_CLAMAV_ADDR:-}
    volumes:
      - rspamd:/var/lib/rspamd
    depends_on:
      valkey:
        condition: service_healthy
      unbound:
        condition: service_healthy

  dovecot:
    image: aether/dovecot:dev
    restart: unless-stopped
    environment:
      <<: *mail-env
      AETHER_DOVECOT_API_KEY: ${AETHER_DOVECOT_API_KEY:?run scripts/setup.sh or add AETHER_DOVECOT_API_KEY to .env}
      AETHER_SECRET_KEY: ${AETHER_SECRET_KEY:?run scripts/setup.sh}
      AETHER_TIKA_URL: ${AETHER_TIKA_URL:-}
    volumes:
      - vmail:/var/vmail
      - tls:/tls:ro
    ports:
      - "${AETHER_PORT_IMAP:-143}:143"
      - "${AETHER_PORT_IMAPS:-993}:993"
    depends_on:
      tls-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
        restart: true

  postfix:
    build:
      context: ./infrastructure/docker/postfix
      additional_contexts:
        aether-source: .
    image: aether/postfix:dev
    restart: unless-stopped
    dns: 172.29.53.53
    networks:
      - default
      - resolver
    environment:
      <<: *mail-env
      TZ: UTC
      AETHER_RELAYHOST: ${AETHER_RELAYHOST:-}
      AETHER_RELAY_USER: ${AETHER_RELAY_USER:-}
      AETHER_RELAY_PASSWORD: ${AETHER_RELAY_PASSWORD:-}
      AETHER_POSTFIX_API_KEY: ${AETHER_POSTFIX_API_KEY:-}
      AETHER_MESSAGE_SIZE_LIMIT: ${AETHER_MESSAGE_SIZE_LIMIT:-52428800}
    volumes:
      - postfix-spool:/var/spool/postfix
      - postfix-logs:/var/log/postfix
      - tls:/tls:ro
    ports:
      - "${AETHER_PORT_SMTP:-25}:25"
      - "${AETHER_PORT_SUBMISSION:-587}:587"
      - "${AETHER_PORT_SUBMISSIONS:-465}:465"
    depends_on:
      tls-init:
        condition: service_completed_successfully
      dovecot:
        condition: service_started
      rspamd:
        condition: service_started

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api/Dockerfile
    image: aether/api:dev
    restart: unless-stopped
    environment: *api-env
    volumes:
      - tls:/tls:ro
      - postfix-logs:/var/log/postfix:ro
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      tls-init:
        condition: service_completed_successfully

  mail-events:
    image: aether/api:dev
    restart: unless-stopped
    command: ["mail-events"]
    healthcheck:
      disable: true
    environment:
      AETHER_DATABASE_URL: postgres://aether:${POSTGRES_PASSWORD}@postgres:5432/aether?sslmode=disable
    volumes:
      - postfix-logs:/var/log/postfix:ro
    depends_on:
      api:
        condition: service_healthy

  toxiproxy:
    profiles: ["test"]
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-host", "0.0.0.0", "-config", "/toxiproxy.json"]
    networks:
      default:
        aliases:
          - ${AETHER_MAIL_HOSTNAME}
    volumes:
      - ./tests/integration/testdata/toxiproxy.json:/toxiproxy.json:ro
    depends_on:
      dovecot:
        condition: service_started

  web:
    build: ./apps/web
    image: aether/web:dev
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      AETHER_SITE_ADDRESS: ${AETHER_SITE_ADDRESS:-:80}
      AETHER_MAX_LINK_BYTES: ${AETHER_MAX_LINK_BYTES:-2147483648}
    ports:
      - "${AETHER_PORT_HTTP:-80}:80"
      - "${AETHER_PORT_HTTPS:-443}:443"
    volumes:
      - ./infrastructure/docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - web

  clamav:
    profiles: ["antivirus"]
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamav:/var/lib/clamav

  tika:
    profiles: ["tika"]
    image: apache/tika:3.3.3.0
    restart: unless-stopped

  integration-tests:
    profiles: ["test"]
    image: golang:1.27-bookworm
    working_dir: /src
    command: ["go", "test", "-tags", "integration", "-count=1", "-timeout", "30m", "-v", "./tests/integration/..."]
    environment:
      AETHER_TEST_ADMIN_EMAIL: ${AETHER_TEST_ADMIN_EMAIL:-}
      AETHER_TEST_ADMIN_PASSWORD: ${AETHER_TEST_ADMIN_PASSWORD:-}
      AETHER_TEST_MAIL_HOSTNAME: ${AETHER_MAIL_HOSTNAME}
      AETHER_TEST_ANTIVIRUS: ${AETHER_CLAMAV_ADDR:+true}
      AETHER_TEST_TIKA: ${AETHER_TIKA_URL:+true}
      AETHER_TEST_WEBHOOKS: ${AETHER_WEBHOOK_ALLOW_PRIVATE:-false}
      AETHER_TEST_ALERT_FROM: ${AETHER_ALERT_FROM:-}
      AETHER_TEST_DATABASE_URL: postgres://aether:${POSTGRES_PASSWORD}@postgres:5432/aether?sslmode=disable
      AETHER_TEST_TOXIPROXY: http://toxiproxy:8474
      AETHER_TEST_DOVECOT_API_KEY: ${AETHER_DOVECOT_API_KEY}
      AETHER_TEST_DOVECOT_MASTER_PASSWORD: ${AETHER_DOVECOT_MASTER_PASSWORD}
      AETHER_TEST_PUBLIC_URL: ${AETHER_PUBLIC_URL}
    volumes:
      - .:/src:ro
      - tls:/tls:ro
      - gomodcache:/go/pkg/mod
      - gobuildcache:/root/.cache/go-build
    depends_on:
      - api
      - postfix
      - dovecot
      - toxiproxy
      - mail-trace

  postfix-exporter:
    profiles: ["monitoring"]
    image: ghcr.io/hsn723/postfix_exporter:0.21.2
    restart: unless-stopped
    command:
      - --postfix.logfile_path=/var/log/postfix/mail.log
      - --postfix.showq_path=/var/spool/postfix/public/showq
      - --postfix.smtpd_service_label=smtpd
      - --postfix.smtpd_service_label=submission/smtpd
      - --postfix.smtpd_service_label=submissions/smtpd
      - --postfix.smtpd_service_label=sieve-relay/smtpd
    volumes:
      - postfix-spool:/var/spool/postfix
      - postfix-logs:/var/log/postfix:ro
    depends_on:
      - postfix

  mail-trace:
    image: aether/api:dev
    restart: unless-stopped
    command: ["mail-trace"]
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    environment:
      AETHER_DATABASE_URL: postgres://aether:${POSTGRES_PASSWORD}@postgres:5432/aether?sslmode=disable
      AETHER_MAIL_TRACE_RETENTION_DAYS: ${AETHER_MAIL_TRACE_RETENTION_DAYS:-30}
    volumes:
      - postfix-logs:/var/log/postfix:ro
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:latest
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    secrets:
      - rspamd-metrics-password
    depends_on:
      - api

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana-oss:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${AETHER_GRAFANA_PASSWORD:?run scripts/setup.sh or add AETHER_GRAFANA_PASSWORD to .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:${AETHER_GRAFANA_PORT:-3300}:3000"
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

secrets:
  rspamd-metrics-password:
    environment: AETHER_RSPAMD_METRICS_PASSWORD

volumes:
  clamav:
  prometheus-data:
  grafana-data:
  gomodcache:
  gobuildcache:
  pgdata:
  valkeydata:
  tls:
  rspamd:
  vmail:
  postfix-spool:
  postfix-logs:
  caddy-data:
  caddy-config:

networks:
  resolver:
    internal: true
    ipam:
      config:
        - subnet: 172.29.53.0/24
