{{- range $svc := list (dict "name" "smtp" "target" "postfix" "ports" (list (list "smtp" 25) (list "submissions" 465) (list "submission" 587))) (dict "name" "imap" "target" "dovecot" "ports" (list (list "imap" 143) (list "imaps" 993))) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-mail-{{ $svc.name }}
  labels: {{- include "aether.labels" $ | nindent 4 }}
  {{- with $.Values.mailService.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $.Values.mailService.type }}
  {{- if ne $.Values.mailService.type "ClusterIP" }}
  externalTrafficPolicy: {{ $.Values.mailService.externalTrafficPolicy }}
  {{- end }}
  {{- with $.Values.mailService.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  selector: {{- include "aether.selector" (dict "name" $svc.target "root" $) | nindent 4 }}
  ports:
    {{- range $p := $svc.ports }}
    - { name: {{ index $p 0 }}, port: {{ index $p 1 }}, targetPort: {{ index $p 1 }} }
    {{- end }}
{{- end }}
