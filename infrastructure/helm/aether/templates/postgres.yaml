{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-postgres-init
  labels: {{- include "aether.labels" . | nindent 4 }}
data:
  10-aether-mail-role.sh: |
{{ .Files.Get "files/10-aether-mail-role.sh" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: {{- include "aether.labels" . | nindent 4 }}
spec:
  selector: {{- include "aether.selector" (dict "name" "postgres" "root" .) | nindent 4 }}
  ports:
    - { name: postgres, port: 5432, targetPort: 5432 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: {{- include "aether.labels" . | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {{- include "aether.selector" (dict "name" "postgres" "root" .) | nindent 6 }}
  template:
    metadata:
      labels: {{- include "aether.selector" (dict "name" "postgres" "root" .) | nindent 8 }}
    spec:
      securityContext:
        {{- include "aether.podSecurity" . | nindent 8 }}
        fsGroup: 70
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: {{ .Values.postgresql.image }}
          env:
            - { name: POSTGRES_DB, value: aether }
            - { name: POSTGRES_USER, value: aether }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            {{- include "aether.secretEnv" (dict "env" "POSTGRES_PASSWORD" "key" "postgresPassword" "root" .) | nindent 12 }}
            {{- include "aether.secretEnv" (dict "env" "AETHER_MAIL_DB_PASSWORD" "key" "mailDbPassword" "root" .) | nindent 12 }}
          ports:
            - { name: postgres, containerPort: 5432 }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "aether", "-d", "aether"] }
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "aether", "-d", "aether"] }
            periodSeconds: 30
            failureThreshold: 5
          resources: {{- toYaml .Values.resources.postgres | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 70
            runAsGroup: 70
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
      volumes:
        - name: init
          configMap:
            name: {{ .Release.Name }}-postgres-init
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec: {{- include "aether.pvc" (dict "size" .Values.postgresql.storage "root" .) | nindent 8 }}
{{- end }}
