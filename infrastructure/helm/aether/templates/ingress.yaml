{{- if .Values.ingress.enabled }}
{{- $host := (urlParse .Values.publicUrl).host }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-web
  labels: {{- include "aether.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  tls:
    - hosts:
        - {{ $host | quote }}
        {{- range .Values.mtaSts.domains }}
        - {{ printf "mta-sts.%s" . | quote }}
        - {{ printf "autoconfig.%s" . | quote }}
        - {{ printf "autodiscover.%s" . | quote }}
        {{- end }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          {{- range list "/api" "/dav" "/.well-known/caldav" "/.well-known/carddav" "/.well-known/autoconfig" "/autodiscover" "/Autodiscover" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service: { name: api, port: { name: http } }
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { name: http } }
    {{- range .Values.mtaSts.domains }}
    - host: {{ printf "mta-sts.%s" . | quote }}
      http:
        paths:
          - path: /.well-known/mta-sts.txt
            pathType: Exact
            backend:
              service: { name: api, port: { name: http } }
    - host: {{ printf "autoconfig.%s" . | quote }}
      http:
        paths:
          - path: /mail/config-v1.1.xml
            pathType: Exact
            backend:
              service: { name: api, port: { name: http } }
    - host: {{ printf "autodiscover.%s" . | quote }}
      http:
        paths:
          {{- range list "/autodiscover" "/Autodiscover" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service: { name: api, port: { name: http } }
          {{- end }}
    {{- end }}
{{- end }}
