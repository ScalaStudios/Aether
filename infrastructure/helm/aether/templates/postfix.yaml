apiVersion: v1
kind: Service
metadata:
  name: postfix
  labels: {{- include "aether.labels" . | nindent 4 }}
spec:
  selector: {{- include "aether.selector" (dict "name" "postfix" "root" .) | nindent 4 }}
  ports:
    - { name: submission, port: 587, targetPort: 587 }
    - { name: sieve-relay, port: 10025, targetPort: 10025 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postfix
  labels: {{- include "aether.labels" . | nindent 4 }}
spec:
  serviceName: postfix
  replicas: 1
  selector:
    matchLabels: {{- include "aether.selector" (dict "name" "postfix" "root" .) | nindent 6 }}
  template:
    metadata:
      labels: {{- include "aether.selector" (dict "name" "postfix" "root" .) | nindent 8 }}
    spec:
      securityContext: {{- include "aether.podSecurity" . | nindent 8 }}
      terminationGracePeriodSeconds: 120
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postfix
          image: {{ include "aether.image" (dict "name" "postfix" "root" .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - { name: AETHER_MAIL_HOSTNAME, value: {{ .Values.mailHostname | quote }} }
            - { name: AETHER_RELAYHOST, value: {{ .Values.relay.host | quote }} }
            - { name: AETHER_RELAY_USER, value: {{ .Values.relay.user | quote }} }
            {{- include "aether.secretEnv" (dict "env" "AETHER_RELAY_PASSWORD" "key" "relayPassword" "root" .) | nindent 12 }}
            {{- include "aether.secretEnv" (dict "env" "AETHER_MAIL_DB_PASSWORD" "key" "mailDbPassword" "root" .) | nindent 12 }}
          ports:
            - { name: smtp, containerPort: 25 }
            - { name: submissions, containerPort: 465 }
            - { name: submission, containerPort: 587 }
            - { name: sieve-relay, containerPort: 10025 }
          readinessProbe:
            tcpSocket: { port: 25 }
            initialDelaySeconds: 5
          livenessProbe:
            tcpSocket: { port: 25 }
            periodSeconds: 30
          resources: {{- toYaml .Values.resources.postfix | nindent 12 }}
          securityContext: {{- include "aether.mailDaemonSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: spool, mountPath: /var/spool/postfix }
            - { name: mail-tls, mountPath: /tls, readOnly: true }
      volumes: {{- include "aether.tlsVolume" . | nindent 8 }}
  volumeClaimTemplates:
    - metadata:
        name: spool
      spec: {{- include "aether.pvc" (dict "size" .Values.storage.postfixSpool "root" .) | nindent 8 }}
