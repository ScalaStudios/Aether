apiVersion: v1
kind: Service
metadata:
  name: valkey
  labels: {{- include "aether.labels" . | nindent 4 }}
spec:
  selector: {{- include "aether.selector" (dict "name" "valkey" "root" .) | nindent 4 }}
  ports:
    - { name: valkey, port: 6379, targetPort: 6379 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey
  labels: {{- include "aether.labels" . | nindent 4 }}
spec:
  serviceName: valkey
  replicas: 1
  selector:
    matchLabels: {{- include "aether.selector" (dict "name" "valkey" "root" .) | nindent 6 }}
  template:
    metadata:
      labels: {{- include "aether.selector" (dict "name" "valkey" "root" .) | nindent 8 }}
    spec:
      securityContext:
        {{- include "aether.podSecurity" . | nindent 8 }}
        fsGroup: 999
      containers:
        - name: valkey
          image: {{ .Values.valkey.image }}
          command: ["sh", "-c", "exec valkey-server --requirepass \"$AETHER_VALKEY_PASSWORD\" --appendonly yes --save 60 1"]
          env:
            {{- include "aether.secretEnv" (dict "env" "AETHER_VALKEY_PASSWORD" "key" "valkeyPassword" "root" .) | nindent 12 }}
          ports:
            - { name: valkey, containerPort: 6379 }
          readinessProbe:
            exec: { command: ["sh", "-c", "valkey-cli -a \"$AETHER_VALKEY_PASSWORD\" --no-auth-warning ping | grep -q PONG"] }
          resources: {{- toYaml .Values.resources.valkey | nindent 12 }}
          securityContext:
            {{- include "aether.restrictedSecurity" . | nindent 12 }}
            runAsUser: 999
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec: {{- include "aether.pvc" (dict "size" .Values.valkey.storage "root" .) | nindent 8 }}
