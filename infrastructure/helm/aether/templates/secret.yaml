{{- if not .Values.secrets.existingSecret }}
{{- $name := include "aether.secretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $pick := dict }}
{{- range $key, $val := dict "secretKey" (randBytes 32) "mailDbPassword" (randAlphaNum 40) "dovecotMasterPassword" (randAlphaNum 40) "sieveRelayPassword" (randAlphaNum 40) "valkeyPassword" (randAlphaNum 40) "postgresPassword" (randAlphaNum 40) }}
{{- $given := index $.Values.secrets $key }}
{{- if $given }}{{ $_ := set $pick $key $given }}{{ else if hasKey $existing $key }}{{ $_ := set $pick $key (index $existing $key | b64dec) }}{{ else }}{{ $_ := set $pick $key $val }}{{ end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "aether.labels" . | nindent 4 }}
type: Opaque
stringData:
  secretKey: {{ $pick.secretKey | quote }}
  mailDbPassword: {{ $pick.mailDbPassword | quote }}
  dovecotMasterPassword: {{ $pick.dovecotMasterPassword | quote }}
  sieveRelayPassword: {{ $pick.sieveRelayPassword | quote }}
  valkeyPassword: {{ $pick.valkeyPassword | quote }}
  postgresPassword: {{ $pick.postgresPassword | quote }}
  databaseUrl: {{ .Values.secrets.databaseUrl | default (printf "postgres://aether:%s@postgres:5432/aether?sslmode=disable" $pick.postgresPassword) | quote }}
  relayPassword: {{ .Values.secrets.relayPassword | quote }}
{{- end }}
