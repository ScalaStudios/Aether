apiVersion: v1
kind: Service
metadata:
  name: rspamd
  labels: {{- include "aether.labels" . | nindent 4 }}
spec:
  selector: {{- include "aether.selector" (dict "name" "rspamd" "root" .) | nindent 4 }}
  ports:
    - { name: milter, port: 11332, targetPort: 11332 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rspamd
  labels: {{- include "aether.labels" . | nindent 4 }}
spec:
  serviceName: rspamd
  replicas: 1
  selector:
    matchLabels: {{- include "aether.selector" (dict "name" "rspamd" "root" .) | nindent 6 }}
  template:
    metadata:
      labels: {{- include "aether.selector" (dict "name" "rspamd" "root" .) | nindent 8 }}
    spec:
      securityContext:
        {{- include "aether.podSecurity" . | nindent 8 }}
        fsGroup: 11333
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: rspamd
          image: {{ include "aether.image" (dict "name" "rspamd" "root" .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "aether.secretEnv" (dict "env" "AETHER_VALKEY_PASSWORD" "key" "valkeyPassword" "root" .) | nindent 12 }}
            {{- if .Values.clamav.enabled }}
            - { name: AETHER_CLAMAV_ADDR, value: "clamav:3310" }
            {{- end }}
          ports:
            - { name: milter, containerPort: 11332 }
          readinessProbe:
            tcpSocket: { port: 11332 }
            initialDelaySeconds: 10
          resources: {{- toYaml .Values.resources.rspamd | nindent 12 }}
          securityContext:
            {{- include "aether.restrictedSecurity" . | nindent 12 }}
            runAsUser: 11333
          volumeMounts:
            - { name: data, mountPath: /var/lib/rspamd }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec: {{- include "aether.pvc" (dict "size" .Values.storage.rspamd "root" .) | nindent 8 }}
