apiVersion: v1
kind: Service
metadata:
  name: dovecot
  labels: {{- include "aether.labels" . | nindent 4 }}
spec:
  selector: {{- include "aether.selector" (dict "name" "dovecot" "root" .) | nindent 4 }}
  ports:
    - { name: imap, port: 143, targetPort: 143 }
    - { name: lmtp, port: 24, targetPort: 24 }
    - { name: sasl, port: 12345, targetPort: 12345 }
    - { name: sieve, port: 4190, targetPort: 4190 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dovecot
  labels: {{- include "aether.labels" . | nindent 4 }}
spec:
  serviceName: dovecot
  replicas: 1
  selector:
    matchLabels: {{- include "aether.selector" (dict "name" "dovecot" "root" .) | nindent 6 }}
  template:
    metadata:
      labels: {{- include "aether.selector" (dict "name" "dovecot" "root" .) | nindent 8 }}
    spec:
      securityContext: {{- include "aether.podSecurity" . | nindent 8 }}
      terminationGracePeriodSeconds: 60
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: dovecot
          image: {{ include "aether.image" (dict "name" "dovecot" "root" .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - { name: AETHER_MAIL_HOSTNAME, value: {{ .Values.mailHostname | quote }} }
            - { name: AETHER_DOVECOT_MASTER_ALLOW_NETS, value: {{ .Values.dovecotMasterAllowNets | quote }} }
            {{- include "aether.secretEnv" (dict "env" "AETHER_MAIL_DB_PASSWORD" "key" "mailDbPassword" "root" .) | nindent 12 }}
            {{- include "aether.secretEnv" (dict "env" "AETHER_DOVECOT_MASTER_PASSWORD" "key" "dovecotMasterPassword" "root" .) | nindent 12 }}
            {{- include "aether.secretEnv" (dict "env" "AETHER_SIEVE_RELAY_PASSWORD" "key" "sieveRelayPassword" "root" .) | nindent 12 }}
          ports:
            - { name: imap, containerPort: 143 }
            - { name: imaps, containerPort: 993 }
            - { name: lmtp, containerPort: 24 }
            - { name: sasl, containerPort: 12345 }
            - { name: sieve, containerPort: 4190 }
          readinessProbe:
            tcpSocket: { port: 143 }
            initialDelaySeconds: 5
          livenessProbe:
            tcpSocket: { port: 143 }
            periodSeconds: 30
          resources: {{- toYaml .Values.resources.dovecot | nindent 12 }}
          securityContext: {{- include "aether.mailDaemonSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: vmail, mountPath: /var/vmail }
            - { name: mail-tls, mountPath: /tls, readOnly: true }
      volumes: {{- include "aether.tlsVolume" . | nindent 8 }}
  volumeClaimTemplates:
    - metadata:
        name: vmail
      spec: {{- include "aether.pvc" (dict "size" .Values.storage.vmail "root" .) | nindent 8 }}
