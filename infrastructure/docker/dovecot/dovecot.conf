protocols = imap lmtp sieve
listen = *
log_path = /dev/stderr
info_log_path = /dev/stdout
login_greeting = Aether IMAP ready.

ssl = required
ssl_cert = </tls/fullchain.pem
ssl_key = </tls/privkey.pem
ssl_min_protocol = TLSv1.2
ssl_prefer_server_ciphers = yes
disable_plaintext_auth = yes

auth_mechanisms = plain login xoauth2 oauthbearer
auth_username_format = %Lu
auth_master_user_separator = *
auth_failure_delay = 2 secs
auth_policy_request_attributes = login=%{requested_username} pwhash=%{hashed_password} remote=%{rip} protocol=%s
auth_policy_check_before_auth = yes
auth_policy_check_after_auth = no
auth_policy_report_after_auth = yes
auth_policy_reject_on_fail = no

mail_location = maildir:~/Maildir
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 5000
last_valid_uid = 5000
mail_plugins = $mail_plugins quota acl lazy_expunge mail_crypt
recipient_delimiter = +
lmtp_save_to_detail_mailbox = yes

namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Archive {
    auto = subscribe
    special_use = \Archive
  }
  mailbox Junk {
    auto = subscribe
    special_use = \Junk
  }
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
  }
}

namespace shared {
  type = shared
  separator = /
  prefix = Shared/%%u/
  location = maildir:%%h/Maildir
  subscriptions = no
  list = children
}

namespace expunged {
  prefix = .EXPUNGED/
  separator = /
  location = maildir:~/Expunged
  hidden = yes
  list = no
  subscriptions = no
  mailbox * {
    autoexpunge = 30d
  }
}

passdb {
  driver = passwd-file
  args = scheme=SHA512-CRYPT /run/dovecot-secrets/master-users
  master = yes
}

passdb {
  driver = passwd-file
  args = scheme=SHA512-CRYPT /run/dovecot-secrets/relay-users
}

passdb {
  driver = sql
  args = /run/dovecot-secrets/sql.conf.ext
  mechanisms = plain login
}

passdb {
  driver = checkpassword
  args = /usr/local/bin/aether-token-check.sh
  mechanisms = xoauth2 oauthbearer
}

userdb {
  driver = sql
  args = /run/dovecot-secrets/sql.conf.ext
}

service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

service lmtp {
  inet_listener lmtp {
    port = 24
  }
}

service managesieve-login {
  inet_listener sieve {
    port = 4190
  }
}

service anvil {
  unix_listener anvil-auth-penalty {
    mode = 0
  }
}

service auth {
  inet_listener sasl {
    port = 12345
  }
}

protocol imap {
  mail_plugins = $mail_plugins imap_quota imap_acl imap_sieve
  mail_max_userip_connections = 100
}

protocol lmtp {
  mail_plugins = $mail_plugins sieve
  postmaster_address = postmaster@%d
}

sendmail_path = /usr/bin/msmtp --file=/run/aether-msmtp/msmtprc

plugin {
  mail_crypt_save_version = 2
  acl = vfile:/etc/dovecot/dovecot-acl
  acl_user = %u
  acl_shared_dict = file:/var/vmail/shared-mailboxes.db
  acl_defaults_from_inbox = yes
  quota = count:User quota
  quota_vsizes = yes
  quota_grace = 5%%
  quota_rule2 = .EXPUNGED/*:ignore
  lazy_expunge = .EXPUNGED/
  lazy_expunge_only_last_instance = yes
  lazy_expunge_exclude = \Drafts
  sieve = file:~/sieve;active=~/.dovecot.sieve
  sieve_before = file:~/sieve/aether-senders.sieve
  sieve_before2 = /etc/dovecot/sieve/spam-to-junk.sieve
  sieve_extensions = +editheader
  sieve_plugins = sieve_imapsieve sieve_extprograms
  sieve_global_extensions = +vnd.dovecot.pipe +vnd.dovecot.execute +vnd.dovecot.environment
  sieve_pipe_bin_dir = /usr/local/lib/aether-sieve
  sieve_execute_bin_dir = /usr/local/lib/aether-sieve
  imapsieve_mailbox1_name = Junk
  imapsieve_mailbox1_causes = COPY
  imapsieve_mailbox1_before = file:/etc/dovecot/sieve/learn-spam.sieve
  imapsieve_mailbox2_name = *
  imapsieve_mailbox2_from = Junk
  imapsieve_mailbox2_causes = COPY
  imapsieve_mailbox2_before = file:/etc/dovecot/sieve/learn-ham.sieve
  sieve_redirect_envelope_from = recipient
  sieve_max_redirects = 5
  sieve_vacation_min_period = 1h
  sieve_vacation_default_period = 1d
}

metric auth {
  filter = event=auth_request_finished
  group_by = success
}

metric imap_command {
  filter = event=imap_command_finished
  group_by = cmd_name tagged_reply_state
}

metric mail_delivery {
  filter = event=mail_delivery_finished
}

metric mail_audit {
  exporter = mail_audit
  exporter_include = name timestamps fields
  filter = category=service:imap AND ((event=imap_command_finished AND tagged_reply_state=OK AND (cmd_name=SELECT OR cmd_name=EXAMINE OR cmd_name=CREATE OR cmd_name=DELETE OR cmd_name=RENAME OR cmd_name=COPY OR cmd_name=MOVE OR cmd_name="UID COPY" OR cmd_name="UID MOVE")) OR (event=mail_opened AND reason_code=imap:fetch_body) OR event=mail_expunged)
}

service stats {
  inet_listener http {
    port = 9900
  }
}

service doveadm {
  inet_listener http {
    port = 8089
  }
}

!include_try /run/dovecot-secrets/doveadm.conf
!include_try /run/dovecot-secrets/mail-audit.conf
!include_try /run/dovecot-secrets/policy.conf
!include_try /run/dovecot-secrets/mail-crypt.conf
