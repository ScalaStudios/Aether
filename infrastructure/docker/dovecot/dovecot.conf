protocols = imap lmtp
listen = *
log_path = /dev/stderr
info_log_path = /dev/stdout
login_greeting = Aether IMAP ready.

ssl = required
ssl_cert = </tls/fullchain.pem
ssl_key = </tls/privkey.pem
ssl_min_protocol = TLSv1.2
ssl_prefer_server_ciphers = yes
disable_plaintext_auth = yes

auth_mechanisms = plain login
auth_username_format = %Lu
auth_master_user_separator = *
auth_failure_delay = 2 secs

mail_location = maildir:~/Maildir
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 5000
last_valid_uid = 5000
mail_plugins = $mail_plugins quota
recipient_delimiter = +
lmtp_save_to_detail_mailbox = no

namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Archive {
    auto = subscribe
    special_use = \Archive
  }
  mailbox Junk {
    auto = subscribe
    special_use = \Junk
    autoexpunge = 30d
  }
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
    autoexpunge = 30d
  }
}

passdb {
  driver = passwd-file
  args = scheme=SHA512-CRYPT /run/dovecot-secrets/master-users
  master = yes
}

passdb {
  driver = sql
  args = /run/dovecot-secrets/sql.conf.ext
}

userdb {
  driver = sql
  args = /run/dovecot-secrets/sql.conf.ext
}

service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

service lmtp {
  inet_listener lmtp {
    port = 24
  }
}

service auth {
  inet_listener sasl {
    port = 12345
  }
}

protocol imap {
  mail_plugins = $mail_plugins imap_quota
  mail_max_userip_connections = 50
}

protocol lmtp {
  mail_plugins = $mail_plugins sieve
  postmaster_address = postmaster@%d
}

plugin {
  quota = count:User quota
  quota_vsizes = yes
  quota_grace = 5%%
  sieve = file:~/sieve;active=~/.dovecot.sieve
  sieve_before = /etc/dovecot/sieve/spam-to-junk.sieve
}
