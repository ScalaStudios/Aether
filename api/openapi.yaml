        protocol: { type: string, enum: [smime, openpgp] }
        fingerprint: { type: string }
        publicKey: { type: string }
        source: { type: string, enum: [directory, message, autocrypt, wkd] }
    RecipientKeyInput:
      type: object
      required: [address, protocol, publicKey, source]
      properties:
        address: { type: string, format: email }
        protocol: { type: string, enum: [smime, openpgp] }
        publicKey: { type: string }
        source: { type: string, enum: [message, autocrypt, wkd] }
    MessageProtection:
      type: object
      properties:
        protocol: { type: string, enum: [smime, openpgp] }
        encrypted: { type: boolean }
        signed: { type: boolean }
        autocrypt: { type: string }
    ProtectedMessage:
      type: object
      required: [sender, recipient, salt, message, replied, expiresAt]
      properties:
        sender: { type: string }
        recipient: { type: string }
        salt: { type: string, format: byte }
        message: { type: string, format: byte, description: Version byte 0x01, a 12-byte nonce, then AES-256-GCM ciphertext }
        reply: { type: string, format: byte }
        replied: { type: boolean }
        expiresAt: { type: string, format: date-time }
    ProtectedMessageInput:
      type: object
      required: [id, to, access, replyHash, salt, message, hours]
      properties:
        id: { type: string, format: uuid }
        to: { $ref: "#/components/schemas/Address" }
        access: { type: string, pattern: "^[0-9a-f]{64}$" }
        replyHash: { type: string, format: byte, description: SHA-256 of the reply proof }
        salt: { type: string, format: byte }
        message: { type: string, format: byte }
        hours: { type: integer, enum: [24, 72, 168] }
    FileLinkRef:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }
        password: { type: string, minLength: 8, maxLength: 128 }
