        expiresAt: { type: string, format: date-time }
        clearExpiry: { type: boolean }
    FileLinkSummary:
      type: object
      required: [id, filename, contentType, sizeBytes, expiresAt, passwordProtected]
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer }
        expiresAt: { type: [string, "null"], format: date-time }
        passwordProtected: { type: boolean }
    FileLinkRecord:
      allOf:
        - { $ref: "#/components/schemas/FileLinkSummary" }
        - type: object
          required: [downloadCount, createdAt, mailboxAddress, url, committed, expired]
          properties:
            downloadCount: { type: integer }
            createdAt: { type: string, format: date-time }
            mailboxAddress: { type: string }
            url: { type: string }
            committed: { type: boolean }
            expired: { type: boolean }
    PublicFileLink:
      type: object
      required: [filename, contentType, sizeBytes, expiresAt, passwordRequired]
      properties:
        filename: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer }
        expiresAt: { type: [string, "null"], format: date-time }
        passwordRequired: { type: boolean }
    TransferLimitsInput:
      type: object
      required: [messageBytes, attachmentBytes, linkThresholdBytes, linkFileBytes, storageBytes]
      properties:
        messageBytes: { type: integer, minimum: 1 }
        attachmentBytes: { type: integer, minimum: 1 }
        linkThresholdBytes: { type: integer, minimum: 1 }
        linkFileBytes: { type: integer, minimum: 1 }
        storageBytes: { type: integer, minimum: 0 }
    TransferLimits:
      allOf:
        - { $ref: "#/components/schemas/TransferLimitsInput" }
        - type: object
          required: [usedBytes, maxInlineFiles, maxFileLinks, platform]
          properties:
            usedBytes: { type: integer }
            maxInlineFiles: { type: integer }
            maxFileLinks: { type: integer }
            platform:
              type: object
              required: [messageBytes, linkFileBytes, storageBytes]
              properties:
                messageBytes: { type: integer }
                linkFileBytes: { type: integer }
                storageBytes: { type: integer }
    IdentityProvider:
      type: object
      required: [id, slug, name, kind, issuer, clientId, hasClientSecret, hasWebhookSecret, webhookUrl, scopes, autoProvision, adminGroup, groupMappings, enabled, redirectUri]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        kind: { type: string, enum: [halo, generic] }
        issuer: { type: string }
        clientId: { type: string }
        hasClientSecret: { type: boolean }
        hasWebhookSecret: { type: boolean }
        webhookUrl: { type: string }
        scopes: { type: array, items: { type: string } }
        autoProvision: { type: boolean }
        adminGroup: { type: string }
        groupMappings: { type: array, items: { $ref: "#/components/schemas/GroupMapping" } }
        enabled: { type: boolean }
        redirectUri: { type: string }
    IdentityProviderInput:
      type: object
      required: [slug, name, kind, issuer, clientId]
      properties:
        slug: { type: string }
        name: { type: string }
        kind: { type: string, enum: [halo, generic] }
        issuer: { type: string }
        clientId: { type: string }
        clientSecret: { type: string, description: Write-only. Omit on update to keep the stored secret. }
        webhookSecret: { type: string, description: Write-only signing secret for lifecycle webhooks. Omit to keep, empty string to remove. }
        scopes: { type: array, items: { type: string } }
        autoProvision: { type: boolean }
        adminGroup: { type: string }
        groupMappings: { type: array, items: { $ref: "#/components/schemas/GroupMapping" } }
        enabled: { type: boolean }
    GroupMapping:
      type: object
      required: [group, orgId, role]
      properties:
        group: { type: string }
        orgId: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/Role" }
        customRoleId: { type: string, format: uuid, description: Required when role is custom. }
        domainIds: { type: array, items: { type: string, format: uuid }, description: Required for domain_admin; optional for custom roles. }
    OrgSecuritySettings:
      type: object
      required: [appPasswordCreated, externalForwardingRule, delegateAdded, newDeviceSignIn, failedSignIns, notifyAdmins, failedSignInThreshold]
      properties:
        appPasswordCreated: { type: boolean }
        externalForwardingRule: { type: boolean }
        delegateAdded: { type: boolean }
        newDeviceSignIn: { type: boolean }
        failedSignIns: { type: boolean }
        notifyAdmins: { type: boolean }
        failedSignInThreshold: { type: integer, minimum: 3, maximum: 50 }
    SecurityNotification:
      type: object
      required: [id, eventType, title, summary, mailboxAddress, details, actionUrl, canUndo, undoLabel, createdAt]
      properties:
        id: { type: string, format: uuid }
        eventType: { type: string, enum: [app_password_created, external_forwarding_rule, delegate_added, new_device_sign_in, failed_sign_ins] }
        title: { type: string }
        summary: { type: string }
        mailboxId: { type: [string, "null"], format: uuid }
        mailboxAddress: { type: string }
        details: { type: object, additionalProperties: true }
        actionUrl: { type: string }
        canUndo: { type: boolean }
        undoLabel: { type: string }
        readAt: { type: [string, "null"], format: date-time }
        undoneAt: { type: [string, "null"], format: date-time }
        reportedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }

