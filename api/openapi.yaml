openapi: 3.1.0
info:
  title: Aether API
  version: 0.1.0
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
servers:
  - url: /api/v1
security:
  - session: []
  - apiKey: []
tags:
  - name: auth
  - name: organizations
  - name: domains
  - name: mailboxes
  - name: aliases
  - name: members
  - name: app-passwords
  - name: mail
  - name: identity-providers
  - name: contacts
  - name: calendar
  - name: integrations
paths:
  /auth/providers:
    get:
      tags: [auth]
      security: []
      summary: Sign-in methods available on this installation
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [localLogin, providers]
                properties:
                  localLogin: { type: boolean }
                  providers:
                    type: array
                    items:
                      type: object
                      required: [slug, name, kind]
                      properties:
                        slug: { type: string }
                        name: { type: string }
                        kind: { type: string, enum: [halo, generic] }
  /auth/login:
    post:
      tags: [auth]
      security: []
      summary: Sign in with a local password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Signed in; sets the aether_session cookie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/oidc/{slug}/start:
    get:
      tags: [auth]
      security: []
      summary: Begin an OpenID Connect authorization code flow with PKCE
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: return_to, in: query, schema: { type: string } }
      responses:
        "302": { description: Redirect to the identity provider }
  /auth/oidc/{slug}/callback:
    get:
      tags: [auth]
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
      responses:
        "302": { description: "Redirect into the application, or to /login?error=<code>" }
  /auth/logout:
    post:
      tags: [auth]
      summary: End the session; returns the identity provider logout URL when applicable
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  redirect: { type: string }
  /session:
    get:
      tags: [auth]
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Error" }
  /organizations:
    get:
      tags: [organizations]
      summary: Organizations visible to the caller (all of them for platform administrators)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Organization" } }
    post:
      tags: [organizations]
      summary: Create an organization (platform administrators only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: { type: string }
                slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
  /organizations/{orgId}:
    get:
      tags: [organizations]
      parameters: [{ $ref: "#/components/parameters/orgId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "404": { $ref: "#/components/responses/Error" }
  /organizations/{orgId}/domains:
    get:
      tags: [domains]
      parameters: [{ $ref: "#/components/parameters/orgId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Domain" } }
    post:
      tags: [domains]
      summary: Add a domain. Domains added by platform administrators are verified immediately; others must pass DNS verification.
      parameters: [{ $ref: "#/components/parameters/orgId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Domain" }
        "409": { $ref: "#/components/responses/Error" }
  /domains/{domainId}:
    get:
      tags: [domains]
      parameters: [{ $ref: "#/components/parameters/domainId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Domain" }
    delete:
      tags: [domains]
      parameters: [{ $ref: "#/components/parameters/domainId" }]
      responses:
        "204": { description: "Deleted, including its mailboxes and aliases" }
  /domains/{domainId}/dns:
    get:
      tags: [domains]
      summary: Required DNS records and their live lookup status
      parameters: [{ $ref: "#/components/parameters/domainId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [records]
                properties:
                  records: { type: array, items: { $ref: "#/components/schemas/DNSRecord" } }
  /domains/{domainId}/verify:
    post:
      tags: [domains]
      summary: Check the _aether ownership TXT record and mark the domain verified
      parameters: [{ $ref: "#/components/parameters/domainId" }]
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Domain" }
        "422": { $ref: "#/components/responses/Error" }
  /organizations/{orgId}/mailboxes:
    get:
      tags: [mailboxes]
      parameters: [{ $ref: "#/components/parameters/orgId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Mailbox" } }
    post:
      tags: [mailboxes]
      summary: Create a mailbox. A user account with the mailbox address is created or linked as its owner.
      parameters: [{ $ref: "#/components/parameters/orgId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domainId, localPart]
              properties:
                domainId: { type: string, format: uuid }
                localPart: { type: string }
                displayName: { type: string }
                quotaBytes: { type: integer, minimum: 0 }
                password: { type: string, minLength: 12, description: Optional web sign-in password for the owner account }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mailbox" }
  /mailboxes/{mailboxId}:
    patch:
      tags: [mailboxes]
      parameters: [{ $ref: "#/components/parameters/mailboxId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string }
                quotaBytes: { type: integer, minimum: 0 }
                active: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mailbox" }
    delete:
      tags: [mailboxes]
      parameters: [{ $ref: "#/components/parameters/mailboxId" }]
      responses:
        "204": { description: Deleted. Stored mail on disk is retained for manual removal. }
  /organizations/{orgId}/aliases:
    get:
      tags: [aliases]
      parameters: [{ $ref: "#/components/parameters/orgId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Alias" } }
    post:
      tags: [aliases]
      summary: Create an alias. An empty localPart creates the domain catch-all.
      parameters: [{ $ref: "#/components/parameters/orgId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domainId, localPart, destinations]
              properties:
                domainId: { type: string, format: uuid }
                localPart: { type: string }
                destinations: { type: array, items: { type: string, format: email } }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Alias" }
  /aliases/{aliasId}:
    delete:
      tags: [aliases]
      parameters: [{ name: aliasId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Deleted }
  /organizations/{orgId}/members:
    get:
      tags: [members]
      parameters: [{ $ref: "#/components/parameters/orgId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Member" } }
    post:
      tags: [members]
      summary: Add an existing account to the organization or change its role. Granting or changing owner requires the owner role.
      parameters: [{ $ref: "#/components/parameters/orgId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [owner, admin, member] }
      responses:
        "204": { description: Saved }
        "422": { $ref: "#/components/responses/Error" }
  /domains/{domainId}/dmarc:
    get:
      tags: [domains]
      summary: DMARC aggregate reports received for the domain, grouped by sending IP address
      parameters:
        - { $ref: "#/components/parameters/domainId" }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 366, default: 30 } }
      responses:
        "200":
          description: Summary of reports whose period ended within the last `days` days
          content:
            application/json:
              schema:
                type: object
                properties:
                  days: { type: integer }
                  reports: { type: integer }
                  sources:
                    type: array
                    items:
                      type: object
                      properties:
                        sourceIp: { type: string }
                        messages: { type: integer }
                        dkimAligned: { type: integer }
                        spfAligned: { type: integer }
                        quarantined: { type: integer }
                        rejected: { type: integer }
                        reporters: { type: array, items: { type: string } }
                        headerFroms: { type: array, items: { type: string } }
  /calendar/export:
    get:
      tags: [calendar]
      summary: Download the personal calendar as one iCalendar file
      responses:
        "200":
          description: An iCalendar file with every event and the time zones they use
          content:
            text/calendar:
              schema: { type: string }
  /calendar/import:
    post:
      tags: [calendar]
      summary: Import events from an iCalendar file into the personal calendar
      description: Events are grouped by UID, so recurring events keep their exceptions. An event whose UID already exists is replaced.
      requestBody:
        required: true
        content:
          text/calendar:
            schema: { type: string, maxLength: 10485760 }
      responses:
        "200":
          description: Counts of imported, replaced, and skipped events
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported: { type: integer }
                  updated: { type: integer }
                  skipped: { type: integer }
        "422": { $ref: "#/components/responses/Error" }
  /organizations/{orgId}/api-keys:
    get:
      tags: [integrations]
      summary: List active API keys (session only)
      parameters: [{ $ref: "#/components/parameters/orgId" }]
      responses:
        "200":
          description: API keys without their tokens
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/APIKey" } }
    post:
      tags: [integrations]
      summary: Create an API key (session only). The token is returned once.
      parameters: [{ $ref: "#/components/parameters/orgId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string, maxLength: 100 }
                scopes:
                  type: array
                  items:
                    type: string
                    enum: ["domains:read", "domains:write", "mailboxes:read", "mailboxes:write", "aliases:read", "aliases:write", "members:read", "members:write", "audit:read", "audit:write", "webhooks:read", "webhooks:write"]
                expiresAt: { type: string, format: date-time }
      responses:
        "201":
          description: The key and its token
          content:
            application/json:
              schema:
                type: object
                properties:
                  key: { $ref: "#/components/schemas/APIKey" }
                  token: { type: string }
  /api-keys/{keyId}:
    delete:
      tags: [integrations]
      summary: Revoke an API key (session only)
      parameters: [{ name: keyId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/Error" }
  /organizations/{orgId}/webhooks:
    get:
      tags: [integrations]
      summary: List webhooks
      parameters: [{ $ref: "#/components/parameters/orgId" }]
      responses:
        "200":
          description: Webhooks
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Webhook" } }
    post:
      tags: [integrations]
      summary: Create a webhook. The signing secret is returned once.
      description: "Every audit event in the organization (for example mailbox.create or domain.verify) is posted to the URL as JSON. The Aether-Signature header is t=<unix time>,v1=<hex HMAC-SHA256 of t + '.' + body> using the secret. Failed deliveries are retried for about two days."
      parameters: [{ $ref: "#/components/parameters/orgId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url: { type: string, format: uri, description: Must be https and must resolve to a public address }
                events: { type: array, items: { type: string }, description: "Audit action names, or * for all" }
      responses:
        "201":
          description: The webhook and its secret
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhook: { $ref: "#/components/schemas/Webhook" }
                  secret: { type: string }
  /webhooks/{webhookId}:
    delete:
      tags: [integrations]
      summary: Delete a webhook and its delivery history
      parameters: [{ name: webhookId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
  /webhooks/{webhookId}/deliveries:
    get:
      tags: [integrations]
      summary: The 50 most recent deliveries
      parameters: [{ name: webhookId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: Deliveries, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    event: { type: string }
                    status: { type: string, enum: [pending, delivered, failed] }
                    attempts: { type: integer }
                    responseCode: { type: [integer, "null"] }
                    lastError: { type: [string, "null"] }
                    createdAt: { type: string, format: date-time }
                    deliveredAt: { type: [string, "null"], format: date-time }
  /webhooks/{webhookId}/test:
    post:
      tags: [integrations]
      summary: Queue a webhook.test delivery
      parameters: [{ name: webhookId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "202": { description: Queued }
  /organizations/{orgId}/audit:
    get:
      tags: [organizations]
      parameters:
        - { $ref: "#/components/parameters/orgId" }
        - { name: before, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Newest first, 50 per page
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }
  /me/mailboxes:
    get:
      tags: [mail]
      summary: Mailboxes the caller can open in Aether Mail
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Mailbox" } }
  /me/app-passwords:
    get:
      tags: [app-passwords]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AppPassword" } }
    post:
      tags: [app-passwords]
      summary: Create an IMAP/SMTP app password. The secret is returned once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, mailboxId]
              properties:
                name: { type: string }
                mailboxId: { type: string, format: uuid }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/AppPassword" }
                  - type: object
                    required: [password]
                    properties:
                      password: { type: string }
  /me/app-passwords/{id}:
    delete:
      tags: [app-passwords]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Revoked }
  /mailboxes/{mailboxId}/folders:
    get:
      tags: [mail]
      parameters: [{ $ref: "#/components/parameters/mailboxId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Folder" } }
  /mailboxes/{mailboxId}/messages:
    get:
      tags: [mail]
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
        - { $ref: "#/components/parameters/folder" }
        - { name: q, in: query, description: Server-side full text search, schema: { type: string } }
        - { name: threads, in: query, description: "Group conversations with THREAD=REFERENCES. Each row is the newest message; threadUids lists the conversation newest first.", schema: { type: boolean } }
        - { name: before, in: query, description: Return messages with a UID lower than this cursor, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema:
                type: object
                required: [messages, total]
                properties:
                  messages: { type: array, items: { $ref: "#/components/schemas/MessageSummary" } }
                  total: { type: integer }
                  nextCursor: { type: [integer, "null"] }
  /mailboxes/{mailboxId}/messages/{uid}:
    get:
      tags: [mail]
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
        - { $ref: "#/components/parameters/uid" }
        - { $ref: "#/components/parameters/folder" }
      responses:
        "200":
          description: Message with sanitized HTML. Remote resources are stripped.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
    patch:
      tags: [mail]
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
        - { $ref: "#/components/parameters/uid" }
        - { $ref: "#/components/parameters/folder" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                seen: { type: boolean }
                flagged: { type: boolean }
      responses:
        "204": { description: Updated }
    delete:
      tags: [mail]
      summary: Move to Trash, or delete permanently when already in Trash
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
        - { $ref: "#/components/parameters/uid" }
        - { $ref: "#/components/parameters/folder" }
      responses:
        "204": { description: Deleted }
  /mailboxes/{mailboxId}/messages/{uid}/move:
    post:
      tags: [mail]
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
        - { $ref: "#/components/parameters/uid" }
        - { $ref: "#/components/parameters/folder" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { type: string }
      responses:
        "204": { description: Moved }
  /mailboxes/{mailboxId}/messages/{uid}/invitation:
    post:
      tags: [mail, calendar]
      summary: Respond to the calendar invitation, reply, or cancellation in a message
      description: |
        accepted, tentative, and declined answer an invitation. Accepting adds the event to the personal calendar, declining removes it, and each sends a reply to the organizer.
        apply updates the sender's response on an event you organize. remove takes a cancelled event out of the calendar.
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
        - { $ref: "#/components/parameters/uid" }
        - { $ref: "#/components/parameters/folder" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response]
              properties:
                response: { type: string, enum: [accepted, tentative, declined, apply, remove] }
      responses:
        "200":
          description: The invitation after the response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/messages/{uid}/attachments/{part}:
    get:
      tags: [mail]
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
        - { $ref: "#/components/parameters/uid" }
        - { $ref: "#/components/parameters/folder" }
        - { name: part, in: path, required: true, schema: { type: string, pattern: "^[0-9]+(\\.[0-9]+)*$" } }
      responses:
        "200": { description: "Attachment bytes, served as a download" }
  /mailboxes/{mailboxId}/delegates:
    get:
      tags: [mailboxes]
      summary: People with full access to this mailbox besides its owner
      parameters: [{ $ref: "#/components/parameters/mailboxId" }]
      responses:
        "200":
          description: Delegates
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Delegate" } }
    post:
      tags: [mailboxes]
      summary: Give an organization member full access, including sending as the mailbox and app passwords for it
      parameters: [{ $ref: "#/components/parameters/mailboxId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: The delegate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Delegate" }
        "422": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/delegates/{userId}:
    delete:
      tags: [mailboxes]
      summary: Remove a delegate and revoke the app passwords they created for this mailbox
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/send:
    post:
      tags: [mail]
      summary: Submit a message through the SMTP submission service and save it to Sent, or schedule it when sendAt is set
      parameters: [{ $ref: "#/components/parameters/mailboxId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OutgoingMessage" }
      responses:
        "202":
          description: Accepted by the submission service, or a ScheduledMessage when sendAt was set
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      messageId: { type: string }
                  - { $ref: "#/components/schemas/ScheduledMessage" }
  /mailboxes/{mailboxId}/scheduled:
    get:
      tags: [mail]
      summary: List messages waiting to be sent, including ones that failed
      parameters: [{ $ref: "#/components/parameters/mailboxId" }]
      responses:
        "200":
          description: Scheduled messages, earliest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ScheduledMessage" } }
  /mailboxes/{mailboxId}/scheduled/{scheduledId}:
    delete:
      tags: [mail]
      summary: Cancel a scheduled message and put it back in Drafts
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
        - { name: scheduledId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The restored draft
          content:
            application/json:
              schema:
                type: object
                properties:
                  uid: { type: integer }
                  folder: { type: string }
        "404": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/messages/{uid}/snooze:
    post:
      tags: [mail]
      summary: Move a message to the Snoozed folder until a time, then back to its folder as unread
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
        - { $ref: "#/components/parameters/uid" }
        - { $ref: "#/components/parameters/folder" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [until]
              properties:
                until: { type: string, format: date-time }
      responses:
        "200":
          description: The message's UID in the Snoozed folder
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnoozedMessage" }
  /mailboxes/{mailboxId}/snoozed:
    get:
      tags: [mail]
      summary: List snoozed messages by their UID in the Snoozed folder
      parameters: [{ $ref: "#/components/parameters/mailboxId" }]
      responses:
        "200":
          description: Snoozed messages, earliest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SnoozedMessage" } }
  /mailboxes/{mailboxId}/snoozed/{uid}:
    delete:
      tags: [mail]
      summary: Return a snoozed message to its folder now
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
        - { $ref: "#/components/parameters/uid" }
      responses:
        "204": { description: Returned }
        "404": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/drafts:
    put:
      tags: [mail]
      summary: Save a draft to the Drafts folder, replacing draftUid when given
      description: Recipients are optional. Bcc is stored in the draft. Use forwardFrom with the returned folder and uid to keep the draft's attachments on later saves and on send.
      parameters: [{ $ref: "#/components/parameters/mailboxId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OutgoingMessage" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                required: [uid, folder, attachments]
                properties:
                  uid: { type: integer }
                  folder: { type: string }
                  attachments: { type: array, items: { $ref: "#/components/schemas/Attachment" } }
  /mailboxes/{mailboxId}/drafts/{uid}:
    delete:
      tags: [mail]
      summary: Permanently delete a draft
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
        - { $ref: "#/components/parameters/uid" }
      responses:
        "204": { description: Deleted }
  /mailboxes/{mailboxId}/rules:
    get:
      tags: [mail]
      summary: Mail rules for this mailbox, in the order they run
      parameters: [{ $ref: "#/components/parameters/mailboxId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/MailRule" } }
    put:
      tags: [mail]
      summary: Replace all rules. They are compiled to Sieve and installed on the mail server before the response is sent.
      parameters: [{ $ref: "#/components/parameters/mailboxId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/MailRule" } }
      responses:
        "200":
          description: Saved and installed
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/MailRule" } }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/auto-reply:
    get:
      tags: [mail]
      parameters: [{ $ref: "#/components/parameters/mailboxId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutoReply" }
    put:
      tags: [mail]
      summary: Set the automatic reply. Each sender receives it at most once a day; lists and automated mail are skipped.
      parameters: [{ $ref: "#/components/parameters/mailboxId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutoReply" }
      responses:
        "200":
          description: Saved and installed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutoReply" }
        "422": { $ref: "#/components/responses/Error" }
  /contacts:
    get:
      tags: [contacts]
      summary: The caller's contacts, also served over CardDAV
      parameters: [{ name: q, in: query, schema: { type: string }, description: Matches name or email }]
      responses:
        "200":
          description: Sorted by name, at most 500
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Contact" } }
    post:
      tags: [contacts]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contact" }
        "422": { $ref: "#/components/responses/Error" }
  /contacts/{id}:
    put:
      tags: [contacts]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contact" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [contacts]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Deleted }
  /directory:
    get:
      tags: [contacts]
      summary: Active mailboxes in the caller's organizations
      parameters: [{ name: q, in: query, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Recipient" } }
  /recipients:
    get:
      tags: [contacts]
      summary: Up to 10 recipient suggestions from contacts and the directory
      parameters: [{ name: q, in: query, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Recipient" } }
  /calendar/events:
    get:
      tags: [calendar]
      summary: Events in a time range, with repeating events expanded into occurrences
      parameters:
        - { name: start, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: end, in: query, required: true, schema: { type: string, format: date-time }, description: At most 400 days after start }
      responses:
        "200":
          description: Sorted by start
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CalendarEvent" } }
    post:
      tags: [calendar]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CalendarEventInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarEvent" }
        "422": { $ref: "#/components/responses/Error" }
  /calendar/events/{id}:
    put:
      tags: [calendar]
      summary: Replace an event; for repeating events this changes the whole series
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CalendarEventInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarEvent" }
    delete:
      tags: [calendar]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: "Deleted, including every occurrence" }
  /admin/identity-providers:
    get:
      tags: [identity-providers]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/IdentityProvider" } }
    post:
      tags: [identity-providers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdentityProviderInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityProvider" }
  /admin/identity-providers/{id}:
    put:
      tags: [identity-providers]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdentityProviderInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityProvider" }
    delete:
      tags: [identity-providers]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Deleted }
  /admin/users/{id}:
    patch:
      tags: [members]
      summary: Suspend or restore an account everywhere (platform administrators only). Suspension ends all sessions and blocks app passwords.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, suspended] }
      responses:
        "204": { description: Saved }
        "422": { $ref: "#/components/responses/Error" }
  /hooks/identity-providers/{slug}:
    post:
      tags: [identity-providers]
      security: []
      summary: Receive signed lifecycle events from an identity provider (Halo webhook format)
      description: >-
        Requires the Halo-Signature header, t=<unix seconds>,v1=<hex HMAC-SHA256 of "t." + body> using the provider's webhook secret, within five minutes.
        user.suspend, scim.user.suspend and scim.user.deprovision suspend the linked account; user.restore and scim.user.restore restore it only if the provider suspended it;
        session.revoke ends its sessions. Duplicate event ids are ignored.
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Accepted }
        "401": { $ref: "#/components/responses/Error" }
  /admin/identity-providers/discover:
    post:
      tags: [identity-providers]
      summary: Fetch and validate an issuer's OpenID Connect discovery document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issuer]
              properties:
                issuer: { type: string, format: uri }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [issuer, authorizationEndpoint, tokenEndpoint, scopesSupported, pkceS256, groupsClaim, redirectUri]
                properties:
                  issuer: { type: string }
                  authorizationEndpoint: { type: string }
                  tokenEndpoint: { type: string }
                  userinfoEndpoint: { type: string }
                  endSessionEndpoint: { type: string }
                  scopesSupported: { type: array, items: { type: string } }
                  pkceS256: { type: boolean }
                  groupsClaim: { type: boolean }
                  redirectUri: { type: string, description: "Callback URL to register at the provider; contains {slug}" }
        "422": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: aether_session
      description: State-changing requests must also send the session csrfToken in the X-CSRF-Token header.
    apiKey:
      type: http
      scheme: bearer
      description: "An organization API key (aether_...). Keys work only on organization administration endpoints: domains, mailboxes, aliases, members, audit, and webhooks. Each needs the matching resource:read or resource:write scope. No CSRF header is needed."
  parameters:
    orgId: { name: orgId, in: path, required: true, schema: { type: string, format: uuid } }
    domainId: { name: domainId, in: path, required: true, schema: { type: string, format: uuid } }
    mailboxId: { name: mailboxId, in: path, required: true, schema: { type: string, format: uuid } }
    uid: { name: uid, in: path, required: true, schema: { type: integer } }
    folder: { name: folder, in: query, schema: { type: string, default: INBOX } }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code: { type: string }
                  message: { type: string }
  schemas:
    User:
      type: object
      required: [id, email, displayName, isPlatformAdmin, status]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        displayName: { type: string }
        isPlatformAdmin: { type: boolean }
        status: { type: string, enum: [active, suspended, deprovisioned] }
    Session:
      type: object
      required: [user, memberships, csrfToken]
      properties:
        user: { $ref: "#/components/schemas/User" }
        csrfToken: { type: string }
        memberships:
          type: array
          items:
            type: object
            required: [orgId, orgName, orgSlug, role]
            properties:
              orgId: { type: string, format: uuid }
              orgName: { type: string }
              orgSlug: { type: string }
              role: { type: string, enum: [owner, admin, member] }
    Organization:
      type: object
      required: [id, name, slug, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        createdAt: { type: string, format: date-time }
    Domain:
      type: object
      required: [id, orgId, name, verified, verificationToken, dkimSelector, dkimRecord, active, createdAt]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        name: { type: string }
        verified: { type: boolean }
        verifiedAt: { type: [string, "null"], format: date-time }
        verificationToken: { type: string }
        dkimSelector: { type: string }
        dkimRecord: { type: string, description: TXT value to publish at <selector>._domainkey.<domain> }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
    DNSRecord:
      type: object
      required: [type, name, value, purpose, status, found]
      properties:
        type: { type: string, enum: [MX, TXT, CNAME, PTR] }
        name: { type: string }
        value: { type: string }
        purpose: { type: string, enum: [verification, mx, spf, dkim, dmarc] }
        status: { type: string, enum: [ok, missing, mismatch, error] }
        found: { type: array, items: { type: string } }
    Mailbox:
      type: object
      required: [id, orgId, domainId, address, localPart, displayName, quotaBytes, active, createdAt]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        domainId: { type: string, format: uuid }
        address: { type: string }
        localPart: { type: string }
        displayName: { type: string }
        ownerUserId: { type: [string, "null"], format: uuid }
        quotaBytes: { type: integer }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
    Alias:
      type: object
      required: [id, orgId, domainId, address, localPart, destinations, active]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        domainId: { type: string, format: uuid }
        address: { type: string }
        localPart: { type: string }
        destinations: { type: array, items: { type: string } }
        active: { type: boolean }
    Member:
      type: object
      required: [userId, email, displayName, role, status]
      properties:
        userId: { type: string, format: uuid }
        email: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [owner, admin, member] }
        status: { type: string }
    AuditEvent:
      type: object
      required: [id, createdAt, action, targetType, targetId]
      properties:
        id: { type: integer }
        createdAt: { type: string, format: date-time }
        actorEmail: { type: [string, "null"] }
        action: { type: string }
        targetType: { type: string }
        targetId: { type: string }
        ip: { type: string }
    AppPassword:
      type: object
      required: [id, name, mailboxId, mailboxAddress, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        mailboxId: { type: string, format: uuid }
        mailboxAddress: { type: string }
        createdAt: { type: string, format: date-time }
    Folder:
      type: object
      required: [name, specialUse, total, unread]
      properties:
        name: { type: string }
        specialUse: { type: string, enum: ["", inbox, drafts, sent, trash, junk, archive] }
        total: { type: integer }
        unread: { type: integer }
    Address:
      type: object
      required: [address]
      properties:
        name: { type: string }
        address: { type: string }
    MessageSummary:
      type: object
      required: [uid, subject, from, to, date, seen, flagged, answered, hasAttachments, size]
      properties:
        uid: { type: integer }
        subject: { type: string }
        from: { type: array, items: { $ref: "#/components/schemas/Address" } }
        to: { type: array, items: { $ref: "#/components/schemas/Address" } }
        date: { type: string, format: date-time }
        seen: { type: boolean }
        flagged: { type: boolean }
        answered: { type: boolean }
        hasAttachments: { type: boolean }
        size: { type: integer }
        threadUids: { type: array, items: { type: integer }, description: Present when threads=true and the conversation has more than one message }
    Message:
      allOf:
        - { $ref: "#/components/schemas/MessageSummary" }
        - type: object
          required: [cc, bcc, replyTo, messageId, inReplyTo, references, text, html, attachments]
          properties:
            cc: { type: array, items: { $ref: "#/components/schemas/Address" } }
            bcc: { type: array, items: { $ref: "#/components/schemas/Address" }, description: Present only in drafts and sent copies that carry a Bcc header }
            replyTo: { type: array, items: { $ref: "#/components/schemas/Address" } }
            messageId: { type: string }
            inReplyTo: { type: string }
            references: { type: array, items: { type: string } }
            text: { type: string }
            html: { type: string, description: Sanitized HTML. Render inside a sandboxed iframe. }
            attachments: { type: array, items: { $ref: "#/components/schemas/Attachment" } }
            invitation: { $ref: "#/components/schemas/Invitation" }
    Invitation:
      type: object
      required: [method, event, organizer, status, applied]
      properties:
        method: { type: string, enum: [request, reply, cancel] }
        event: { $ref: "#/components/schemas/CalendarEvent" }
        organizer: { $ref: "#/components/schemas/Address" }
        status: { type: string, enum: ["", needs-action, accepted, tentative, declined], description: Your response to a request, or the sender's response in a reply }
        eventId: { type: string, description: The matching event in your calendar, if there is one }
        applied: { type: boolean, description: Whether your calendar already reflects this message }
    Attendee:
      type: object
      required: [address, status]
      properties:
        name: { type: string }
        address: { type: string }
        status: { type: string, enum: [needs-action, accepted, tentative, declined] }
    AutoReply:
      type: object
      required: [enabled, subject, message]
      properties:
        enabled: { type: boolean }
        subject: { type: string, maxLength: 200 }
        message: { type: string, maxLength: 10000 }
        start: { type: string, format: date, description: First day replies are sent }
        end: { type: string, format: date, description: Last day replies are sent }
    Contact:
      type: object
      required: [id, name, emails, phones, organization, notes]
      properties:
        id: { type: string }
        name: { type: string }
        emails: { type: array, items: { type: string } }
        phones: { type: array, items: { type: string } }
        organization: { type: string }
        notes: { type: string }
    ContactInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 200 }
        emails: { type: array, maxItems: 10, items: { type: string, format: email } }
        phones: { type: array, maxItems: 10, items: { type: string } }
        organization: { type: string }
        notes: { type: string, maxLength: 5000 }
    Recipient:
      type: object
      required: [name, address, source]
      properties:
        name: { type: string }
        address: { type: string }
        source: { type: string, enum: [contact, directory] }
    CalendarEvent:
      type: object
      required: [id, title, start, end, seriesStart, allDay, location, description, repeat, attendees]
      properties:
        id: { type: string }
        title: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        seriesStart: { type: string, format: date-time, description: Start of the first occurrence; equals start for events that do not repeat }
        allDay: { type: boolean }
        location: { type: string }
        description: { type: string }
        repeat: { type: string, enum: ["", daily, weekly, monthly, yearly, custom] }
        organizer: { type: string, description: Present when the event has attendees }
        attendees: { type: array, items: { $ref: "#/components/schemas/Attendee" } }
    CalendarEventInput:
      type: object
      required: [title, start, end]
      properties:
        title: { type: string, maxLength: 300 }
        start: { type: string, format: date-time, description: For all-day events, send local midnight with its UTC offset; the date part is stored }
        end: { type: string, format: date-time, description: Exclusive; for all-day events the midnight after the last day }
        allDay: { type: boolean }
        location: { type: string }
        description: { type: string }
        repeat: { type: string, enum: ["", daily, weekly, monthly, yearly] }
        attendees:
          type: array
          maxItems: 100
          items: { type: string, format: email }
          description: Saving sends invitations to these addresses from your own mailbox; removed attendees get a cancellation
    MailRule:
      type: object
      required: [name, enabled, match, conditions, actions]
      properties:
        name: { type: string, maxLength: 100 }
        enabled: { type: boolean }
        match: { type: string, enum: [all, any] }
        conditions:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [field, contains]
            properties:
              field: { type: string, enum: [from, to, cc, subject] }
              contains: { type: string, maxLength: 500, description: Case-insensitive substring of the header }
        actions:
          type: object
          description: At least one of moveTo, markRead, flag, or forwardTo.
          properties:
            moveTo: { type: string, description: Existing folder name }
            markRead: { type: boolean }
            flag: { type: boolean }
            forwardTo: { type: array, maxItems: 5, items: { type: string, format: email }, description: Forwarded with this mailbox as the envelope sender }
            keepCopy: { type: boolean, description: Also keep the message in this mailbox when forwarding }
            stop: { type: boolean, description: Skip later rules for matching messages }
    Attachment:
      type: object
      required: [part, filename, contentType, size]
      properties:
        part: { type: string }
        filename: { type: string }
        contentType: { type: string }
        size: { type: integer }
    Delegate:
      type: object
      properties:
        userId: { type: string, format: uuid }
        email: { type: string }
        displayName: { type: string }
        createdAt: { type: string, format: date-time }
    APIKey:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string, description: The first characters of the token, for recognizing it }
        scopes: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, "null"], format: date-time }
        expiresAt: { type: [string, "null"], format: date-time }
    Webhook:
      type: object
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        events: { type: array, items: { type: string } }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
    ScheduledMessage:
      type: object
      required: [id, sendAt, subject, to, error]
      properties:
        id: { type: string, format: uuid }
        sendAt: { type: string, format: date-time }
        subject: { type: string }
        to: { type: array, items: { $ref: "#/components/schemas/Address" } }
        error: { type: [string, "null"], description: Set when sending failed after five attempts }
    SnoozedMessage:
      type: object
      required: [uid, until, returnFolder]
      properties:
        uid: { type: integer }
        until: { type: string, format: date-time }
        returnFolder: { type: string }
    OutgoingMessage:
      type: object
      required: [to, subject]
      properties:
        to: { type: array, items: { $ref: "#/components/schemas/Address" }, minItems: 1 }
        cc: { type: array, items: { $ref: "#/components/schemas/Address" } }
        bcc: { type: array, items: { $ref: "#/components/schemas/Address" } }
        subject: { type: string }
        text: { type: string }
        html: { type: string }
        inReplyTo: { type: string }
        references: { type: array, items: { type: string } }
        attachments:
          type: array
          maxItems: 20
          description: Up to 20 files and 20 MB in total, including forwarded attachments.
          items:
            type: object
            required: [filename, data]
            properties:
              filename: { type: string }
              contentType: { type: string }
              data: { type: string, format: byte, description: Base64-encoded file contents }
        forwardFrom:
          type: object
          description: Attach attachments of this message in the same mailbox, read on the server. Limit to specific parts with parts.
          required: [folder, uid]
          properties:
            folder: { type: string }
            uid: { type: integer }
            parts: { type: array, items: { type: string } }
        draftUid: { type: integer, description: The draft this message replaces. On send it is deleted from Drafts. }
        sendAt: { type: string, format: date-time, description: Schedule the message instead of sending it now. The Date header is set to this time. }
    IdentityProvider:
      type: object
      required: [id, slug, name, kind, issuer, clientId, hasClientSecret, hasWebhookSecret, webhookUrl, scopes, autoProvision, adminGroup, groupMappings, enabled, redirectUri]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        kind: { type: string, enum: [halo, generic] }
        issuer: { type: string }
        clientId: { type: string }
        hasClientSecret: { type: boolean }
        hasWebhookSecret: { type: boolean }
        webhookUrl: { type: string }
        scopes: { type: array, items: { type: string } }
        autoProvision: { type: boolean }
        adminGroup: { type: string }
        groupMappings: { type: array, items: { $ref: "#/components/schemas/GroupMapping" } }
        enabled: { type: boolean }
        redirectUri: { type: string }
    IdentityProviderInput:
      type: object
      required: [slug, name, kind, issuer, clientId]
      properties:
        slug: { type: string }
        name: { type: string }
        kind: { type: string, enum: [halo, generic] }
        issuer: { type: string }
        clientId: { type: string }
        clientSecret: { type: string, description: Write-only. Omit on update to keep the stored secret. }
        webhookSecret: { type: string, description: Write-only signing secret for lifecycle webhooks. Omit to keep, empty string to remove. }
        scopes: { type: array, items: { type: string } }
        autoProvision: { type: boolean }
        adminGroup: { type: string }
        groupMappings: { type: array, items: { $ref: "#/components/schemas/GroupMapping" } }
        enabled: { type: boolean }
    GroupMapping:
      type: object
      required: [group, orgId, role]
      properties:
        group: { type: string }
        orgId: { type: string, format: uuid }
        role: { type: string, enum: [owner, admin, member] }
