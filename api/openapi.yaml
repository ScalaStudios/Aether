openapi: 3.1.0
info:
  title: Aether API
  version: 0.1.0
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
servers:
  - url: /api/v1
security:
  - session: []
  - apiKey: []
tags:
  - name: auth
  - name: organizations
  - name: domains
  - name: mailboxes
  - name: aliases
  - name: members
  - name: app-passwords
  - name: security
  - name: mail
  - name: identity-providers
  - name: mail-queue
  - name: contacts
  - name: calendar
  - name: notifications
  - name: integrations
  - name: branding
  - name: mail-flow
  - name: message-trace
  - name: outbound-routing
paths:
  /auth/providers:
    get:
      tags: [auth]
      security: []
      summary: Sign-in methods available on this installation
      parameters:
        - { name: host, in: query, schema: { type: string }, description: "The host name the page is served on, used to resolve the organization's default language" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [localLogin, providers, defaultLocale]
                properties:
                  localLogin: { type: boolean }
                  defaultLocale: { type: string }
                  providers:
                    type: array
                    items:
                      type: object
                      required: [slug, name, kind]
                      properties:
                        slug: { type: string }
                        name: { type: string }
                        kind: { type: string, enum: [halo, generic] }
  /auth/login:
    post:
      tags: [auth]
      security: []
      summary: Sign in with a local password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      description: When the account has two-factor authentication, the password alone does not sign in. The answer then holds twoFactor instead of a session and sets a short-lived aether_two_factor cookie; finish with POST /auth/login/two-factor within 5 minutes.
      responses:
        "200":
          description: Signed in and the aether_session cookie set, or a second factor is needed
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/Session" }
                  - type: object
                    required: [twoFactor]
                    properties:
                      twoFactor: { $ref: "#/components/schemas/TwoFactorPrompt" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/login/two-factor:
    post:
      tags: [auth]
      security: []
      summary: Finish a password sign-in with a second factor
      description: Send exactly one of code (from the authenticator app), recoveryCode, or securityKey (a WebAuthn assertion over the challenge from the sign-in answer, with binary fields in standard base64). Needs the aether_two_factor cookie from POST /auth/login. A wrong answer returns 401 invalid_code; after 5 wrong answers, or after 5 minutes, the sign-in ends with 401 two_factor_expired and has to start again with the password. Each authenticator code and recovery code works once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string, pattern: "^[0-9]{6}$" }
                recoveryCode: { type: string }
                securityKey:
                  type: object
                  required: [id, clientDataJSON, authenticatorData, signature]
                  properties:
                    id: { type: string, format: byte }
                    clientDataJSON: { type: string, format: byte }
                    authenticatorData: { type: string, format: byte }
                    signature: { type: string, format: byte }
      responses:
        "200":
          description: Signed in; sets the aether_session cookie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/oidc/{slug}/start:
    get:
      tags: [auth]
      security: []
      summary: Begin an OpenID Connect authorization code flow with PKCE
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: return_to, in: query, schema: { type: string } }
      responses:
        "302": { description: Redirect to the identity provider }
  /auth/oidc/{slug}/callback:
    get:
      tags: [auth]
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
      responses:
        "302": { description: "Redirect into the application, or to /login?error=<code>" }
  /auth/logout:
    post:
      tags: [auth]
      summary: End the session; returns the identity provider logout URL when applicable
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  redirect: { type: string }
  /session:
    get:
      tags: [auth]
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Error" }
  /organizations:
    get:
      tags: [organizations]
      summary: Organizations visible to the caller (all of them for platform administrators)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Organization" } }
    post:
      tags: [organizations]
      summary: Create an organization (platform administrators only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: { type: string }
                slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
                defaultLocale: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
  /organizations/{orgId}:
    get:
      tags: [organizations]
      parameters: [{ $ref: "#/components/parameters/orgId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [organizations]
      summary: Change organization settings
      description: Administrators only. API keys cannot use this route. mailboxProtocols applies to mailboxes created afterwards, including mailboxes created at single sign-on; existing mailboxes keep their protocols.
      parameters: [{ $ref: "#/components/parameters/orgId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deletedItemRetentionDays: { type: integer, minimum: 1, maximum: 30, description: Days that permanently deleted messages stay recoverable }
                spamLearning: { type: boolean, description: Whether the spam filter learns from messages moved into and out of Junk }
                mailboxProtocols: { $ref: "#/components/schemas/Protocols" }
                defaultLocale: { type: string, description: "Language for people who have not chosen one: en, es or pt, or empty for the browser language" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /branding:
    get:
      tags: [branding]
      summary: The branding for this browser
      description: "For a signed-in member, the branding of their organization, preferring the one that owns host. Otherwise the branding of the organization with a verified domain that host equals or is a subdomain of. null when there is none, and Aether's own look applies."
      security: []
      parameters:
        - { name: host, in: query, schema: { type: string }, description: "The host name the page is served on, such as mail.example.com" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/Branding" }
                  - { type: "null" }
  /branding/{orgId}/{asset}:
    get:
      tags: [branding]
      summary: An organization's logo, favicon or custom stylesheet
      description: "Public and cached for five minutes. custom.css is not served while AETHER_CUSTOM_CSS is false."
      security: []
      parameters:
        - { $ref: "#/components/parameters/orgId" }
        - { name: asset, in: path, required: true, schema: { type: string, enum: [logo-light, logo-dark, favicon, custom.css] } }
      responses:
        "200":
          description: The image or the stylesheet
          content:
            image/png: {}
            image/jpeg: {}
            image/webp: {}
            text/css: {}
        "404": { $ref: "#/components/responses/Error" }
  /organizations/{orgId}/branding:
    parameters: [{ $ref: "#/components/parameters/orgId" }]
    get:
      tags: [branding]
      summary: The organization's branding settings (owners and administrators)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationBranding" }
        "403": { $ref: "#/components/responses/Error" }
    put:
      tags: [branding]
      summary: Replace the name, sign-in message, colours and custom CSS
      description: "Recorded in the audit log as branding.update with the fields that changed. Custom CSS may not use @import, image-set() or src(), and url() must point at this server or be a data: URL."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrandingSettings" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationBranding" }
        "422": { $ref: "#/components/responses/Error" }
  /organizations/{orgId}/branding/{image}:
    parameters:
      - { $ref: "#/components/parameters/orgId" }
      - { name: image, in: path, required: true, schema: { type: string, enum: [logo-light, logo-dark, favicon] } }
    put:
      tags: [branding]
      summary: Upload a logo or the favicon
      description: "The body is the image: PNG, JPEG or WebP, up to 256 KB and 2048 by 2048 pixels. Recorded in the audit log as branding.image.update."
      requestBody:
        required: true
        content:
          image/png: { schema: { type: string, format: binary } }
          image/jpeg: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationBranding" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [branding]
      summary: Remove a logo or the favicon
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationBranding" }
        "404": { $ref: "#/components/responses/Error" }
  /organizations/{orgId}/quota-warnings:
    parameters: [{ $ref: "#/components/parameters/orgId" }]
    get:
      tags: [mailboxes]
      summary: When the organization's mailboxes get storage warnings (owners and administrators)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuotaWarnings" }
        "403": { $ref: "#/components/responses/Error" }
    put:
      tags: [mailboxes]
      summary: Change the storage warning levels
      description: "Recorded in the audit log as organization.quota_warnings.update. An empty percents list turns the warnings off."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuotaWarnings" }
      responses:
        "200":
          description: Saved, with the levels sorted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuotaWarnings" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /organizations/{orgId}/transfer-limits:
    parameters: [{ $ref: "#/components/parameters/orgId" }]
    get:
      tags: [organizations]
      summary: The organization's message and download-link limits (owners and administrators)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferLimits" }
        "403": { $ref: "#/components/responses/Error" }
    put:
      tags: [organizations]
      summary: Replace the organization's message and download-link limits
      description: "Recorded in the audit log as transfer_limits.update. Every size must stay within the platform ceilings, the attachment total cannot exceed the message size, and the link threshold cannot exceed the attachment total or the largest link."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferLimitsInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferLimits" }
        "422": { $ref: "#/components/responses/Error" }
  /organizations/{orgId}/file-links:
    parameters: [{ $ref: "#/components/parameters/orgId" }]
    get:
      tags: [organizations]
      summary: Download links stored for this organization, newest first
      description: Up to 200 links, including ones that have expired and ones that have not been sent. Owners and administrators only.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/FileLinkRecord" } }
        "403": { $ref: "#/components/responses/Error" }
  /organizations/{orgId}/file-links/{linkId}:
    parameters:
      - { $ref: "#/components/parameters/orgId" }
      - { name: linkId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [organizations]
      summary: Delete a download link and its file
      description: Recorded in the audit log as file_link.delete. The address stops working.
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
  /organizations/{orgId}/signature-templates:
    parameters: [{ $ref: "#/components/parameters/orgId" }]
    get:
      tags: [branding]
      summary: The organization's signature templates (owners and administrators)
      description: "templates holds the organization-wide template, with domainId null, and the templates of individual domains. builtIn is the layout used while the organization has none."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [builtIn, templates]
                properties:
                  builtIn: { $ref: "#/components/schemas/SignatureTemplate" }
                  templates: { type: array, items: { $ref: "#/components/schemas/SignatureTemplate" } }
    put:
      tags: [branding]
      summary: Save the organization-wide template, or a domain's own template
      description: "Recorded in the audit log as signature_template.update."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignatureTemplate" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignatureTemplate" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [branding]
      summary: Remove a template
      description: "Without domainId, removes the organization-wide template and the built-in layout applies again. With domainId, that domain goes back to the organization-wide template."
      parameters:
        - { name: domainId, in: query, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/Error" }
  /organizations/{orgId}/signature-templates/preview:
    post:
      tags: [branding]
      summary: Fill in a template for one of the organization's mailboxes without saving it
      parameters: [{ $ref: "#/components/parameters/orgId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/SignatureTemplate" }
                - type: object
                  required: [mailboxId]
                  properties:
                    mailboxId: { type: string, format: uuid }
      responses:
        "200":
          description: Sanitized HTML
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RenderedSignature" }
        "422": { $ref: "#/components/responses/Error" }
  /organizations/{orgId}/mail-flow/rules:
    parameters: [{ $ref: "#/components/parameters/orgId" }]
    get:
      tags: [mail-flow]
      summary: The organization's mail flow rules, in the order they run (owners and administrators)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/FlowRule" } }
    post:
      tags: [mail-flow]
      summary: Add a rule at the end of the list
      description: "Up to 200 rules per organization. Recorded in the audit log as mail_flow_rule.create with the new rule."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FlowRule" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlowRule" }
        "422": { $ref: "#/components/responses/Error" }
  /organizations/{orgId}/mail-flow/rules/{ruleId}:
    parameters:
      - { $ref: "#/components/parameters/orgId" }
      - { name: ruleId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [mail-flow]
      summary: Replace a rule
      description: "Recorded in the audit log as mail_flow_rule.update with the old and new rule."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FlowRule" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlowRule" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [mail-flow]
      summary: Delete a rule
      description: "Recorded in the audit log as mail_flow_rule.delete with the old rule. Messages it holds for approval keep waiting."
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
  /organizations/{orgId}/mail-flow/order:
    put:
      tags: [mail-flow]
      summary: Set the order the rules run in
      description: "ids lists every rule of the organization exactly once. Recorded as mail_flow_rule.reorder with the old and new order."
      parameters: [{ $ref: "#/components/parameters/orgId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, items: { type: string, format: uuid } }
      responses:
        "204": { description: Saved }
        "422": { $ref: "#/components/responses/Error" }
  /organizations/{orgId}/mail-flow/matches:
    get:
      tags: [mail-flow]
      summary: The last 200 messages a rule matched, newest first, including rules in test mode
      description: "Matches are kept for 30 days."
      parameters: [{ $ref: "#/components/parameters/orgId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/FlowMatch" } }
  /organizations/{orgId}/mail-flow/held:
    get:
      tags: [mail-flow]
      summary: Messages of this organization waiting for approval, oldest first
      parameters: [{ $ref: "#/components/parameters/orgId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/FlowHeldMessage" } }
  /me/mail-flow/held:
    get:
      tags: [mail-flow]
      summary: Messages waiting for the signed-in person's approval
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/FlowHeldMessage" } }
  /mail-flow/held/{heldId}/approve:
    post:
      tags: [mail-flow]
      summary: Approve a held message and send it on to its recipients
      description: "Allowed for the rule's approvers who are still members of the organization, and for its owners and administrators. Recorded as mail_flow.held.approve. Answers 502 send_failed, leaving the message waiting, when the mail server does not accept it."
      parameters:
        - { name: heldId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Sent on }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /mail-flow/held/{heldId}/reject:
    post:
      tags: [mail-flow]
      summary: Reject a held message; it is discarded without telling the sender
      description: "Recorded as mail_flow.held.reject."
      parameters:
        - { name: heldId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Discarded }
        "404": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/signatures:
    parameters: [{ $ref: "#/components/parameters/mailboxId" }, { $ref: "#/components/parameters/fromAddress" }]
    get:
      tags: [mail]
      summary: Read the display name and signatures for a From address
      responses:
        "200":
          description: Settings for this address
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignatureSettings" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [mail]
      summary: Save the display name and signatures for a From address
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignatureSettings" }
      responses:
        "200":
          description: Saved settings with sanitized signature HTML
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignatureSettings" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /organizations/{orgId}/security-notifications:
    get:
      tags: [organizations]
      summary: Security notification settings for this organization
      parameters: [{ $ref: "#/components/parameters/orgId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgSecuritySettings" }
    put:
      tags: [organizations]
      summary: Update which security events notify people and whether administrators are also notified
      parameters: [{ $ref: "#/components/parameters/orgId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrgSecuritySettings" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgSecuritySettings" }
        "422": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/signature-template:
    get:
      tags: [mail]
      summary: The organization's signature template filled in for this mailbox
      description: "Uses the template of the mailbox's domain, else the organization-wide template, else the built-in layout. The logo is the organization's light theme logo, inlined as a data: URL."
      parameters: [{ $ref: "#/components/parameters/mailboxId" }, { $ref: "#/components/parameters/fromAddress" }]
      responses:
        "200":
          description: Sanitized HTML, ready to save as a signature
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RenderedSignature" }
        "404": { $ref: "#/components/responses/Error" }
  /me/profile:
    put:
      tags: [auth]
      summary: Set your job title, phone, preferred language and undo-send delay
      description: Title and phone are filled into signature templates. undoSendSeconds is optional; leave it out to keep the current delay.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 100 }
                phone: { type: string, maxLength: 40 }
                undoSendSeconds: { type: integer, enum: [0, 5, 10, 20, 30], description: "Seconds to hold a message after sending so it can be undone. 0 sends immediately." }
                locale: { type: string }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "422": { $ref: "#/components/responses/Error" }
  /events:
    get:
      tags: [notifications]
      summary: Live mail and calendar events
      description: A long-lived text/event-stream for the signed-in user. Events are named mail, calendar, ping and resync. API keys cannot use this route. The connection sends cookies and does not use the CSRF header.
      responses:
        "200":
          description: Server-sent events
          content:
            text/event-stream:
              schema:
                type: string
  /me/notifications:
    get:
      tags: [notifications]
      summary: Notification settings for the signed-in user
      description: API keys cannot use this route. Inbox is notified unless a folder row turns it off. Other folders are quiet unless a row turns them on.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
    put:
      tags: [notifications]
      summary: Replace notification settings
      description: Replaces every folder row for the signed-in user. Send each folder you want to remember. API keys cannot use this route.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationSettingsInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        "422": { $ref: "#/components/responses/Error" }
  /me/live-focus:
    put:
      tags: [notifications]
      summary: Tell the server which folder is open
      description: The open folder is watched even when it is not a notification folder. Repeating the same folder extends the watch. Switching folders more than once every couple of seconds answers 429. API keys cannot use this route.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mailboxId, folder]
              properties:
                mailboxId: { type: string, format: uuid }
                folder: { type: string, maxLength: 255 }
      responses:
        "204": { description: Watching that folder }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /me/push-subscriptions:
    post:
      tags: [notifications]
      summary: Register this browser for Web Push
      description: The endpoint must be https. API keys cannot use this route. Answers 503 when the server has no VAPID keys.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint: { type: string, format: uri }
                keys:
                  type: object
                  required: [p256dh, auth]
                  properties:
                    p256dh: { type: string }
                    auth: { type: string }
      responses:
        "204": { description: Registered }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      tags: [notifications]
      summary: Remove a Web Push subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: { type: string }
      responses:
        "204": { description: Removed }
  /organizations/{orgId}/domains:
    get:
      tags: [domains]
      parameters: [{ $ref: "#/components/parameters/orgId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Domain" } }
    post:
      tags: [domains]
      summary: Add a domain. Domains added by platform administrators are verified immediately; others must pass DNS verification.
      parameters: [{ $ref: "#/components/parameters/orgId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                aliasOf: { type: [string, "null"], format: uuid, description: "Makes this an alias domain of another domain of the organization that is not itself an alias domain. Mail to local@alias is delivered to local@target when that mailbox or alias exists, and rejected otherwise. Alias domains cannot hold mailboxes or aliases of their own." }
                aliasSendAs: { type: boolean, default: false, description: "For an alias domain, lets everyone who may send as local@target also send as local@alias." }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Domain" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /domains/{domainId}:
    get:
      tags: [domains]
      parameters: [{ $ref: "#/components/parameters/domainId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Domain" }
    patch:
      tags: [domains]
      summary: Change whether people may send as their address on an alias domain
      parameters: [{ $ref: "#/components/parameters/domainId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                aliasSendAs: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Domain" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [domains]
      summary: Delete a domain and its aliases
      description: Refused with 409 domain_not_empty while any mailbox, active or not, still belongs to the domain, and with 409 domain_has_alias_domains while alias domains point to it; delete those first. Aliases, DMARC reports and signature templates of the domain are deleted with it.
      parameters: [{ $ref: "#/components/parameters/domainId" }]
      responses:
        "204": { description: "Deleted, including its aliases" }
        "409": { $ref: "#/components/responses/Error" }
  /domains/{domainId}/coexistence:
    put:
      tags: [domains]
      summary: Set split delivery and select dual-delivery mailboxes
      parameters: [{ $ref: "#/components/parameters/domainId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host]
              properties:
                host: { type: string, maxLength: 253, description: Direct legacy SMTP hostname on port 25. An empty string disables coexistence. }
                dualDeliveryMailboxIds:
                  type: array
                  uniqueItems: true
                  items: { type: string, format: uuid }
                  description: Active mailboxes on this domain that receive a second copy on the legacy server. Defaults to no mailboxes.
      responses:
        "200":
          description: Updated domain
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Domain" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /domains/{domainId}/dns:
    get:
      tags: [domains]
      summary: Required DNS records and their live lookup status
      parameters: [{ $ref: "#/components/parameters/domainId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [records]
                properties:
                  records: { type: array, items: { $ref: "#/components/schemas/DNSRecord" } }
  /domains/{domainId}/dkim:
    parameters: [{ $ref: "#/components/parameters/domainId" }]
    get:
      tags: [domains]
      summary: List DKIM selectors, DNS records and rotation status
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/DKIMKey" } }
    post:
      tags: [domains]
      summary: Generate or import a pending DKIM key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [algorithm]
                  properties:
                    algorithm: { type: string, enum: [rsa, ed25519] }
                    bits: { type: integer, enum: [2048, 4096], description: RSA only. Defaults to 2048. }
                - type: object
                  required: [selector, privateKey]
                  properties:
                    selector: { type: string, maxLength: 63, description: A single DNS label. }
                    privateKey: { type: string, writeOnly: true, description: Unencrypted RSA or Ed25519 PEM private key. }
      responses:
        "201":
          description: Pending key. Publish its TXT record before activation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DKIMKey" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /domains/{domainId}/dkim/{keyId}/activate:
    parameters:
      - { $ref: "#/components/parameters/domainId" }
      - { $ref: "#/components/parameters/dkimKeyId" }
    post:
      tags: [domains]
      summary: Check DNS and activate the key for signing
      responses:
        "200":
          description: Active key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DKIMKey" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /domains/{domainId}/dkim/{keyId}:
    parameters:
      - { $ref: "#/components/parameters/domainId" }
      - { $ref: "#/components/parameters/dkimKeyId" }
    delete:
      tags: [domains]
      summary: Cancel a pending key, retire active Ed25519 or remove an expired key
      responses:
        "200":
          description: Ed25519 key retired. Keep its TXT record through removeAfter.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DKIMKey" }
        "204": { description: Key removed }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /domains/{domainId}/verify:
    post:
      tags: [domains]
      summary: Check the _aether ownership TXT record and mark the domain verified
      parameters: [{ $ref: "#/components/parameters/domainId" }]
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Domain" }
        "422": { $ref: "#/components/responses/Error" }
  /organizations/{orgId}/mailboxes:
    get:
      tags: [mailboxes]
      parameters: [{ $ref: "#/components/parameters/orgId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Mailbox" } }
    post:
      tags: [mailboxes]
      summary: Create a mailbox. A user mailbox gets a user account with the mailbox address, created or linked, as its owner. A shared mailbox gets no account.
      description: A shared mailbox has no sign-in, so a password is refused with 422 shared_no_password, and an address an account already signs in with is refused with 409 address_is_account. Add members to a shared mailbox through its delegates.
      parameters: [{ $ref: "#/components/parameters/orgId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domainId, localPart]
              properties:
                domainId: { type: string, format: uuid }
                localPart: { type: string, pattern: "^[a-z0-9]([a-z0-9._-]{0,62}[a-z0-9])?$", description: "A plus sign marks a tag on an existing address, so new addresses cannot contain one" }
                displayName: { type: string }
                quotaBytes: { type: integer, minimum: 0 }
                password: { type: string, minLength: 12, description: Optional web sign-in password for the owner account. Not allowed for shared mailboxes. }
                kind: { type: string, enum: [user, shared], default: user }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mailbox" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}:
    patch:
      tags: [mailboxes]
      summary: Change a mailbox's display name, quota, active state, directory visibility, protocols or hold
      description: Removing imap or sieve from protocols ends the IMAP and ManageSieve sessions signed in as the address; removing imap from a shared mailbox also removes its members' rights from its folders in Dovecot and ends their sessions. App passwords stay valid and work again when the protocol is turned back on. Setting active to false on a shared mailbox removes every member's rights from its folders in Dovecot first; if Dovecot cannot be reached, or the rights cannot be removed within 60 seconds, the request answers 503 mail_unavailable and nothing changes. Once the rights are removed, the mailbox is closed and the members' IMAP sessions are ended. On a user mailbox it ends the sessions signed in as its address. Setting active to true on a shared mailbox marks the members for reconciliation, writes their rights to Dovecot and answers 200; if Dovecot cannot be reached at that moment, a background worker finishes the reconciliation. Session ends are retried until Dovecot confirms them.
      parameters: [{ $ref: "#/components/parameters/mailboxId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string }
                quotaBytes: { type: integer, minimum: 0 }
                active: { type: boolean }
                hiddenFromDirectory: { type: boolean, description: Leaves the mailbox out of the directory, address suggestions and the CardDAV directory. It still receives mail. }
                protocols: { $ref: "#/components/schemas/Protocols" }
                onHold: { type: boolean, description: While true, deleting the mailbox closes it and keeps its mail. Setting active to true also cancels a scheduled deletion. }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mailbox" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      tags: [mailboxes]
      summary: Delete a mailbox
      description: For a shared mailbox, removes every member's rights from Dovecot first; if Dovecot cannot be reached, or the rights cannot be removed within 60 seconds, the request answers 503 mail_unavailable and nothing changes. Then the mailbox stops receiving mail and its sessions are ended. graceDays, from 0 to 3650 and 0 when omitted, keeps the closed mailbox and its mail until that many days have passed; POST /mailboxes/{mailboxId}/restore brings it back. With graceDays 0 the mail is removed and the mailbox row is deleted. A mailbox on hold is closed instead, and its mail stays. After the row is gone, Dovecot removes the mailbox directory from the vmail volume.
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
        - name: graceDays
          in: query
          schema: { type: integer, minimum: 0, maximum: 3650, default: 0 }
      responses:
        "204": { description: Deleted now. The mail is removed from the mailbox and the directory is removed from the vmail volume. }
        "200":
          description: Closed. The mail is kept because the mailbox is on hold, or until purgeAfter.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mailbox" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/restore:
    post:
      tags: [mailboxes]
      summary: Cancel a scheduled mailbox deletion
      description: Clears purgeAfter and activates the mailbox again. Refused with 422 not_deleting when nothing is scheduled. A shared mailbox's members are written back to Dovecot.
      parameters: [{ $ref: "#/components/parameters/mailboxId" }]
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mailbox" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /organizations/{orgId}/sending-limits:
    parameters: [{ $ref: "#/components/parameters/orgId" }]
    get:
      tags: [mailboxes]
      summary: Sending limits of the organization, its domains and its mailboxes (owners and administrators)
      description: "defaults are the limits that apply where nothing is set. organization, domains and mailboxes hold only the limits set at that level, keyed by domain or mailbox id. A mailbox uses its own value first, then its domain's, then the organization's, then the default. 0 means no limit."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [defaults, organization, domains, mailboxes]
                properties:
                  defaults: { $ref: "#/components/schemas/SendingLimits" }
                  organization: { $ref: "#/components/schemas/SendingLimits" }
                  domains: { type: object, additionalProperties: { $ref: "#/components/schemas/SendingLimits" } }
                  mailboxes: { type: object, additionalProperties: { $ref: "#/components/schemas/SendingLimits" } }
    put:
      tags: [mailboxes]
      summary: Replace the sending limits of the organization, a domain or a mailbox
      description: "Without domainId or mailboxId, sets the organization's limits. Limits left out are inherited; an empty object clears every limit at that level. Recorded in the audit log as sending_limits.update."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [limits]
              properties:
                domainId: { type: string, format: uuid }
                mailboxId: { type: string, format: uuid }
                limits: { $ref: "#/components/schemas/SendingLimits" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendingLimits" }
        "422": { $ref: "#/components/responses/Error" }
  /organizations/{orgId}/restricted-senders:
    parameters: [{ $ref: "#/components/parameters/orgId" }]
    get:
      tags: [mailboxes]
      summary: Mailboxes whose outgoing mail is blocked after going over a sending limit (owners and administrators)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [mailboxId, address, displayName, restrictedAt, reason]
                  properties:
                    mailboxId: { type: string, format: uuid }
                    address: { type: string }
                    displayName: { type: string }
                    restrictedAt: { type: string, format: date-time }
                    reason: { type: string, enum: [messagesPerHour, messagesPerDay, recipientsPerDay, newRecipientsPerDay, spamPercent] }
  /mailboxes/{mailboxId}/sending-restriction:
    delete:
      tags: [mailboxes]
      summary: Release a restricted sender
      description: "Lets the mailbox send again and resets its counts for the current hour and day. Recorded in the audit log as mailbox.sending_released. 404 when the mailbox is not restricted."
      parameters: [{ $ref: "#/components/parameters/mailboxId" }]
      responses:
        "204": { description: Released }
        "404": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/exports:
    get:
      tags: [mailboxes]
      summary: List mailbox exports
      description: The mailbox's owner, anyone with access to it, and organization administrators. An administrator sees every export of the mailbox; anyone else sees only their own. API keys cannot call this route.
      parameters: [{ $ref: "#/components/parameters/mailboxId" }]
      responses:
        "200":
          description: Recent exports, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/MailboxExport" } }
    post:
      tags: [mailboxes]
      summary: Export a mailbox
      description: Queues an export of the mailbox's mail, and of its owner's calendars and contacts when those flags are set. The caller must have access to the mailbox, or be an organization administrator; an administrator's export is recorded as mailbox.export. The file is built in the background. Download it from the link in the export once its status is ready. The link expires 7 days after the file is ready. One export per person per mailbox runs at a time. API keys cannot call this route.
      parameters: [{ $ref: "#/components/parameters/mailboxId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                format: { type: string, enum: [zip, mbox], default: zip, description: zip is a ZIP of .eml files. mbox is a single mbox file, or a ZIP containing mailbox.mbox when calendars or contacts are included. }
                folder: { type: string, description: One folder. Empty exports every folder. }
                since: { type: string, description: YYYY-MM-DD or RFC3339, inclusive. }
                until: { type: string, description: YYYY-MM-DD, inclusive of that day, or an RFC3339 time. }
                includeCalendar: { type: boolean, default: true }
                includeContacts: { type: boolean, default: true }
      responses:
        "202":
          description: Export queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailboxExport" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/exports/{exportId}/download:
    get:
      tags: [mailboxes]
      summary: Download a finished mailbox export
      description: The person who started it, or an organization administrator, while the link has not expired.
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
        - name: exportId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The archive
          content:
            application/zip: { schema: { type: string, format: binary } }
            application/mbox: { schema: { type: string, format: binary } }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/convert:
    post:
      tags: [mailboxes]
      summary: Convert a user mailbox to a shared mailbox, or a shared mailbox back to a user mailbox
      description: Converting to shared clears the owner, revokes every app password for the mailbox and ends every IMAP session of the former owner, including sessions opened as a delegate of other mailboxes with an app password or an access token; their other shared memberships are reconciled. When the owner account signs in with the mailbox address, that account is deprovisioned, its web sessions end and every app password it holds is revoked; this is refused with 422 owner_is_admin for a platform administrator. Delegates stay as members with their rights. Converting back restores an account that a conversion deprovisioned as the owner, without the revoked app passwords; members stay delegates but lose the shared folders in their mail apps, and their sessions end. A mailbox that already has the requested kind is refused with 422 same_kind.
      parameters: [{ $ref: "#/components/parameters/mailboxId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [user, shared] }
      responses:
        "200":
          description: The converted mailbox
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mailbox" }
        "422": { $ref: "#/components/responses/Error" }
  /organizations/{orgId}/personal-alias-policy:
    parameters: [{ $ref: "#/components/parameters/orgId" }]
    get:
      tags: [aliases]
      security: [{ session: [] }]
      summary: Get the organization's personal alias policy as a member
      responses:
        "200":
          description: Allowed domains and the maximum number of stored personal aliases per person across their mailboxes.
          content:
            application/json:
              schema:
                type: object
                required: [limitPerUser, domains]
                properties:
                  limitPerUser: { type: integer, minimum: 0 }
                  domains:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        available: { type: boolean, description: Active and verified }
    put:
      tags: [aliases]
      security: [{ session: [] }]
      summary: Set the organization's personal alias policy as an administrator
      description: Policy changes apply to new addresses. A limit of zero disables creation. Disabled and expired aliases count until deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [limitPerUser, domainIds]
              properties:
                limitPerUser: { type: integer, minimum: 0, maximum: 2147483647 }
                domainIds: { type: array, items: { type: string, format: uuid } }
      responses:
        "204": { description: Policy saved }
        "422": { $ref: "#/components/responses/Error" }
  /organizations/{orgId}/personal-aliases:
    parameters: [{ $ref: "#/components/parameters/orgId" }]
    get:
      tags: [aliases]
      security: [{ session: [] }]
      summary: List the caller's personal aliases in this organization
      responses:
        "200":
          description: Personal aliases and the mailbox associated with the caller's password-manager key
          content:
            application/json:
              schema:
                type: object
                required: [aliases, keyMailboxId]
                properties:
                  aliases: { type: array, items: { $ref: "#/components/schemas/Alias" } }
                  keyMailboxId: { type: [string, "null"], format: uuid }
    post:
      tags: [aliases]
      security: [{ session: [] }]
      summary: Create a personal address forwarding to an owned mailbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/PersonalAliasTarget" }
                - type: object
                  properties:
                    localPart: { type: string, maxLength: 64, description: Omit or leave empty to generate a random address. }
                    note: { type: string, description: Up to 1000 bytes. }
                    expiresAt: { type: [string, "null"], format: date-time, description: Future instant when delivery and send-as stop. }
      responses:
        "201":
          description: Personal alias created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Alias" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /organizations/{orgId}/personal-alias-key:
    parameters: [{ $ref: "#/components/parameters/orgId" }]
    put:
      tags: [aliases]
      security: [{ session: [] }]
      summary: Issue or replace the caller's password-manager key for one allowed domain and owned mailbox
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PersonalAliasTarget" }
      responses:
        "200":
          description: The secret is returned once. Replacing a key immediately invalidates the previous one.
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token: { type: string }
        "403": { $ref: "#/components/responses/Error" }
    delete:
      tags: [aliases]
      security: [{ session: [] }]
      summary: Revoke the caller's password-manager key for this organization
      responses:
        "204": { description: Revoked }
  /api/alias/random/new:
    servers: [{ url: / }]
    post:
      tags: [aliases]
      summary: Generate a masked address with a personal alias key
      description: Password managers can use the SimpleLogin random alias endpoint with the Aether public URL. The key binds the destination mailbox and alias domain. The same organization policy and quota apply as in Mail settings. Responses allow any origin, so browser-based password managers can call it; the key travels in a header, never a cookie.
      security: [{ personalAliasKey: [] }]
      parameters: [{ name: hostname, in: query, schema: { type: string }, description: Used as the note when none is supplied. }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, description: Up to 1000 bytes. }
      responses:
        "201":
          description: Generated address
          content:
            application/json:
              schema:
                type: object
                required: [id, alias, email, enabled, note]
                properties:
                  id: { type: string, format: uuid }
                  alias: { type: string, format: email, description: Same as email. Bitwarden reads this field. }
                  email: { type: string, format: email }
                  enabled: { type: boolean }
                  note: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /organizations/{orgId}/aliases:
    get:
      tags: [aliases]
      parameters: [{ $ref: "#/components/parameters/orgId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Alias" } }
    post:
      tags: [aliases]
      summary: Create an alias or distribution list. An empty localPart creates the domain catch-all.
      parameters: [{ $ref: "#/components/parameters/orgId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [domainId, localPart, destinations]
                  properties:
                    domainId: { type: string, format: uuid }
                    localPart: { type: string, pattern: "^([a-z0-9]([a-z0-9._-]{0,62}[a-z0-9])?)?$", description: "A plus sign marks a tag on an existing address, so new addresses cannot contain one" }
                - { $ref: "#/components/schemas/AliasInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Alias" }
  /aliases/{aliasId}:
    get:
      tags: [aliases]
      summary: Read an alias or list as its administrator, personal owner or list owner.
      parameters: [{ name: aliasId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Alias" }
    patch:
      tags: [aliases]
      summary: Change an alias or list in place
      description: Only the fields sent are changed. List owners who are not organization admins may only send destinations, addDestinations and removeDestinations. For a personal alias, the owner or administrator may send only active, note and expiresAt. Send null to clear expiry. Changes write an alias.update audit event.
      parameters: [{ name: aliasId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - { $ref: "#/components/schemas/AliasInput" }
                - type: object
                  additionalProperties: false
                  properties:
                    active: { type: boolean }
                    note: { type: string, description: Up to 1000 bytes. }
                    expiresAt: { type: [string, "null"], format: date-time }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Alias" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [aliases]
      summary: Delete an alias as an administrator or its personal owner
      parameters: [{ name: aliasId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Deleted }
  /organizations/{orgId}/contacts:
    get:
      tags: [contacts]
      summary: Organization contacts, outside addresses shown to every member in the directory. Organization admins.
      parameters: [{ $ref: "#/components/parameters/orgId" }]
      responses:
        "200":
          description: Sorted by name
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/OrgContact" } }
    post:
      tags: [contacts]
      summary: Add an organization contact
      description: The address can be used as a list member like any outside address. An address that is already a contact of the organization is refused with 409 contact_exists.
      parameters: [{ $ref: "#/components/parameters/orgId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrgContactInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgContact" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /organizations/{orgId}/contacts/{id}:
    parameters:
      - { $ref: "#/components/parameters/orgId" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [contacts]
      summary: Replace an organization contact
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrgContactInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgContact" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [contacts]
      summary: Remove an organization contact. Lists that have the address as a member keep it.
      responses:
        "204": { description: Deleted }
  /me/lists:
    get:
      tags: [aliases]
      summary: Distribution lists the signed-in person owns
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Alias" } }
  /me/held-messages:
    get:
      tags: [aliases]
      summary: Messages waiting for the signed-in person's approval on moderated lists
      responses:
        "200":
          description: Oldest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/HeldMessage" } }
  /held-messages/{heldId}/raw:
    get:
      tags: [aliases]
      summary: Download a held message as it was received
      parameters:
        - { name: heldId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The original message
          content:
            message/rfc822:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }
  /held-messages/{heldId}/{decision}:
    post:
      tags: [aliases]
      summary: Approve or reject a held message
      description: Approving delivers the message to the list's current members, including those from its groups and domains. Rejecting discards it and tells the sender, with the reason if one is given. Both are recorded in the audit log as alias.message_approve or alias.message_reject.
      parameters:
        - { name: heldId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: decision, in: path, required: true, schema: { type: string, enum: [approve, reject] } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 2000, description: Only for reject. Sent to the sender. }
      responses:
        "202":
          description: Approved, and part of the delivery was left to the scheduler, which retries the members not reached yet
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string, enum: [queued] } } }
        "204": { description: Decided, and an approved message reached every member }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /organizations/{orgId}/members:
    get:
      tags: [members]
      parameters: [{ $ref: "#/components/parameters/orgId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Member" } }
    post:
      tags: [members]
      summary: Add an existing account to the organization or change its role and domain scope.
      description: Supports built-in scoped roles (domain_admin, helpdesk, list_admin, auditor) and custom roles defined under /organizations/{orgId}/roles. Granting or changing owner requires owner; domain_admin requires at least one domainId in the organization; custom roles require customRoleId and optionally accept domainIds.
      parameters: [{ $ref: "#/components/parameters/orgId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { $ref: "#/components/schemas/Role" }
                customRoleId: { type: string, format: uuid, description: Required when role is custom. }
                domainIds: { type: array, items: { type: string, format: uuid }, description: Required for domain_admin; optional for custom roles. }
      responses:
        "204": { description: Saved }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /organizations/{orgId}/members/{userId}/sessions:
    get:
      tags: [members]
      summary: A member's signed-in browsers
      description: Organization owners and administrators only. Only owners can see an owner's sessions, and only platform administrators can see a platform administrator's.
      parameters:
        - { $ref: "#/components/parameters/orgId" }
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ActiveSession" } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [members]
      summary: Sign a member out everywhere
      description: Ends every web session of the member, except the caller's own. App passwords are not affected.
      parameters:
        - { $ref: "#/components/parameters/orgId" }
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Signed out }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /organizations/{orgId}/members/{userId}/sessions/{sessionId}:
    delete:
      tags: [members]
      summary: End one of a member's sessions
      parameters:
        - { $ref: "#/components/parameters/orgId" }
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Signed out }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /organizations/{orgId}/security:
    get:
      tags: [security]
      summary: The organization's two-factor requirement
      parameters: [{ $ref: "#/components/parameters/orgId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationSecurity" }
    put:
      tags: [security]
      summary: Require two-factor authentication for administrators or for everyone
      description: Applies to password sign-ins of the organization's members; people who sign in through an identity provider are not affected. A member who must use two-factor authentication and has not set it up can sign in, but every endpoint except the ones needed to set it up answers 403 two_factor_setup_required.
      parameters: [{ $ref: "#/components/parameters/orgId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationSecurity" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationSecurity" }
        "422": { $ref: "#/components/responses/Error" }
  /organizations/{orgId}/members/{userId}:
    delete:
      tags: [members]
      summary: Remove a person from the organization
      description: Also removes their delegated access to the organization's mailboxes and their list ownerships, revokes the app passwords they held for those mailboxes, ends their IMAP sessions, and records one mailbox.delegate_remove audit event per mailbox. Removing an owner requires the owner role, and the last owner cannot be removed.
      parameters:
        - { $ref: "#/components/parameters/orgId" }
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed }
        "409": { $ref: "#/components/responses/Error" }
  /organizations/{orgId}/members/{userId}/password:
    post:
      tags: [members]
      summary: Reset a member's web sign-in password and sign them out of active sessions
      description: Available to owners, administrators and helpdesk. Helpdesk can only reset passwords for ordinary members who are not platform administrators and belong only to this organization.
      parameters:
        - { $ref: "#/components/parameters/orgId" }
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 12 }
      responses:
        "204": { description: Password updated }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /organizations/{orgId}/members/{userId}/status:
    patch:
      tags: [members]
      summary: Suspend or restore a member's account
      description: Available to owners, administrators and helpdesk within their authority. Helpdesk can only suspend or restore ordinary members who are not platform administrators and belong only to this organization.
      parameters:
        - { $ref: "#/components/parameters/orgId" }
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, suspended] }
      responses:
        "204": { description: Status updated }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /organizations/{orgId}/roles:
    get:
      tags: [members]
      summary: List custom roles defined for the organization
      parameters: [{ $ref: "#/components/parameters/orgId" }]
      responses:
        "200":
          description: Custom roles
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/OrgRole" } }
    post:
      tags: [members]
      summary: Create a custom role composed of API key scopes
      parameters: [{ $ref: "#/components/parameters/orgId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrgRoleInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgRole" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /roles/{roleId}:
    put:
      tags: [members]
      summary: Update a custom role
      parameters:
        - { name: roleId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrgRoleInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgRole" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [members]
      summary: Delete a custom role
      description: Fails with 409 role_in_use while assigned to any organization member or identity provider group mapping.
      parameters:
        - { name: roleId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "409": { $ref: "#/components/responses/Error" }
  /domains/{domainId}/dmarc:
    get:
      tags: [domains]
      summary: DMARC aggregate reports received for the domain, grouped by sending IP address
      parameters:
        - { $ref: "#/components/parameters/domainId" }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 366, default: 30 } }
      responses:
        "200":
          description: Summary of reports whose period ended within the last `days` days
          content:
            application/json:
              schema:
                type: object
                properties:
                  days: { type: integer }
                  reports: { type: integer }
                  sources:
                    type: array
                    items:
                      type: object
                      properties:
                        sourceIp: { type: string }
                        messages: { type: integer }
                        dkimAligned: { type: integer }
                        spfAligned: { type: integer }
                        quarantined: { type: integer }
                        rejected: { type: integer }
                        reporters: { type: array, items: { type: string } }
                        headerFroms: { type: array, items: { type: string } }
  /calendar/export:
    get:
      tags: [calendar]
      summary: Download the personal calendar as one iCalendar file
      responses:
        "200":
          description: An iCalendar file with every event and the time zones they use
          content:
            text/calendar:
              schema: { type: string }
  /mailboxes/{mailboxId}/calendar/import:
    post:
      tags: [calendar]
      summary: Import an iCalendar file into the personal calendar of the mailbox owner
      description: For organization admins and API keys with mailboxes:write, for example during a migration. Works the same as /calendar/import.
      parameters: [{ $ref: "#/components/parameters/mailboxId" }]
      requestBody:
        required: true
        content:
          text/calendar:
            schema: { type: string, maxLength: 10485760 }
      responses:
        "200":
          description: Counts of imported, replaced, and skipped events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportCounts" }
  /contacts/import:
    post:
      tags: [contacts]
      summary: Import contacts from a vCard file into an address book
      description: A contact whose UID already exists is replaced. Contacts without a UID get one. Group cards become contact groups. Without `book`, the file goes into the main address book.
      parameters:
        - { name: book, in: query, schema: { type: string }, description: Address book id. Defaults to the main book, contacts. }
      requestBody:
        required: true
        content:
          text/vcard:
            schema: { type: string, maxLength: 10485760 }
      responses:
        "200":
          description: Counts of imported, replaced, and skipped contacts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportCounts" }
  /mailboxes/{mailboxId}/contacts/import:
    post:
      tags: [contacts]
      summary: Import a vCard file into the address book of the mailbox owner
      description: For organization admins and API keys with mailboxes:write.
      parameters: [{ $ref: "#/components/parameters/mailboxId" }]
      requestBody:
        required: true
        content:
          text/vcard:
            schema: { type: string, maxLength: 10485760 }
      responses:
        "200":
          description: Counts of imported, replaced, and skipped contacts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportCounts" }
  /calendar/import:
    post:
      tags: [calendar]
      summary: Import events from an iCalendar file into the personal calendar
      description: Events are grouped by UID, so recurring events keep their exceptions. An event whose UID already exists is replaced.
      requestBody:
        required: true
        content:
          text/calendar:
            schema: { type: string, maxLength: 10485760 }
      responses:
        "200":
          description: Counts of imported, replaced, and skipped events
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported: { type: integer }
                  updated: { type: integer }
                  skipped: { type: integer }
        "422": { $ref: "#/components/responses/Error" }
  /organizations/{orgId}/api-keys:
    get:
      tags: [integrations]
      summary: List active API keys (session only)
      parameters: [{ $ref: "#/components/parameters/orgId" }]
      responses:
        "200":
          description: API keys without their tokens
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/APIKey" } }
    post:
      tags: [integrations]
      summary: Create an API key (session only). The token is returned once.
      parameters: [{ $ref: "#/components/parameters/orgId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string, maxLength: 100 }
                scopes:
                  type: array
                  items:
                    type: string
                    enum: ["domains:read", "domains:write", "mailboxes:read", "mailboxes:write", "aliases:read", "aliases:write", "contacts:read", "contacts:write", "members:read", "members:write", "audit:read", "audit:write", "webhooks:read", "webhooks:write", "mailflow:read", "mailflow:write", "message-trace:read", "message-trace:write", "suppressions:read", "suppressions:write"]
                expiresAt: { type: string, format: date-time }
      responses:
        "201":
          description: The key and its token
          content:
            application/json:
              schema:
                type: object
                properties:
                  key: { $ref: "#/components/schemas/APIKey" }
                  token: { type: string }
  /api-keys/{keyId}:
    delete:
      tags: [integrations]
      summary: Revoke an API key (session only)
      parameters: [{ name: keyId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/Error" }
  /organizations/{orgId}/webhooks:
    get:
      tags: [integrations]
      summary: List webhooks
      parameters: [{ $ref: "#/components/parameters/orgId" }]
      responses:
        "200":
          description: Webhooks
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Webhook" } }
    post:
      tags: [integrations]
      summary: Create a webhook. The signing secret is returned once.
      description: "Matching audit and mail delivery events in the organization are posted to the URL as JSON. The Aether-Signature header is t=<unix time>,v1=<hex HMAC-SHA256 of t + '.' + body> using the secret. Failed deliveries are retried for about two days."
      parameters: [{ $ref: "#/components/parameters/orgId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url: { type: string, format: uri, description: Must be https and must resolve to a public address }
                events: { type: array, items: { type: string }, description: "Audit action names or message.delivered, message.deferred, message.bounced, message.received, and message.rejected. Use * for all." }
      responses:
        "201":
          description: The webhook and its secret
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhook: { $ref: "#/components/schemas/Webhook" }
                  secret: { type: string }
  /webhooks/{webhookId}:
    delete:
      tags: [integrations]
      summary: Delete a webhook and its delivery history
      parameters: [{ name: webhookId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
  /webhooks/{webhookId}/deliveries:
    get:
      tags: [integrations]
      summary: The 50 most recent deliveries
      parameters: [{ name: webhookId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: Deliveries, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    event: { type: string }
                    status: { type: string, enum: [pending, delivered, failed] }
                    attempts: { type: integer }
                    responseCode: { type: [integer, "null"] }
                    lastError: { type: [string, "null"] }
                    createdAt: { type: string, format: date-time }
                    deliveredAt: { type: [string, "null"], format: date-time }
  /webhooks/{webhookId}/test:
    post:
      tags: [integrations]
      summary: Queue a webhook.test delivery
      parameters: [{ name: webhookId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "202": { description: Queued }
  /organizations/{orgId}/suppressions:
    parameters: [{ $ref: "#/components/parameters/orgId" }]
    get:
      tags: [integrations]
      summary: List up to 200 suppressed addresses, newest first
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Case-insensitive address substring }
      responses:
        "200":
          description: Suppressions
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Suppression" } }
    post:
      tags: [integrations]
      summary: Suppress an address for this organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address: { type: string, format: email, maxLength: 320 }
                reason: { type: string, enum: [manual, complaint, bounce], default: manual }
                detail: { type: string, maxLength: 500 }
      responses:
        "201":
          description: Suppression created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Suppression" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /suppressions/{suppressionId}:
    delete:
      tags: [integrations]
      summary: Remove a suppressed address
      parameters: [{ name: suppressionId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
  /organizations/{orgId}/audit:
    get:
      tags: [organizations]
      parameters:
        - { $ref: "#/components/parameters/orgId" }
        - { name: before, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Newest first, 50 per page
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }
  /organizations/{orgId}/message-trace:
    get:
      tags: [message-trace]
      summary: Search the delivery records of mail sent to or from the organization's domains
      description: Owners and admins only. Inbound mail is matched on the organization's recipient domains and only those recipients are shown; mail sent by the organization's signed-in users shows every recipient. Text filters match anywhere in the value and ignore case; messageId matches exactly, with or without angle brackets.
      parameters:
        - { $ref: "#/components/parameters/orgId" }
        - { $ref: "#/components/parameters/traceSender" }
        - { $ref: "#/components/parameters/traceRecipient" }
        - { $ref: "#/components/parameters/traceSubject" }
        - { $ref: "#/components/parameters/traceMessageId" }
        - { $ref: "#/components/parameters/traceStatus" }
        - { $ref: "#/components/parameters/traceFrom" }
        - { $ref: "#/components/parameters/traceTo" }
        - { name: before, in: query, description: Return messages with an id below this one, for the next page, schema: { type: integer } }
      responses:
        "200":
          description: Newest first, 50 per page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageTracePage" }
        "422": { $ref: "#/components/responses/Error" }
  /organizations/{orgId}/message-trace/export:
    get:
      tags: [message-trace]
      summary: Download the matching delivery records as CSV
      description: Takes the same filters as the search, returns up to 50,000 rows, and is recorded in the audit log as message_trace.export.
      parameters:
        - { $ref: "#/components/parameters/orgId" }
        - { $ref: "#/components/parameters/traceSender" }
        - { $ref: "#/components/parameters/traceRecipient" }
        - { $ref: "#/components/parameters/traceSubject" }
        - { $ref: "#/components/parameters/traceMessageId" }
        - { $ref: "#/components/parameters/traceStatus" }
        - { $ref: "#/components/parameters/traceFrom" }
        - { $ref: "#/components/parameters/traceTo" }
      responses:
        "200":
          description: CSV with a header row
          content:
            text/csv:
              schema: { type: string }
  /organizations/{orgId}/message-trace/{id}:
    get:
      tags: [message-trace]
      summary: One message's path through the server
      parameters:
        - { $ref: "#/components/parameters/orgId" }
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageTraceDetail" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/message-trace:
    get:
      tags: [message-trace]
      summary: Search every delivery record on the server
      description: Platform administrators only. Same filters and response as the organization search, including mail for domains no organization owns.
      parameters:
        - { $ref: "#/components/parameters/traceSender" }
        - { $ref: "#/components/parameters/traceRecipient" }
        - { $ref: "#/components/parameters/traceSubject" }
        - { $ref: "#/components/parameters/traceMessageId" }
        - { $ref: "#/components/parameters/traceStatus" }
        - { $ref: "#/components/parameters/traceFrom" }
        - { $ref: "#/components/parameters/traceTo" }
        - { name: before, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Newest first, 50 per page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageTracePage" }
  /admin/message-trace/export:
    get:
      tags: [message-trace]
      summary: Download every matching delivery record as CSV
      parameters:
        - { $ref: "#/components/parameters/traceSender" }
        - { $ref: "#/components/parameters/traceRecipient" }
        - { $ref: "#/components/parameters/traceSubject" }
        - { $ref: "#/components/parameters/traceMessageId" }
        - { $ref: "#/components/parameters/traceStatus" }
        - { $ref: "#/components/parameters/traceFrom" }
        - { $ref: "#/components/parameters/traceTo" }
      responses:
        "200":
          description: CSV with a header row
          content:
            text/csv:
              schema: { type: string }
  /admin/message-trace/{id}:
    get:
      tags: [message-trace]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageTraceDetail" }
        "404": { $ref: "#/components/responses/Error" }
  /organizations/{orgId}/encryption:
    parameters: [{ $ref: "#/components/parameters/orgId" }]
    get:
      tags: [organizations]
      summary: Encryption policy for the organization
      description: Any member may read it. domains lists verified domain names, which decide whether a recipient is outside the organization.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EncryptionPolicy" }
    put:
      tags: [organizations]
      summary: Set whether S/MIME, OpenPGP and password-protected mail are off, allowed or required
      description: Owners and administrators only. Recorded as organization.encryption. When more than one method is required, any one of them satisfies the rule. A password requirement applies to recipients outside verified domains; mail encrypted to their key satisfies it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EncryptionPolicy" }
      responses:
        "200":
          description: The saved policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EncryptionPolicy" }
        "422": { $ref: "#/components/responses/Error" }
  /me/encryption-keys:
    get:
      tags: [mail]
      summary: Encryption keys saved for the caller
      description: privateKey is encrypted in the browser before upload. The server cannot decrypt it.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/EncryptionKey" } }
    put:
      tags: [mail]
      summary: Save an encrypted private key and its public certificate or key
      description: The address must be one the caller can send as, and the public material must include that address. The private key must start with the byte 0xA1. Recorded as encryption_key.save.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EncryptionKeyInput" }
      responses:
        "200":
          description: The stored key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EncryptionKey" }
        "422": { $ref: "#/components/responses/Error" }
  /me/encryption-keys/{keyId}:
    delete:
      tags: [mail]
      parameters: [{ name: keyId, in: path, required: true, schema: { type: string, format: uuid } }]
      summary: Delete one of the caller's encryption keys
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
  /me/recipient-keys:
    get:
      tags: [mail]
      summary: Public keys Aether already knows for an address
      parameters: [{ name: address, in: query, required: true, schema: { type: string, format: email } }]
      responses:
        "200":
          description: Directory keys from the caller's organizations, then keys saved from mail
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/RecipientKey" } }
    post:
      tags: [mail]
      summary: Remember a recipient's public key from a message, Autocrypt or Web Key Directory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecipientKeyInput" }
      responses:
        "204": { description: Saved }
        "422": { $ref: "#/components/responses/Error" }
  /me/wkd:
    get:
      tags: [mail]
      summary: Look up an OpenPGP key in the recipient's Web Key Directory
      description: The advanced openpgpkey host is tried first. The direct URL is used only when that host name does not exist. Redirects are not followed.
      parameters: [{ name: address, in: query, required: true, schema: { type: string, format: email } }]
      responses:
        "200":
          description: An armored public key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecipientKey" }
        "404": { $ref: "#/components/responses/Error" }
  /protected/{messageId}/open:
    post:
      tags: [mail]
      security: []
      summary: Fetch a password-protected message for its recipient
      description: The access token is the part of the emailed link after the dot in the fragment. The response is ciphertext. The password is not sent.
      parameters: [{ name: messageId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [access]
              properties:
                access: { type: string, pattern: "^[0-9a-f]{64}$" }
      responses:
        "200":
          description: Ciphertext. reply is omitted for the recipient.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProtectedMessage" }
        "404": { $ref: "#/components/responses/Error" }
  /protected/{messageId}/reply:
    post:
      tags: [mail]
      security: []
      summary: Store one encrypted reply to a password-protected message
      description: proof is the replyProof from the decrypted message. The server stores only the ciphertext.
      parameters: [{ name: messageId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [access, proof, reply]
              properties:
                access: { type: string, pattern: "^[0-9a-f]{64}$" }
                proof: { type: string, pattern: "^[0-9a-f]{64}$" }
                reply: { type: string, format: byte }
      responses:
        "204": { description: Accepted }
        "409": { $ref: "#/components/responses/Error" }
  /me/mailboxes:
    get:
      tags: [mail]
      summary: Mailboxes the caller can open in Aether Mail
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Mailbox" } }
  /me/app-passwords:
    get:
      tags: [app-passwords]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AppPassword" } }
    post:
      tags: [app-passwords]
      summary: Create an app password for mail apps, calendar and contacts apps, or both. The secret is returned once.
      description: Only for an active user mailbox the caller owns, or has full access with Send as on; anything else is refused with 422 invalid_mailbox. Shared mailboxes never need an app password; they appear under Shared in each member's own mail account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, mailboxId]
              properties:
                name: { type: string }
                mailboxId: { type: string, format: uuid }
                scope: { $ref: "#/components/schemas/AppPasswordScope" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/AppPassword" }
                  - type: object
                    required: [password]
                    properties:
                      password: { type: string }
        "422": { $ref: "#/components/responses/Error" }
  /me/apple-profile:
    post:
      tags: [app-passwords]
      summary: Create an app password for a mailbox and return it inside an Apple configuration profile with mail, CalDAV and CardDAV accounts
      description: The same mailbox rule as for app passwords applies; anything else is refused with 422 invalid_mailbox.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mailboxId]
              properties:
                mailboxId: { type: string, format: uuid }
      responses:
        "200":
          description: The configuration profile
          content:
            application/x-apple-aspen-config:
              schema: { type: string, format: binary }
        "422": { $ref: "#/components/responses/Error" }
  /me/app-passwords/{id}:
    delete:
      tags: [app-passwords]
      summary: Revoke an app password
      description: Also ends every IMAP session signed in as the app password's mailbox, because Dovecot cannot tell which credential opened a session. The session end is retried until Dovecot confirms it.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Revoked }
  /me/security:
    get:
      tags: [security]
      summary: The caller's password and two-factor status
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecurityStatus" }
  /me/password:
    put:
      tags: [security]
      summary: Change the caller's Aether password
      description: Needs the current password and a new one of at least 12 characters. Ends every other web session of the caller; app passwords keep working. Accounts without an Aether password get 409 no_password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 12 }
      responses:
        "204": { description: Changed }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /me/totp:
    post:
      tags: [security]
      summary: Start setting up an authenticator app
      description: Returns a new secret, its otpauth URI and a QR code as a PNG data URL. Nothing changes at sign-in until PUT /me/totp confirms a code. Answers 409 totp_enabled when an authenticator app is already set up.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [secret, uri, qrCode]
                properties:
                  secret: { type: string, description: Base32 secret for entering by hand }
                  uri: { type: string }
                  qrCode: { type: string }
        "409": { $ref: "#/components/responses/Error" }
    put:
      tags: [security]
      summary: Turn on the authenticator app with a current code
      description: When this is the caller's first two-factor method, the answer holds 10 new recovery codes, shown only once; otherwise the list is empty.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: Turned on
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [security]
      summary: Turn off the authenticator app
      description: Needs the current password. When no two-factor method is left, the recovery codes are deleted too.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordConfirmation" }
      responses:
        "204": { description: Turned off }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /me/security-keys/challenge:
    post:
      tags: [security]
      summary: Options for navigator.credentials.create() to add a security key or passkey
      description: Binary fields are standard base64. The challenge is valid for 5 minutes and for one POST /me/security-keys.
      responses:
        "200":
          description: PublicKeyCredentialCreationOptions
          content:
            application/json:
              schema: { type: object }
        "409": { $ref: "#/components/responses/Error" }
  /me/security-keys:
    post:
      tags: [security]
      summary: Add a security key or passkey
      description: Send the new credential's raw ID, clientDataJSON, authenticator data (getAuthenticatorData()) and SPKI public key (getPublicKey()), in standard base64. Aether asks for no attestation and accepts ES256, EdDSA and RS256 keys. When this is the first two-factor method, the answer holds 10 new recovery codes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, credential]
              properties:
                name: { type: string, maxLength: 100 }
                credential:
                  type: object
                  required: [id, clientDataJSON, authenticatorData, publicKey]
                  properties:
                    id: { type: string, format: byte }
                    clientDataJSON: { type: string, format: byte }
                    authenticatorData: { type: string, format: byte }
                    publicKey: { type: string, format: byte }
                    transports: { type: array, items: { type: string } }
      responses:
        "200":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /me/security-keys/{id}:
    delete:
      tags: [security]
      summary: Remove a security key or passkey
      description: Needs the current password. When no two-factor method is left, the recovery codes are deleted too.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordConfirmation" }
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /me/recovery-codes:
    post:
      tags: [security]
      summary: Replace the recovery codes with 10 new ones
      description: Needs the current password and an active two-factor method. The old codes stop working.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordConfirmation" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /me/sessions:
    get:
      tags: [security]
      summary: The caller's signed-in browsers, the current one first
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ActiveSession" } }
    delete:
      tags: [security]
      summary: Sign out every other session
      responses:
        "204": { description: Signed out }
  /me/sessions/{sessionId}:
    delete:
      tags: [security]
      summary: End one of the caller's other sessions
      description: The current session is ended with POST /auth/logout instead and answers 404 here.
      parameters: [{ name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Signed out }
        "404": { $ref: "#/components/responses/Error" }
  /me/security-notifications:
    get:
      tags: [auth]
      summary: Recent security notifications for the signed-in account
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [unreadCount, notifications]
                properties:
                  unreadCount: { type: integer }
                  notifications:
                    type: array
                    items: { $ref: "#/components/schemas/SecurityNotification" }
  /me/security-notifications/read-all:
    post:
      tags: [auth]
      summary: Mark all of the signed-in account's security notifications as read
      responses:
        "204": { description: Marked as read }
  /me/security-notifications/{id}/read:
    post:
      tags: [auth]
      summary: Mark a single security notification as read
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: Marked as read
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecurityNotification" }
        "404": { $ref: "#/components/responses/Error" }
  /me/security-notifications/{id}/undo:
    post:
      tags: [auth]
      summary: Undo the change described by a security notification
      description: Revokes the created app password, removes the external forwarding address from the mail rule, removes the added delegate, or ends the new session.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: Undone
          content:
            application/json:
              schema:
                type: object
                required: [notification, message]
                properties:
                  notification: { $ref: "#/components/schemas/SecurityNotification" }
                  message: { type: string }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /me/security-notifications/{id}/report:
    post:
      tags: [auth]
      summary: Report a security notification as suspicious activity to organization administrators
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: Reported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecurityNotification" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/imports:
    get:
      tags: [mail]
      summary: The 20 most recent imports into this mailbox
      parameters: [{ $ref: "#/components/parameters/mailboxId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/MailImport" } }
    post:
      tags: [mail]
      summary: Sign in to another IMAP account and copy its folders into this mailbox in the background. Messages already in the target folder are skipped by Message-ID, with a content hash for messages without one. The password is used only for this import and is not stored.
      parameters: [{ $ref: "#/components/parameters/mailboxId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportSource" }
      responses:
        "202":
          description: Started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailImport" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/imports/{id}/cancel:
    post:
      tags: [mail]
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Cancelled }
        "404": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/import-schedules:
    parameters: [{ $ref: "#/components/parameters/mailboxId" }]
    get:
      tags: [mail]
      security: [{ session: [] }]
      summary: List recurring imports for an accessible mailbox, with the latest run for each
      responses:
        "200": { $ref: "#/components/responses/ImportSchedules" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [mail]
      security: [{ session: [] }]
      summary: Start a recurring import for a writable mailbox
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportScheduleInput" }
      responses:
        "202": { $ref: "#/components/responses/ImportSchedules" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/import-schedules/{id}:
    delete:
      tags: [mail]
      security: [{ session: [] }]
      summary: Stop a recurring import and erase its stored password
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Stopped }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /organizations/{orgId}/import-schedules:
    parameters: [{ $ref: "#/components/parameters/orgId" }]
    get:
      tags: [mailboxes]
      summary: List an organization's import schedules and latest run results
      description: Requires an organization administrator or an API key with mailboxes:read or mailboxes:write.
      responses:
        "200": { $ref: "#/components/responses/ImportSchedules" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [mailboxes]
      summary: Create a batch of recurring imports
      description: Requires an organization administrator or an API key with mailboxes:write. The whole batch succeeds or fails together. The first run is due immediately and subsequent runs are due after the interval. Failed runs retry on the same interval.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [imports]
              properties:
                imports:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    allOf:
                      - $ref: "#/components/schemas/ImportScheduleInput"
                      - type: object
                        required: [mailboxId]
                        properties:
                          mailboxId: { type: string, format: uuid }
      responses:
        "202": { $ref: "#/components/responses/ImportSchedules" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /organizations/{orgId}/import-schedules/stop:
    post:
      tags: [mailboxes]
      summary: Stop a batch of import schedules and erase their stored passwords
      description: Requires an organization administrator or an API key with mailboxes:write.
      parameters: [{ $ref: "#/components/parameters/orgId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { type: string, format: uuid } }
      responses:
        "204": { description: Stopped }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /organizations/{orgId}/import-schedules/{id}/runs:
    get:
      tags: [mailboxes]
      summary: List up to 20 recent runs for an import schedule in this organization
      description: Requires an organization administrator or an API key with mailboxes:read or mailboxes:write.
      parameters:
        - { $ref: "#/components/parameters/orgId" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Recent runs
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/MailImport" } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/folders:
    get:
      tags: [mail]
      parameters: [{ $ref: "#/components/parameters/mailboxId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Folder" } }
    post:
      tags: [mail]
      summary: Create a folder, inside parent when given. The new folder is subscribed.
      parameters: [{ $ref: "#/components/parameters/mailboxId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100, description: "One level of the name. It cannot contain . / * or %, or start with ~." }
                parent: { type: string, description: Full name of an existing folder }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { type: object, required: [name], properties: { name: { type: string, description: Full name of the new folder } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    patch:
      tags: [mail]
      summary: Rename a folder, move it under another folder, or change its subscription
      description: Subfolders move with it, and mail rules that file into it are updated. Inbox, Drafts, Sent, Archive, Junk, Trash, and Snoozed cannot be renamed or moved.
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
        - { name: folder, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100, description: New last level of the name }
                parent: { type: string, description: Full name of the new parent folder, or an empty string for the top level }
                subscribed: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { type: object, required: [name], properties: { name: { type: string, description: Full name after the change } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
    delete:
      tags: [mail]
      summary: Delete a folder that has no subfolders
      description: A folder that still has messages is refused with 409 folder_not_empty unless moveTo names a folder to move them to first. Special folders cannot be deleted.
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
        - { name: folder, in: query, required: true, schema: { type: string } }
        - { name: moveTo, in: query, description: Folder that receives the messages before the folder is deleted, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/folders/empty:
    post:
      tags: [mail]
      summary: Delete every message in a folder
      description: Trash and Junk are emptied permanently. Any other folder moves its messages to Trash.
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
        - { name: folder, in: query, required: true, schema: { type: string } }
      responses:
        "204": { description: Emptied }
        "404": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/folders/mark-read:
    post:
      tags: [mail]
      summary: Mark every message in a folder as read
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
        - { name: folder, in: query, required: true, schema: { type: string } }
      responses:
        "204": { description: Marked as read }
        "404": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/recoverable:
    get:
      tags: [mail]
      summary: List permanently deleted messages that can still be restored
      description: The 2,000 most recently deleted messages, newest first, for the owner, delegates and members, and organization administrators. An administrator's request is recorded as mailbox.recoverable.view. API keys cannot use this route.
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [retentionDays, items]
                properties:
                  retentionDays: { type: integer }
                  items: { type: array, items: { $ref: "#/components/schemas/RecoverableMessage" } }
        "404": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/recoverable/restore:
    post:
      tags: [mail]
      summary: Restore deleted messages to the folders they were deleted from
      description: A message whose folder no longer exists goes to Inbox. Recorded as mailbox.messages.restore. Read-only members cannot restore, and API keys cannot use this route.
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    required: [folder, uid]
                    properties:
                      folder: { type: string }
                      uid: { type: integer }
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema:
                type: object
                required: [restored]
                properties:
                  restored: { type: integer }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "507": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/labels:
    get:
      tags: [mail]
      summary: List labels
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
      responses:
        "200":
          description: Labels in display order
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Label" } }
    post:
      tags: [mail]
      summary: Create a label
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, color]
              properties:
                name: { type: string, maxLength: 40 }
                color: { type: string, enum: [red, orange, yellow, green, blue, purple, gray, pink] }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Label" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/labels/{labelId}:
    patch:
      tags: [mail]
      summary: Rename a label or change its color
      description: The keyword stays the same, so messages that already have the label keep it. A new color is written onto those messages for Apple Mail, and onto rules that add the label.
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
        - { name: labelId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, color]
              properties:
                name: { type: string, maxLength: 40 }
                color: { type: string, enum: [red, orange, yellow, green, blue, purple, gray, pink] }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Label" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
    delete:
      tags: [mail]
      summary: Delete a label
      description: Removes the label from messages and from mail rules. A rule whose only action is this label is left unchanged and the label is kept.
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
        - { name: labelId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/saved-searches:
    get:
      tags: [mail]
      summary: List saved searches
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
      responses:
        "200":
          description: Saved searches in display order
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SavedSearch" } }
    post:
      tags: [mail]
      summary: Save a search
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavedSearchInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedSearch" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/saved-searches/{searchId}:
    patch:
      tags: [mail]
      summary: Replace a saved search
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
        - { name: searchId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavedSearchInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedSearch" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [mail]
      summary: Delete a saved search
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
        - { name: searchId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/messages:
    get:
      tags: [mail]
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
        - { $ref: "#/components/parameters/folder" }
        - { name: q, in: query, description: Server-side full text search, schema: { type: string } }
        - { name: threads, in: query, description: "Group conversations with THREAD=REFERENCES. Each row is the conversation's newest message, and conversations are sorted by it; threadUids lists the conversation newest first.", schema: { type: boolean } }
        - { name: sort, in: query, description: "date is when the message arrived, sent is its Date header, and from and to sort by display name", schema: { type: string, enum: [date, sent, from, to, subject, size], default: date } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { name: unread, in: query, schema: { type: boolean } }
        - { name: flagged, in: query, schema: { type: boolean } }
        - { name: hasAttachments, in: query, schema: { type: boolean } }
        - { name: from, in: query, description: Text in the From header, schema: { type: string } }
        - { name: to, in: query, description: Text in the To header, schema: { type: string } }
        - { name: since, in: query, description: Arrived on or after this date, schema: { type: string, format: date } }
        - { name: until, in: query, description: Arrived on or before this date, schema: { type: string, format: date } }
        - { name: label, in: query, description: Only messages with this label. Ignored when saved is set., schema: { type: string, format: uuid } }
        - { name: saved, in: query, description: A saved search. It replaces q, unread, flagged, hasAttachments, from, to, since, until, label, folder and folders., schema: { type: string, format: uuid } }
        - { name: folders, in: query, description: Search every folder with all. Otherwise the folder parameter selects one folder., schema: { type: string, enum: ["", all] } }
        - { name: cursor, in: query, description: nextCursor of the previous page, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: In the requested order. Filters combine with q. A search of every folder does not group conversations, and its cursor belongs to that search only.
          content:
            application/json:
              schema:
                type: object
                required: [messages, total]
                properties:
                  messages: { type: array, items: { $ref: "#/components/schemas/MessageSummary" } }
                  total: { type: integer }
                  nextCursor: { type: [string, "null"], description: Opaque. Pass it back as cursor with the same sort and filters. }
        "422": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/messages/{uid}:
    get:
      tags: [mail]
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
        - { $ref: "#/components/parameters/uid" }
        - { $ref: "#/components/parameters/folder" }
      responses:
        "200":
          description: Message with sanitized HTML. Remote images are removed unless this message, its sender, or the organization policy is set to load them through the image proxy. Known tracking images are always removed. protection says when the body is S/MIME or OpenPGP and still needs the browser to decrypt or verify it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
    patch:
      tags: [mail]
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
        - { $ref: "#/components/parameters/uid" }
        - { $ref: "#/components/parameters/folder" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                seen: { type: boolean }
                flagged: { type: boolean }
                addLabels: { type: array, maxItems: 50, items: { type: string, format: uuid }, description: Labels to add. A label in both lists is rejected. }
                removeLabels: { type: array, maxItems: 50, items: { type: string, format: uuid } }
      responses:
        "204": { description: Updated }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [mail]
      summary: Move to Trash, or delete permanently when already in Trash
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
        - { $ref: "#/components/parameters/uid" }
        - { $ref: "#/components/parameters/folder" }
      responses:
        "204": { description: Deleted }
  /mailboxes/{mailboxId}/messages/{uid}/remote-images:
    post:
      tags: [mail]
      summary: Show or hide remote images for this message, or always for its sender
      description: Showing images rewrites them to the image proxy. The choice is stored for the signed-in user. Read-only access to the mailbox is enough, because this does not change the message.
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
        - { $ref: "#/components/parameters/uid" }
        - { $ref: "#/components/parameters/folder" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [show, hide, allowSender, forgetSender]
      responses:
        "200":
          description: The message, with remote images applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /image-proxy/{token}:
    get:
      tags: [mail]
      security: []
      summary: Fetch one remote image through the Aether proxy
      description: The token is an HMAC of the exact image URL and an expiry, minted only when a message the reader can open is rendered with images shown. The proxy does not accept an arbitrary URL, does not forward the reader's address or browser, refuses private and link-local targets, and returns only responses whose bytes are a PNG, JPEG, GIF, WebP, AVIF, or BMP.
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The image bytes
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "404": { description: The token is invalid or the image could not be fetched }
        "429": { $ref: "#/components/responses/Error" }
  /organizations/{orgId}/mail-privacy:
    get:
      tags: [organizations]
      summary: Organization default for remote images
      parameters:
        - { $ref: "#/components/parameters/orgId" }
      responses:
        "200":
          description: block hides images until a reader asks. proxy loads them through the image proxy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailPrivacy" }
    put:
      tags: [organizations]
      summary: Set the organization default for remote images
      parameters:
        - { $ref: "#/components/parameters/orgId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MailPrivacy" }
      responses:
        "200":
          description: Saved. Recorded as organization.remote_images.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailPrivacy" }
        "422": { $ref: "#/components/responses/Error" }
  /me/remote-image-senders:
    get:
      tags: [mail]
      summary: Senders whose remote images this user always loads
      responses:
        "200":
          description: Ordered by address
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RemoteImageSender" }
  /me/remote-image-senders/{address}:
    delete:
      tags: [mail]
      summary: Stop always loading remote images from a sender
      parameters:
        - name: address
          in: path
          required: true
          schema: { type: string, format: email }
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/messages/{uid}/move:
    post:
      tags: [mail]
      summary: Move a message to a folder in this mailbox or in another mailbox you have full access to
      description: A move to another mailbox appends the original message unchanged, with its flags and received date, and removes it from this mailbox only after that succeeds. It is recorded in the audit log as mailbox.messages.move.
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
        - { $ref: "#/components/parameters/uid" }
        - { $ref: "#/components/parameters/folder" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageTransfer" }
      responses:
        "204": { description: Moved }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/messages/{uid}/copy:
    post:
      tags: [mail]
      summary: Copy a message to a folder in this mailbox or in another mailbox you have full access to
      description: A copy to another mailbox is recorded in the audit log as mailbox.messages.copy.
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
        - { $ref: "#/components/parameters/uid" }
        - { $ref: "#/components/parameters/folder" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageTransfer" }
      responses:
        "204": { description: Copied }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/messages/move:
    post:
      tags: [mail]
      summary: Move up to 500 messages, listed in uids, like the single-message move
      description: Messages that no longer exist are skipped. If a move to another mailbox fails partway, the messages already moved stay moved and the rest stay where they were.
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
        - { $ref: "#/components/parameters/folder" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageTransfer" }
      responses:
        "204": { description: Moved }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/messages/copy:
    post:
      tags: [mail]
      summary: Copy up to 500 messages, listed in uids, like the single-message copy
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
        - { $ref: "#/components/parameters/folder" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageTransfer" }
      responses:
        "204": { description: Copied }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/messages/{uid}/invitation:
    post:
      tags: [mail, calendar]
      summary: Respond to the calendar invitation, reply, or cancellation in a message
      description: |
        accepted, tentative, and declined answer an invitation. Accepting adds the event to the personal calendar, declining removes it, and each sends a reply to the organizer.
        apply updates the sender's response on an event you organize. remove takes a cancelled event out of the calendar.
        Every response needs the same right as /send: owning the mailbox, Send as, or Send on behalf. Anyone else is refused with 403 cannot_send. Without Send as, a reply names the caller in its Sender header.
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
        - { $ref: "#/components/parameters/uid" }
        - { $ref: "#/components/parameters/folder" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response]
              properties:
                response: { type: string, enum: [accepted, tentative, declined, apply, remove] }
      responses:
        "200":
          description: The invitation after the response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/messages/{uid}/unsubscribe:
    post:
      tags: [mail]
      summary: Unsubscribe from the list that sent this message
      description: |
        Reads `List-Unsubscribe` and `List-Unsubscribe-Post` from the message again.
        With `List-Unsubscribe-Post: List-Unsubscribe=One-Click` and an https URI, Aether POSTs `List-Unsubscribe=One-Click` (`application/x-www-form-urlencoded`) to that URI. The request sends no cookies and does not follow redirects.
        Otherwise an https URI is returned as `url` for the browser to open, or the `mailto:` URI is sent from this mailbox when the caller has Send as or Send on behalf.
        Usernames in the URL, schemes other than https, and private or reserved addresses are refused. `AETHER_WEBHOOK_ALLOW_PRIVATE=true` also allows http and those addresses. Read-only access can use one-click and the link.
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
        - { $ref: "#/components/parameters/uid" }
        - { $ref: "#/components/parameters/folder" }
      responses:
        "200":
          description: The unsubscribe was sent, or the browser should open url
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnsubscribeResult" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/messages/{uid}/attachments/{part}:
    get:
      tags: [mail]
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
        - { $ref: "#/components/parameters/uid" }
        - { $ref: "#/components/parameters/folder" }
        - { name: part, in: path, required: true, schema: { type: string, pattern: "^[0-9]+(\\.[0-9]+)*$" } }
      responses:
        "200": { description: "Attachment bytes, served as a download" }
  /mailboxes/{mailboxId}/delegates:
    get:
      tags: [mailboxes]
      summary: People with access to this mailbox besides its owner
      parameters: [{ $ref: "#/components/parameters/mailboxId" }]
      responses:
        "200":
          description: Delegates
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Delegate" } }
    post:
      tags: [mailboxes]
      summary: Give an organization member access to this mailbox, or change their access
      description: Full access covers reading and organizing the mailbox. Read access only allows reading in Aether Mail; the API refuses every other request except sending when a send right is granted. Send as and Send on behalf are separate from access; full access alone does not allow sending. Send as sends from the mailbox address and, with full access on a user mailbox, allows app passwords for it. Send on behalf sends from the mailbox address with the delegate named in the Sender header. An omitted sendAs or sendOnBehalf keeps its current value, or is false for a new delegate. Members of a shared mailbox see it under Shared in their own mail apps. Lowering access or a send right revokes app passwords that no longer qualify and ends the delegate's open mail app sessions, including sessions opened with an access token; the session end is retried until Dovecot confirms it.
      parameters: [{ $ref: "#/components/parameters/mailboxId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                access: { type: string, enum: [full, read], default: full }
                sendAs: { type: boolean }
                sendOnBehalf: { type: boolean }
      responses:
        "200":
          description: The delegate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Delegate" }
        "422": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/delegates/{userId}:
    delete:
      tags: [mailboxes]
      summary: Remove a delegate and revoke the app passwords they created for this mailbox
      description: Ends the delegate's open mail app sessions, including sessions opened with an access token; the session end is retried until Dovecot confirms it.
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/messages/{uid}/source:
    get:
      tags: [mail]
      summary: The raw RFC 822 message, for decrypting or verifying it in the browser
      description: At most 25 MB. The response is the message bytes, not JSON.
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
        - { $ref: "#/components/parameters/uid" }
        - { $ref: "#/components/parameters/folder" }
      responses:
        "200":
          description: The message
          content:
            message/rfc822:
              schema: { type: string, format: binary }
        "413": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/protected:
    post:
      tags: [mail]
      summary: Store a password-protected message and email the recipient a link
      description: The caller must own the mailbox. The body is ciphertext produced in the browser. The password is not uploaded. The link in the email carries the access token in the URL fragment.
      parameters: [{ $ref: "#/components/parameters/mailboxId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProtectedMessageInput" }
      responses:
        "202":
          description: The sender's link, which does not contain the access token
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresAt]
                properties:
                  url: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
        "422": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/protected/{messageId}:
    get:
      tags: [mail]
      summary: Read a password-protected message the caller sent, including an encrypted reply
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
        - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Ciphertext for the sender
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProtectedMessage" }
        "404": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/transfer-limits:
    get:
      tags: [mail]
      summary: Limits that apply when sending from this mailbox
      description: Anyone who can read the mailbox may read the limits. usedBytes is the storage download links currently occupy.
      parameters: [{ $ref: "#/components/parameters/mailboxId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferLimits" }
        "403": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/file-links:
    post:
      tags: [mail]
      summary: Upload a file that will be sent as a download link
      description: "The body is the file. Pass its name in the filename query parameter. The caller must be allowed to send from the mailbox. Recorded in the audit log as file_link.create. An empty file is 422 invalid_attachments. A file over the link limit or the remaining storage is 413."
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
        - { name: filename, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/octet-stream: { schema: { type: string, format: binary } }
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileLinkSummary" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/file-links/{linkId}:
    parameters:
      - { $ref: "#/components/parameters/mailboxId" }
      - { name: linkId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [mail]
      summary: Delete a download link uploaded for this mailbox
      description: The caller must be allowed to send from the mailbox. Recorded in the audit log as file_link.delete.
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
  /files/{token}:
    get:
      tags: [mail]
      security: []
      summary: Describe a download link
      description: No session is required. The token is the capability. An unknown token is 404. An expired link is 410 file_link_expired.
      parameters:
        - { name: token, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicFileLink" }
        "404": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /files/{token}/content:
    get:
      tags: [mail]
      security: []
      summary: Download a file that has no password
      description: "A password-protected file answers 401 password_required. Use POST with the password instead. The body is the file, with Content-Disposition attachment."
      parameters:
        - { name: token, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" } }
      responses:
        "200":
          description: The file
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
    post:
      tags: [mail]
      security: []
      summary: Download a file, checking its password when it has one
      description: A missing password on a protected file is 401 password_required and does not count as a guess. A wrong password is 401 invalid_password. Guesses are limited per token.
      parameters:
        - { name: token, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: string }
      responses:
        "200":
          description: The file
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/app-passwords:
    get:
      tags: [mailboxes]
      summary: List app passwords created for this mailbox
      parameters: [{ $ref: "#/components/parameters/mailboxId" }]
      responses:
        "200":
          description: App passwords
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/MailboxAppPassword" } }
  /mailboxes/{mailboxId}/app-passwords/{id}:
    delete:
      tags: [mailboxes]
      summary: Revoke an app password for this mailbox and end matching mail sessions
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/send:
    post:
      tags: [mail]
      summary: Submit a message through the SMTP submission service and save it to Sent, schedule it when sendAt is set, or hold it for undo
      description: The caller must own the mailbox or have Send as or Send on behalf on it; read access is enough when a send right is granted. Anyone else is refused with 403 cannot_send. Without Send as, the message names the caller in its Sender header. A scheduled message records whether it was sent as or on behalf of the mailbox. When it is due, the caller's account must still be active and still hold that same right; otherwise it is not sent and gets an error. sealed replaces the text, HTML and attachments with ciphertext built in the browser. The organization encryption policy is checked again when a scheduled message is sent. When sendAt is omitted and the account's undo delay is 5, 10, 20 or 30 seconds, the message is held for that long and the response is a ScheduledMessage with undo set. The delay is not added to a request that sets sendAt. Cancelling the hold puts the draft back. The message is sent when the delay ends, including if the browser is closed. Inline attachments share the organization's attachment budget and a limit of 20 files. Files named in fileLinks, and files the server moves out of that budget, are sent as download links. The finished message must fit the organization's message size, which cannot exceed the platform Postfix limit. A file larger than the JSON body limit has to be uploaded with POST /mailboxes/{mailboxId}/file-links first.
      parameters: [{ $ref: "#/components/parameters/mailboxId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OutgoingMessage" }
      responses:
        "202":
          description: Accepted by the submission service, or a ScheduledMessage when sendAt was set or the account's undo delay held the message
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      messageId: { type: string }
                  - { $ref: "#/components/schemas/ScheduledMessage" }
        "403": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/scheduled:
    get:
      tags: [mail]
      summary: List messages waiting to be sent, including undo holds and ones that failed
      parameters: [{ $ref: "#/components/parameters/mailboxId" }]
      responses:
        "200":
          description: Scheduled messages, earliest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ScheduledMessage" } }
  /mailboxes/{mailboxId}/scheduled/{scheduledId}:
    delete:
      tags: [mail]
      summary: Cancel a scheduled message, including an undo hold, and put it back in Drafts
      description: Owners and members with full access can cancel. A read-only member can cancel when they are allowed to send from the mailbox.
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
        - { name: scheduledId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The restored draft
          content:
            application/json:
              schema:
                type: object
                properties:
                  uid: { type: integer }
                  folder: { type: string }
        "404": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/messages/{uid}/snooze:
    post:
      tags: [mail]
      summary: Move a message to the Snoozed folder until a time, then back to its folder as unread
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
        - { $ref: "#/components/parameters/uid" }
        - { $ref: "#/components/parameters/folder" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [until]
              properties:
                until: { type: string, format: date-time }
      responses:
        "200":
          description: The message's UID in the Snoozed folder
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnoozedMessage" }
  /mailboxes/{mailboxId}/snoozed:
    get:
      tags: [mail]
      summary: List snoozed messages by their UID in the Snoozed folder
      parameters: [{ $ref: "#/components/parameters/mailboxId" }]
      responses:
        "200":
          description: Snoozed messages, earliest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SnoozedMessage" } }
  /mailboxes/{mailboxId}/snoozed/{uid}:
    delete:
      tags: [mail]
      summary: Return a snoozed message to its folder now
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
        - { $ref: "#/components/parameters/uid" }
      responses:
        "204": { description: Returned }
        "404": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/drafts:
    put:
      tags: [mail]
      summary: Save a draft to the Drafts folder, replacing draftUid when given
      description: Recipients are optional. Bcc is stored in the draft. Use forwardFrom with the returned folder and uid to keep the draft's attachments on later saves and on send. fileLinks keeps download links on the draft. A password is applied when the draft is sent, not while it is saved.
      parameters: [{ $ref: "#/components/parameters/mailboxId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OutgoingMessage" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                required: [uid, folder, attachments, fileLinks]
                properties:
                  uid: { type: integer }
                  folder: { type: string }
                  attachments: { type: array, items: { $ref: "#/components/schemas/Attachment" } }
                  fileLinks: { type: array, items: { $ref: "#/components/schemas/FileLinkSummary" } }
  /mailboxes/{mailboxId}/drafts/{uid}:
    delete:
      tags: [mail]
      summary: Permanently delete a draft
      parameters:
        - { $ref: "#/components/parameters/mailboxId" }
        - { $ref: "#/components/parameters/uid" }
      responses:
        "204": { description: Deleted }
  /mailboxes/{mailboxId}/newsletters:
    get:
      tags: [mail]
      summary: Senders of recent inbox messages that include List-Unsubscribe
      description: Searches the Inbox for the header and returns at most the 200 most recent matches, grouped by the sender. Each sender uses the same action as Unsubscribe on its latest message.
      parameters: [{ $ref: "#/components/parameters/mailboxId" }]
      responses:
        "200":
          description: Senders, newest first
          content:
            application/json:
              schema:
                type: object
                required: [senders]
                properties:
                  senders: { type: array, items: { $ref: "#/components/schemas/NewsletterSender" } }
        "429": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/newsletters/block:
    post:
      tags: [mail]
      summary: Delete future messages from a sender
      description: Adds a mail rule, run first, that discards messages whose From header contains this address and then stops. The rule can be changed with the mail rules. Read-only access is refused. Blocking an address that is already blocked changes nothing.
      parameters: [{ $ref: "#/components/parameters/mailboxId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address: { type: string, format: email }
      responses:
        "200":
          description: The sender is blocked
          content:
            application/json:
              schema:
                type: object
                required: [blocked]
                properties:
                  blocked: { type: boolean }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/rules:
    get:
      tags: [mail]
      summary: Mail rules for this mailbox, in the order they run
      parameters: [{ $ref: "#/components/parameters/mailboxId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/MailRule" } }
    put:
      tags: [mail]
      summary: Replace all rules. They are compiled to Sieve and installed on the mail server before the response is sent.
      parameters: [{ $ref: "#/components/parameters/mailboxId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/MailRule" } }
      responses:
        "200":
          description: Saved and installed
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/MailRule" } }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/auto-reply:
    get:
      tags: [mail]
      description: The automatic reply is sent from the mailbox's address, so reading or changing it needs Send as on the mailbox, which owners have, or the organization administrator role. Anyone else is refused with 403 cannot_send.
      parameters: [{ $ref: "#/components/parameters/mailboxId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutoReply" }
        "403": { $ref: "#/components/responses/Error" }
    put:
      tags: [mail]
      summary: Set the automatic reply. Each sender receives it at most once a day; lists and automated mail are skipped.
      parameters: [{ $ref: "#/components/parameters/mailboxId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutoReply" }
      responses:
        "200":
          description: Saved and installed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutoReply" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /mailboxes/{mailboxId}/tagged-mail:
    get:
      tags: [mail]
      summary: How mail to a tagged address such as name+tag@example.com is handled
      parameters: [{ $ref: "#/components/parameters/mailboxId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaggedMail" }
    put:
      tags: [mail]
      summary: Choose how mail to a tagged address is handled. An existing alias whose address contains a plus sign still receives its own mail.
      parameters: [{ $ref: "#/components/parameters/mailboxId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaggedMail" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaggedMail" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /contacts:
    get:
      tags: [contacts]
      summary: Contacts in the caller's address books and the address books shared with them, also served over CardDAV
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Matches name or email }
        - { name: book, in: query, schema: { type: string }, description: Limit to one address book id, including a shared- id }
      responses:
        "200":
          description: Sorted by name, at most 500
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Contact" } }
    post:
      tags: [contacts]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contact" }
        "422": { $ref: "#/components/responses/Error" }
  /contacts/books:
    get:
      tags: [contacts]
      summary: Address books you own and address books shared with you
      responses:
        "200":
          description: Yours first, then shared ones. Shared books have ids that start with shared-.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AddressBook" } }
    post:
      tags: [contacts]
      summary: Create an address book
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddressBookInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AddressBook" }
        "422": { $ref: "#/components/responses/Error" }
  /contacts/books/{bookId}:
    parameters: [{ name: bookId, in: path, required: true, schema: { type: string } }]
    patch:
      tags: [contacts]
      summary: Rename an address book you own, or change its description and color
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddressBookInput" }
      responses:
        "204": { description: Updated }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [contacts]
      summary: Delete an address book you own, and every contact and group in it
      responses:
        "204": { description: Deleted }
        "422": { $ref: "#/components/responses/Error" }
  /contacts/books/{bookId}/shares:
    post:
      tags: [contacts]
      summary: Share an address book you own with a person or an organization
      description: Give either the email of someone who belongs to one of your organizations, or an organization you administer to share with all of its members. Sharing again changes the access. A shared book appears in CardDAV as shared-<id>.
      parameters: [{ name: bookId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [access]
              properties:
                email: { type: string, format: email }
                orgId: { type: string, format: uuid }
                access: { type: string, enum: [read, write] }
      responses:
        "204": { description: Shared }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /contacts/books/{bookId}/shares/{shareId}:
    delete:
      tags: [contacts]
      summary: Stop sharing an address book
      parameters:
        - { name: bookId, in: path, required: true, schema: { type: string } }
        - { name: shareId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: No longer shared }
  /contacts/groups:
    get:
      tags: [contacts]
      summary: Contact groups in your address books and the address books shared with you
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Matches the group name }
        - { name: book, in: query, schema: { type: string }, description: Limit to one address book id }
      responses:
        "200":
          description: At most 500, sorted by name
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ContactGroup" } }
    post:
      tags: [contacts]
      summary: Create a contact group in an address book
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactGroupInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactGroup" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /contacts/groups/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: book, in: query, schema: { type: string }, description: Address book id, required when the same id exists in more than one book }
    get:
      tags: [contacts]
      summary: One contact group, including its members
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactGroup" }
        "409": { $ref: "#/components/responses/Error" }
    put:
      tags: [contacts]
      summary: Replace a group's name and members
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactGroupInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactGroup" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [contacts]
      summary: Delete a contact group. The people in it stay in the address book.
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /contacts/{id}:
    put:
      tags: [contacts]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contact" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [contacts]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: book, in: query, schema: { type: string }, description: Address book id, required when the same id exists in more than one book }
      responses:
        "204": { description: Deleted. The contact is also removed from groups in that address book. }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /directory:
    get:
      tags: [contacts]
      summary: Active mailboxes and lists in the caller's organizations, and their organization contacts. Mailboxes and lists hidden from the directory are left out. Also served over CardDAV as the read-only address book shared-directory.
      parameters: [{ name: q, in: query, schema: { type: string }, description: Matches name, address or company }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Recipient" } }
  /recipients:
    get:
      tags: [contacts]
      summary: Up to 10 recipient suggestions from the caller's contacts, contact groups, and the directory
      parameters: [{ name: q, in: query, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Recipient" } }
  /calendar/events:
    get:
      tags: [calendar]
      summary: Events in a time range, with repeating events expanded into occurrences
      parameters:
        - { name: start, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: end, in: query, required: true, schema: { type: string, format: date-time }, description: At most 400 days after start }
      responses:
        "200":
          description: Sorted by start
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CalendarEvent" } }
    post:
      tags: [calendar]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CalendarEventInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarEvent" }
        "422": { $ref: "#/components/responses/Error" }
  /calendar/events/{id}:
    put:
      tags: [calendar]
      summary: Replace an event; for repeating events this changes the whole series
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CalendarEventInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarEvent" }
    delete:
      tags: [calendar]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: calendar, in: query, schema: { type: string, default: personal }, description: The calendarId of the event }
      responses:
        "204": { description: "Deleted, including every occurrence" }
  /calendar/freebusy:
    get:
      tags: [calendar]
      summary: Busy times of people in your organizations
      description: Returns only start and end times, never event details. Timed events count as busy. All-day events and events marked free (TRANSP:TRANSPARENT) do not. Addresses outside your organizations come back with known set to false.
      parameters:
        - { name: start, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: end, in: query, required: true, schema: { type: string, format: date-time }, description: At most 31 days after start }
        - { name: attendee, in: query, required: true, style: form, explode: true, schema: { type: array, maxItems: 50, items: { type: string, format: email } } }
      responses:
        "200":
          description: One entry per attendee, in request order
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [email, known, busy]
                  properties:
                    email: { type: string }
                    known: { type: boolean }
                    busy:
                      type: array
                      items:
                        type: object
                        required: [start, end]
                        properties:
                          start: { type: string, format: date-time }
                          end: { type: string, format: date-time }
        "422": { $ref: "#/components/responses/Error" }
  /calendar/calendars:
    get:
      tags: [calendar]
      summary: List your calendars and the calendars shared with you
      responses:
        "200":
          description: Your own calendars first, then shared ones. Shared calendars have ids that start with shared-.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Calendar" } }
    post:
      tags: [calendar]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CalendarInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Calendar" }
        "422": { $ref: "#/components/responses/Error" }
  /calendar/calendars/{calendarId}:
    parameters: [{ name: calendarId, in: path, required: true, schema: { type: string } }]
    patch:
      tags: [calendar]
      summary: Rename or recolor a calendar you own
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CalendarInput" }
      responses:
        "204": { description: Updated }
    delete:
      tags: [calendar]
      summary: Delete a calendar you own and every event in it
      responses:
        "204": { description: Deleted }
        "422": { $ref: "#/components/responses/Error" }
  /calendar/calendars/{calendarId}/shares:
    post:
      tags: [calendar]
      summary: Share a calendar you own with a person or an organization
      description: Give either the email of someone who belongs to one of your organizations, or an organization you administer to share with all of its members. Sharing again changes the access.
      parameters: [{ name: calendarId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [access]
              properties:
                email: { type: string, format: email }
                orgId: { type: string, format: uuid }
                access: { type: string, enum: [read, write] }
      responses:
        "204": { description: Shared }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /calendar/calendars/{calendarId}/shares/{shareId}:
    delete:
      tags: [calendar]
      summary: Stop sharing a calendar
      parameters:
        - { name: calendarId, in: path, required: true, schema: { type: string } }
        - { name: shareId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: No longer shared }
  /calendar/tasks:
    get:
      tags: [calendar]
      summary: List tasks (VTODO) across your own and shared calendars
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, completed, all], default: all } }
        - { name: calendar, in: query, schema: { type: string } }
      responses:
        "200":
          description: Tasks sorted by open status, due date, and priority
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CalendarTask" } }
    post:
      tags: [calendar]
      summary: Create a task (VTODO)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CalendarTaskInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarTask" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /calendar/tasks/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: calendar, in: query, schema: { type: string, default: personal } }
    put:
      tags: [calendar]
      summary: Update a task
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CalendarTaskInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarTask" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [calendar]
      summary: Delete a task
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /calendar/subscriptions:
    post:
      tags: [calendar]
      summary: Subscribe to an external iCalendar URL (https:// or webcal://)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
                name: { type: string, maxLength: 100 }
                color: { type: string, pattern: "^(#[0-9a-fA-F]{6})?$" }
                refreshMinutes: { type: integer, enum: [15, 60, 360, 1440] }
      responses:
        "201":
          description: Subscribed calendar created and initially fetched
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Calendar" }
        "422": { $ref: "#/components/responses/Error" }
  /calendar/subscriptions/{calendarId}:
    parameters: [{ name: calendarId, in: path, required: true, schema: { type: string } }]
    patch:
      tags: [calendar]
      summary: Update a calendar subscription's URL or refresh schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string, format: uri }
                refreshMinutes: { type: integer, minimum: 15, maximum: 10080 }
      responses:
        "204": { description: Updated }
        "404": { $ref: "#/components/responses/Error" }
  /calendar/subscriptions/{calendarId}/refresh:
    post:
      tags: [calendar]
      summary: Refresh a calendar subscription immediately
      parameters: [{ name: calendarId, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: Refreshed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarSubscription" }
        "404": { $ref: "#/components/responses/Error" }
  /calendar/booking:
    get:
      tags: [calendar]
      summary: Get your booking page configuration and meeting types
      responses:
        "200":
          description: Booking page settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingPage" }
    put:
      tags: [calendar]
      summary: Update your booking page settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingPageInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingPage" }
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingPage" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /calendar/booking/types:
    post:
      tags: [calendar]
      summary: Create a booking meeting type
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingTypeInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingPage" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /calendar/booking/types/{typeId}:
    parameters: [{ name: typeId, in: path, required: true, schema: { type: string, format: uuid } }]
    put:
      tags: [calendar]
      summary: Update a booking meeting type
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingTypeInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingPage" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [calendar]
      summary: Delete a booking meeting type
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
  /book/{slug}:
    get:
      tags: [calendar]
      security: []
      summary: Fetch a public booking page and its active meeting types
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: Public booking page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicBookingPage" }
        "404": { $ref: "#/components/responses/Error" }
  /book/{slug}/{typeSlug}/slots:
    get:
      tags: [calendar]
      security: []
      summary: Compute open booking slots for a meeting type within a date range
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: typeSlug, in: path, required: true, schema: { type: string } }
        - { name: start, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: end, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Available start and end timestamps
          content:
            application/json:
              schema:
                type: object
                properties:
                  timezone: { type: string }
                  durationMinutes: { type: integer }
                  slots:
                    type: array
                    items: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/Error" }
  /book/{slug}/{typeSlug}:
    post:
      tags: [calendar]
      security: []
      summary: Book an available slot, creating a calendar event and sending an iTIP invitation
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: typeSlug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start, name, email]
              properties:
                start: { type: string, format: date-time }
                name: { type: string, maxLength: 200 }
                email: { type: string, format: email }
                note: { type: string, maxLength: 2000 }
      responses:
        "201":
          description: Booking confirmed
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  title: { type: string }
                  start: { type: string, format: date-time }
                  end: { type: string, format: date-time }
                  timezone: { type: string }
                  location: { type: string }
                  videoUrl: { type: string }
                  hostName: { type: string }
                  guestEmail: { type: string, format: email }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /admin/identity-providers/{id}/scim-token:
    post:
      tags: [identity-providers]
      summary: Turn on SCIM provisioning for the provider, or replace its token. The token is returned once.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  token: { type: string }
    delete:
      tags: [identity-providers]
      summary: Turn off SCIM provisioning for the provider
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Turned off }
  /scim/{slug}/Users:
    get:
      tags: [scim]
      summary: SCIM 2.0 user list. Authenticated with the provider's SCIM bearer token. Supports only filter=userName eq "address".
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: filter, in: query, schema: { type: string } }
      responses:
        "200": { description: SCIM ListResponse }
    post:
      tags: [scim]
      summary: Create an account, link externalId as the provider subject, and create the mailbox on a verified domain
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses:
        "201": { description: SCIM User }
        "400": { description: "userName is not an email address, contains * or ?, or is a shared mailbox address (scimType invalidValue)" }
        "409": { description: An account with this userName exists }
  /scim/{slug}/Users/{id}:
    get:
      tags: [scim]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: SCIM User }
    put:
      tags: [scim]
      summary: Update the display name and active state
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: SCIM User }
        "400": { description: "userName is not an email address, contains * or ?, or is a shared mailbox address (scimType invalidValue)" }
    patch:
      tags: [scim]
      summary: Apply replace operations on active and displayName
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: SCIM User }
    delete:
      tags: [scim]
      summary: Mark the account deprovisioned. Mail is kept.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deprovisioned }
  /admin/outbound-routing:
    get:
      tags: [outbound-routing]
      security: [{ session: [] }]
      summary: List outbound routes and TLS policies as a platform administrator
      responses:
        "200":
          description: Routing rules with credential presence only
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/OutboundRoute" } }
        "403":
          description: Platform administrator required
  /admin/outbound-routing/{kind}/{name}:
    parameters:
      - name: kind
        in: path
        required: true
        schema: { type: string, enum: [relay, transport, tls] }
      - name: name
        in: path
        required: true
        schema: { type: string }
        description: Sender domain, recipient domain, or exact TLS next-hop key
    put:
      tags: [outbound-routing]
      security: [{ session: [] }]
      summary: Create or replace an outbound routing rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target: { type: string, description: "Fixed relay or transport endpoint in [hostname]:port form" }
                tlsMode: { type: string, enum: ["", none, may, encrypt, dane, verify, secure] }
                matchNames: { type: array, items: { type: string } }
                username: { type: string, writeOnly: true }
                password: { type: string, writeOnly: true }
              description: Relay rules accept a username and password together. Omitting both removes credentials when replacing a rule.
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutboundRoute" }
        "403":
          description: Platform administrator required
        "422":
          description: Invalid routing rule
    delete:
      tags: [outbound-routing]
      security: [{ session: [] }]
      summary: Remove an outbound routing rule
      responses:
        "204":
          description: Removed
        "403":
          description: Platform administrator required
        "404":
          description: Routing rule not found
  /admin/identity-providers:
    get:
      tags: [identity-providers]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/IdentityProvider" } }
    post:
      tags: [identity-providers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdentityProviderInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityProvider" }
  /admin/identity-providers/{id}:
    put:
      tags: [identity-providers]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdentityProviderInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityProvider" }
    delete:
      tags: [identity-providers]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Deleted }
  /admin/users/{id}:
    patch:
      tags: [members]
      summary: Suspend or restore an account everywhere (platform administrators only). Suspension ends all sessions, including IMAP sessions, and blocks app passwords.
      description: An account deprovisioned by converting its mailbox to a shared mailbox cannot be restored here and answers 409 mailbox_converted; convert the mailbox back to a user mailbox instead.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, suspended] }
      responses:
        "204": { description: Saved }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /admin/mail-queue:
    get:
      tags: [mail-queue]
      summary: List messages waiting in the Postfix queue (platform administrators only)
      description: >-
        Shows the envelope only, never the message content. Messages are sorted oldest first and cut at limit; matched counts every message that fits the filter,
        and summary always covers the whole queue. Answers 503 queue_not_configured when AETHER_POSTFIX_API_KEY is not set and 503 queue_unavailable when Postfix cannot be reached.
      parameters:
        - { name: sender, in: query, description: "Text in the envelope sender, ignoring case", schema: { type: string, maxLength: 320 } }
        - { name: recipientDomain, in: query, description: Exact domain of at least one recipient, schema: { type: string, maxLength: 255 } }
        - { name: error, in: query, description: "Text in a recipient's last delivery error, ignoring case", schema: { type: string, maxLength: 500 } }
        - { name: queue, in: query, schema: { $ref: "#/components/schemas/QueueName" } }
        - { name: limit, in: query, description: 0 returns only the counts, schema: { type: integer, minimum: 0, maximum: 1000, default: 200 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailQueue" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/mail-queue/{action}:
    post:
      tags: [mail-queue]
      summary: Retry, hold, release or delete queued messages (platform administrators only)
      description: >-
        Send the queue IDs to change, or a filter that is applied when the request runs. retry schedules deferred messages for immediate delivery, hold moves messages to the hold queue,
        release moves held messages back to the deferred queue, and delete removes messages without notifying anyone. Messages the action does not apply to are skipped,
        and affected counts the rest. Each request is one mail_queue.<action> audit event.
      parameters:
        - { name: action, in: path, required: true, schema: { type: string, enum: [retry, hold, release, delete] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QueueActionInput" }
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                type: object
                required: [affected]
                properties:
                  affected: { type: integer }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/users/{id}/password:
    put:
      tags: [members]
      summary: Set a new password for an account (platform administrators only)
      description: Ends every web session of the account. Only for accounts that already have an Aether password; accounts that sign in through an identity provider answer 409 no_password. Your own password is changed with PUT /me/password.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 12 }
      responses:
        "204": { description: Saved }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /admin/users/{id}/two-factor:
    delete:
      tags: [members]
      summary: Remove an account's two-factor methods and recovery codes (platform administrators only)
      description: For someone who lost their phone, security key and recovery codes. Your own methods are managed under /me.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /hooks/identity-providers/{slug}:
    post:
      tags: [identity-providers]
      security: []
      summary: Receive signed lifecycle events from an identity provider (Halo webhook format)
      description: >-
        Requires the Halo-Signature header, t=<unix seconds>,v1=<hex HMAC-SHA256 of "t." + body> using the provider's webhook secret, within five minutes.
        user.suspend, scim.user.suspend and scim.user.deprovision suspend the linked account; user.restore and scim.user.restore restore it only if the provider suspended it;
        session.revoke ends its sessions. Duplicate event ids are ignored.
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Accepted }
        "401": { $ref: "#/components/responses/Error" }
  /admin/identity-providers/discover:
    post:
      tags: [identity-providers]
      summary: Fetch and validate an issuer's OpenID Connect discovery document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issuer]
              properties:
                issuer: { type: string, format: uri }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [issuer, authorizationEndpoint, tokenEndpoint, scopesSupported, pkceS256, groupsClaim, redirectUri]
                properties:
                  issuer: { type: string }
                  authorizationEndpoint: { type: string }
                  tokenEndpoint: { type: string }
                  userinfoEndpoint: { type: string }
                  endSessionEndpoint: { type: string }
                  scopesSupported: { type: array, items: { type: string } }
                  pkceS256: { type: boolean }
                  groupsClaim: { type: boolean }
                  redirectUri: { type: string, description: "Callback URL to register at the provider; contains {slug}" }
        "422": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    personalAliasKey: { type: apiKey, in: header, name: Authentication, description: A revocable key for generating masked addresses. }
    session:
      type: apiKey
      in: cookie
      name: aether_session
      description: State-changing requests must also send the session csrfToken in the X-CSRF-Token header. When the session's twoFactorSetupRequired is true, every endpoint answers 403 two_factor_setup_required except /session, /auth/logout, GET /me/security, PUT /me/password, POST and PUT /me/totp, POST /me/security-keys/challenge, POST /me/security-keys, and /me/sessions.
    apiKey:
      type: http
      scheme: bearer
      description: "An organization API key (aether_...). Keys work only on organization administration endpoints: domains, mailboxes (including delegates, rules, automatic replies, signatures and calendar and contact import), aliases, organization contacts, members, audit, webhooks, and mail flow rules with their held messages.suppressions. Each needs the matching resource:read or resource:write scope. No CSRF header is needed."
  parameters:
    orgId: { name: orgId, in: path, required: true, schema: { type: string, format: uuid } }
    domainId: { name: domainId, in: path, required: true, schema: { type: string, format: uuid } }
    dkimKeyId: { name: keyId, in: path, required: true, schema: { type: string, format: uuid } }
    mailboxId: { name: mailboxId, in: path, required: true, schema: { type: string, format: uuid } }
    fromAddress: { name: fromAddress, in: query, schema: { type: string, format: email }, description: An authorized From address. Defaults to the mailbox address. }
    uid: { name: uid, in: path, required: true, schema: { type: integer } }
    folder: { name: folder, in: query, schema: { type: string, default: INBOX } }
    traceSender: { name: sender, in: query, description: Part of the envelope sender address, schema: { type: string } }
    traceRecipient: { name: recipient, in: query, description: Part of a recipient address, including the alias it was sent to, schema: { type: string } }
    traceSubject: { name: subject, in: query, schema: { type: string } }
    traceMessageId: { name: messageId, in: query, schema: { type: string } }
    traceStatus: { name: status, in: query, schema: { $ref: "#/components/schemas/MessageTraceStatus" } }
    traceFrom: { name: from, in: query, description: Received at or after this time, schema: { type: string, format: date-time } }
    traceTo: { name: to, in: query, description: Received before this time, schema: { type: string, format: date-time } }
  responses:
    ImportSchedules:
      description: Import schedules
      content:
        application/json:
          schema: { type: array, items: { $ref: "#/components/schemas/ImportSchedule" } }
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code: { type: string }
                  message: { type: string }
  schemas:
    OutboundRoute:
      type: object
      required: [kind, name, target, tlsMode, matchNames, hasCredentials]
      properties:
        kind: { type: string, enum: [relay, transport, tls] }
        name: { type: string }
        target: { type: string }
        tlsMode: { type: string, enum: ["", none, may, encrypt, dane, verify, secure] }
        matchNames: { type: array, items: { type: string } }
        hasCredentials: { type: boolean }
    User:
      type: object
      required: [id, email, displayName, isPlatformAdmin, status, title, phone, undoSendSeconds, locale]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        displayName: { type: string }
        isPlatformAdmin: { type: boolean }
        status: { type: string, enum: [active, suspended, deprovisioned] }
        title: { type: string }
        phone: { type: string }
        undoSendSeconds: { type: integer, enum: [0, 5, 10, 20, 30], description: "How long an ordinary send is held so it can be undone. 0 sends immediately." }
        locale: { type: string }
    Session:
      type: object
      required: [user, memberships, csrfToken, twoFactorSetupRequired]
      properties:
        user: { $ref: "#/components/schemas/User" }
        csrfToken: { type: string }
        twoFactorSetupRequired: { type: boolean, description: An organization requires two-factor authentication for this password session and it is not set up yet }
        memberships:
          type: array
          items:
            type: object
            required: [orgId, orgName, orgSlug, role, domainIds, permissions, defaultLocale]
            properties:
              orgId: { type: string, format: uuid }
              orgName: { type: string }
              orgSlug: { type: string }
              role: { $ref: "#/components/schemas/Role" }
              customRoleId: { type: string, format: uuid }
              customRoleName: { type: string }
              domainIds: { type: array, items: { type: string, format: uuid } }
              permissions: { type: array, items: { type: string } }
              defaultLocale: { type: string }
    Role:
      type: string
      enum: [owner, admin, domain_admin, helpdesk, list_admin, auditor, custom, member]
    OrgRole:
      type: object
      required: [id, orgId, name, description, scopes, memberCount, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        scopes: { type: array, items: { type: string } }
        memberCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OrgRoleInput:
      type: object
      required: [name, scopes]
      properties:
        name: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 300 }
        scopes: { type: array, minItems: 1, items: { type: string } }
    Organization:
      type: object
      required: [id, name, slug, defaultLocale, createdAt, deletedItemRetentionDays, mailboxProtocols]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        defaultLocale: { type: string }
        createdAt: { type: string, format: date-time }
        deletedItemRetentionDays: { type: integer, minimum: 1, maximum: 30 }
        mailboxProtocols: { $ref: "#/components/schemas/Protocols" }
    Protocols:
      type: array
      uniqueItems: true
      items: { type: string, enum: [imap, smtp, sieve, dav, webmail] }
      description: "The ways a mailbox can be used: imap, smtp (SMTP submission), sieve (ManageSieve), dav (CalDAV and CardDAV) and webmail (Aether Mail). With webmail off, the mailbox disappears from Aether Mail for everyone, and organization administrators still manage its rules, automatic replies and signatures in the console."
    AppPasswordScope:
      type: string
      enum: [all, mail, dav]
      default: all
      description: "mail allows IMAP and SMTP submission; dav allows CalDAV and CardDAV; all also allows ManageSieve. The mailbox's protocols still apply."
    ThemeColors:
      type: object
      description: "Colours that replace Aether's in one theme, as #rrggbb. Leave a key out to keep Aether's colour."
      additionalProperties: false
      properties:
        accent: { type: string, pattern: "^#[0-9a-f]{6}$" }
        accentHover: { type: string, pattern: "^#[0-9a-f]{6}$" }
        accentActive: { type: string, pattern: "^#[0-9a-f]{6}$" }
        background: { type: string, pattern: "^#[0-9a-f]{6}$" }
        surface: { type: string, pattern: "^#[0-9a-f]{6}$" }
        border: { type: string, pattern: "^#[0-9a-f]{6}$" }
        text: { type: string, pattern: "^#[0-9a-f]{6}$" }
        link: { type: string, pattern: "^#[0-9a-f]{6}$" }
    BrandColors:
      type: object
      additionalProperties: false
      properties:
        dark: { $ref: "#/components/schemas/ThemeColors" }
        light: { $ref: "#/components/schemas/ThemeColors" }
    BrandingSettings:
      type: object
      required: [name, signInMessage, colors, customCss]
      properties:
        name: { type: string, maxLength: 100, description: "Shown instead of Aether. Empty uses the organization's name." }
        signInMessage: { type: string, maxLength: 500, description: "Plain text on the sign-in page" }
        colors: { $ref: "#/components/schemas/BrandColors" }
        customCss: { type: string, description: "Up to 32 KB, added after Aether's stylesheet everywhere except Administration" }
    OrganizationBranding:
      allOf:
        - { $ref: "#/components/schemas/BrandingSettings" }
        - type: object
          required: [logoLight, logoDark, favicon, customCssEnabled]
          properties:
            logoLight: { type: [string, "null"], description: "URL of the logo for the light theme" }
            logoDark: { type: [string, "null"], description: "URL of the logo for the dark theme" }
            favicon: { type: [string, "null"] }
            customCssEnabled: { type: boolean, description: "false while the server sets AETHER_CUSTOM_CSS=false" }
    Branding:
      type: object
      required: [orgId, name, signInMessage, colors, customCssUrl, logoLight, logoDark, favicon]
      properties:
        orgId: { type: string, format: uuid }
        name: { type: string }
        signInMessage: { type: string }
        colors: { $ref: "#/components/schemas/BrandColors" }
        customCssUrl: { type: [string, "null"] }
        logoLight: { type: [string, "null"] }
        logoDark: { type: [string, "null"] }
        favicon: { type: [string, "null"] }
    SignatureSettings:
      type: object
      properties:
        displayName: { type: string, maxLength: 200, description: An empty name uses the mailbox or list default. }
        signatures:
          type: array
          maxItems: 20
          items:
            type: object
            required: [id, name, html]
            properties:
              id: { type: string, pattern: "^[A-Za-z0-9-]{1,64}$" }
              name: { type: string, maxLength: 100 }
              html: { type: string }
        newMessage: { type: string, description: Default signature ID for new mail. }
        replies: { type: string, description: Default signature ID for replies and forwards. }
    SignatureLink:
      type: object
      required: [label, url]
      properties:
        label: { type: string, maxLength: 40 }
        url: { type: string, description: "An https://, http:// or mailto: address" }
    SendingLimits:
      type: object
      properties:
        messagesPerHour: { type: integer, minimum: 0, maximum: 100000 }
        messagesPerDay: { type: integer, minimum: 0, maximum: 1000000 }
        recipientsPerMessage: { type: integer, minimum: 0, maximum: 1000 }
        recipientsPerDay: { type: integer, minimum: 0, maximum: 1000000 }
        newRecipientsPerDay: { type: integer, minimum: 0, maximum: 1000000, description: "Recipients the mailbox has never sent to before." }
        spamPercent: { type: integer, minimum: 0, maximum: 100, description: "Share of the day's messages Rspamd scored as spam, checked once the mailbox has sent 10 messages that day." }
    SignatureTemplate:
      type: object
      required: [html, logoWidth]
      properties:
        domainId: { type: [string, "null"], format: uuid, description: "null for the organization-wide template" }
        html: { type: string, description: "Up to 32 KB of HTML with {{displayName}}, {{title}}, {{phone}}, {{organization}}, {{domain}}, {{address}}, {{logo}} and {{links}}. {{#title}}…{{/title}} keeps a part only when the value is not empty. The filled-in result is sanitized like mail." }
        links: { type: array, maxItems: 10, items: { $ref: "#/components/schemas/SignatureLink" } }
        logoWidth: { type: integer, minimum: 16, maximum: 240, description: "Width of {{logo}} in pixels. The light theme logo from branding is embedded, scaled down to at most twice this width." }
        updatedAt: { type: string, format: date-time, readOnly: true }
    FlowCondition:
      type: object
      required: [field]
      properties:
        field: { type: string, enum: [sender, recipient, subject, body, header, attachmentName, attachmentType, sizeOver, spamScoreOver, direction] }
        scope: { type: string, enum: [address, domain, inside, outside, memberOf], description: "For sender and recipient. A sender is inside the organization only when it signed in. A recipient condition matches when any recipient does; memberOf matches the list itself and its direct members." }
        header: { type: string, description: "For header: the header name." }
        values: { type: array, minItems: 1, maxItems: 100, items: { type: string }, description: "Addresses, domains or list addresses for sender and recipient; incoming, outgoing or internal for direction; text for the others, matched case-insensitively when the field contains any of the values." }
        number: { type: number, description: "Kilobytes for sizeOver, the Rspamd score for spamScoreOver." }
    FlowActions:
      type: object
      properties:
        disclaimer:
          type: object
          required: [text, fallback]
          properties:
            text: { type: string, maxLength: 10000 }
            html: { type: string, description: "Used in HTML parts instead of the text; sanitized like mail." }
            fallback: { type: string, enum: [wrap, skip, reject], description: "For S/MIME or PGP signed or encrypted messages: attach the disclaimer as a separate part, leave the message alone, or reject it." }
        bcc: { type: array, maxItems: 20, items: { type: string, format: email } }
        redirectTo: { type: array, maxItems: 20, items: { type: string, format: email }, description: "Replaces the recipients; for incoming mail, only this organization's recipients." }
        reject: { type: string, maxLength: 200, description: "Rejects the message with 550 5.7.1 and this ASCII text. Cannot be combined with other actions." }
        addHeaders: { type: array, maxItems: 10, items: { type: object, required: [name, value], properties: { name: { type: string }, value: { type: string } } } }
        removeHeaders: { type: array, maxItems: 10, items: { type: string } }
        spamScore: { type: number, minimum: -50, maximum: 50, description: "Added to the Rspamd score." }
        requireTls: { type: boolean, description: "Delivers over mandatory TLS. Messages that also go to recipients on this server are rejected." }
        approvers: { type: array, maxItems: 20, items: { type: string, format: email }, description: "Active members of the organization. Needs AETHER_SIEVE_RELAY_PASSWORD on the API." }
    FlowRule:
      type: object
      required: [name, mode, conditions, exceptions, actions, stop]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string, maxLength: 100 }
        mode: { type: string, enum: [enforce, test, off], description: "test records matches without changing the message." }
        conditions: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/FlowCondition" }, description: "All must match. None means every message." }
        exceptions: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/FlowCondition" }, description: "The rule is skipped when any matches." }
        actions: { $ref: "#/components/schemas/FlowActions" }
        stop: { type: boolean, description: "Skip this organization's later rules for messages this rule matches." }
        updatedAt: { type: string, format: date-time, readOnly: true }
    FlowMatch:
      type: object
      required: [id, ruleId, ruleName, test, direction, sender, recipients, subject, actions, createdAt]
      properties:
        id: { type: integer }
        ruleId: { type: [string, "null"], format: uuid }
        ruleName: { type: string }
        test: { type: boolean }
        direction: { type: string, enum: [incoming, outgoing, internal] }
        sender: { type: string }
        recipients: { type: array, items: { type: string } }
        subject: { type: string }
        actions: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
    FlowHeldMessage:
      type: object
      required: [id, orgId, ruleName, approvers, sender, recipients, subject, preview, createdAt]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        ruleName: { type: string }
        approvers: { type: array, items: { type: string } }
        sender: { type: string }
        recipients: { type: array, items: { type: string } }
        subject: { type: string }
        preview: { type: string, description: "Up to 2,000 characters of the message text." }
        createdAt: { type: string, format: date-time }
    RenderedSignature:
      type: object
      required: [html]
      properties:
        html: { type: string }
    Domain:
      type: object
      required: [id, orgId, name, verified, verificationToken, dkimSelector, dkimRecord, dkimRotationDue, active, aliasOf, aliasSendAs, createdAt, coexistenceHost, dualDeliveryMailboxIds]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        name: { type: string }
        verified: { type: boolean }
        verifiedAt: { type: [string, "null"], format: date-time }
        verificationToken: { type: string }
        dkimSelector: { type: string, description: Active RSA selector. }
        dkimRotationDue: { type: boolean }
        dkimRecord: { type: string, description: TXT value to publish at <selector>._domainkey.<domain> }
        coexistenceHost: { type: string, description: Direct legacy SMTP hostname. An empty string means coexistence is off. }
        dualDeliveryMailboxIds:
          type: array
          items: { type: string, format: uuid }
        active: { type: boolean }
        aliasOf: { type: [string, "null"], format: uuid, description: The domain this alias domain points to, or null for a regular domain }
        aliasSendAs: { type: boolean }
        createdAt: { type: string, format: date-time }
    DKIMKey:
      type: object
      required: [id, selector, algorithm, bits, state, dnsName, record, createdAt, activatedAt, retiredAt, removeAfter, rotationDue]
      properties:
        id: { type: string, format: uuid }
        selector: { type: string }
        algorithm: { type: string, enum: [rsa, ed25519] }
        bits: { type: integer }
        state: { type: string, enum: [pending, active, retired] }
        dnsName: { type: string }
        record: { type: string }
        createdAt: { type: string, format: date-time }
        activatedAt: { type: [string, "null"], format: date-time }
        retiredAt: { type: [string, "null"], format: date-time }
        removeAfter: { type: [string, "null"], format: date-time }
        rotationDue: { type: boolean }
    DNSRecord:
      type: object
      required: [type, name, value, purpose, status, found]
      properties:
        type: { type: string, enum: [MX, TXT, CNAME, SRV, PTR] }
        name: { type: string }
        value: { type: string }
        purpose: { type: string, enum: [verification, mx, spf, dkim, dmarc, mta-sts-host, mta-sts, tls-rpt, autoconfig, autodiscover, srv-imaps, srv-submissions] }
        status: { type: string, enum: [ok, warning, missing, mismatch, error] }
        found: { type: array, items: { type: string } }
    Mailbox:
      type: object
      required: [id, orgId, domainId, address, localPart, displayName, quotaBytes, active, createdAt, kind, hiddenFromDirectory, protocols]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        domainId: { type: string, format: uuid }
        address: { type: string }
        localPart: { type: string }
        displayName: { type: string }
        ownerUserId: { type: [string, "null"], format: uuid }
        quotaBytes: { type: integer }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        kind: { type: string, enum: [user, shared], description: A user mailbox has an owner account that signs in with the address. A shared mailbox has no sign-in; its members open it with their own accounts. }
        hiddenFromDirectory: { type: boolean }
        fromAddresses: { type: array, items: { $ref: "#/components/schemas/Address" }, description: Authorized From addresses for this mailbox. Only in GET /me/mailboxes. }
        purgeAfter: { type: [string, "null"], format: date-time, description: When set, the mailbox is closed and its mail is removed from the vmail volume at this time unless it is on hold or restored. }
        onHold: { type: boolean, description: Deletion keeps the mail. }
    MailboxExport:
      type: object
      required: [id, format, folder, includeCalendar, includeContacts, status, error, bytes, messages, mediaType, filename, createdAt]
      properties:
        id: { type: string, format: uuid }
        format: { type: string, enum: [zip, mbox] }
        folder: { type: string }
        since: { type: [string, "null"], format: date-time }
        until: { type: [string, "null"], format: date-time }
        includeCalendar: { type: boolean }
        includeContacts: { type: boolean }
        status: { type: string, enum: [pending, running, ready, failed, expired] }
        error: { type: string }
        bytes: { type: integer }
        messages: { type: integer }
        mediaType: { type: string }
        filename: { type: string }
        expiresAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
        access: { type: string, enum: [owner, full, read], description: The caller's access. Only in GET /me/mailboxes. }
        sendAs: { type: boolean, description: The caller may send from the address. Only in GET /me/mailboxes. }
        sendOnBehalf: { type: boolean, description: The caller may send on behalf of the address. Only in GET /me/mailboxes. }
        protocols: { $ref: "#/components/schemas/Protocols" }
    PersonalAliasTarget:
      type: object
      required: [domainId, mailboxId]
      properties:
        domainId: { type: string, format: uuid, description: Allowed and verified alias domain in this organization }
        mailboxId: { type: string, format: uuid, description: Active personal mailbox owned by the caller in this organization }
        quotaWarningPercents: { type: array, items: { type: integer }, description: "The organization's storage warning levels. Only in GET /me/mailboxes." }
        usedBytes: { type: integer, description: "Storage in use when Aether last measured it, every AETHER_QUOTA_CHECK_INTERVAL. Only in GET /organizations/{orgId}/mailboxes." }
    Alias:
      type: object
      required: [id, orgId, domainId, address, localPart, destinations, active, kind, name, acceptFrom, allowedSenders, sendAs, owners, moderated, moderators, moderationExempt, hiddenFromDirectory]
      properties:
        personalOwnerId: { type: string, format: uuid, description: Present for self-service aliases. }
        note: { type: string }
        expiresAt: { type: string, format: date-time }
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        domainId: { type: string, format: uuid }
        address: { type: string }
        localPart: { type: string }
        destinations: { type: array, items: { type: string } }
        active: { type: boolean }
        kind: { type: string, enum: [alias, list] }
        name: { type: string }
        acceptFrom: { type: string, enum: [anyone, organization, members, allowlist] }
        allowedSenders: { type: array, items: { type: string } }
        sentMailboxId: { type: string, format: uuid, description: Shared mailbox for the list’s sent copies. }
        sendAs: { type: array, items: { type: string } }
        owners: { type: array, items: { type: string, format: uuid } }
        moderated: { type: boolean }
        moderators: { type: array, items: { type: string, format: uuid } }
        moderationExempt: { type: array, items: { type: string } }
    HeldMessage:
      type: object
      required: [id, listId, listAddress, listName, sender, from, subject, preview, size, receivedAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        listId: { type: string, format: uuid }
        listAddress: { type: string }
        listName: { type: string }
        sender: { type: string, description: Envelope sender. Empty for bounces. }
        from: { type: string, description: The From header }
        subject: { type: string }
        preview: { type: string, description: Up to 2,000 characters of the message text }
        size: { type: integer }
        receivedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: Five days after it was received. The message is then discarded and the sender told. }
        hiddenFromDirectory: { type: boolean }
    AliasInput:
      type: object
      properties:
        kind: { type: string, enum: [alias, list], default: alias, description: "A list can have up to 5,000 destinations, sender restrictions, send-as people and owners. An alias has up to 100 destinations and every mailbox among them may send as it." }
        name: { type: string, maxLength: 200, description: Shown in the organization directory for lists }
        destinations: { type: array, items: { type: string, format: email }, description: Replaces all destinations. Other lists and outside addresses are allowed. }
        addDestinations: { type: array, items: { type: string, format: email } }
        removeDestinations: { type: array, items: { type: string, format: email } }
        active: { type: boolean }
        acceptFrom:
          type: string
          enum: [anyone, organization, members, allowlist]
          description: "Who may send to a list. organization: people who signed in to send from a domain of this organization. members: the list's destinations. allowlist: the addresses and @domain entries in allowedSenders. Mail from anyone else is rejected with 5.7.1."
        allowedSenders: { type: array, items: { type: string }, description: Addresses or @domain entries }
        sentMailboxId: { type: string, description: A shared mailbox of this organization that keeps the copies of messages sent as the list from Aether Mail. An empty string files them in the Sent folder of the sender's mailbox. }
        sendAs: { type: array, items: { type: string, format: email }, description: Mailboxes of this organization that may send as the list }
        owners: { type: array, items: { type: string, format: uuid }, description: Organization members who may change the list's destinations }
        moderated: { type: boolean, description: "Hold messages to the list until a moderator approves them. Needs at least one moderator or owner, and AETHER_SIEVE_RELAY_PASSWORD on the API." }
        moderators: { type: array, items: { type: string, format: uuid }, description: Organization members who approve held messages. When empty, the owners do. }
        moderationExempt: { type: array, items: { type: string }, description: "Addresses or @domain entries whose mail skips moderation. Moderators and owners always skip it." }
        hiddenFromDirectory: { type: boolean, description: Lists only. Leaves the list out of the directory, address suggestions and the CardDAV directory. It still receives mail. }
    ImportCounts:
      type: object
      properties:
        imported: { type: integer }
        updated: { type: integer }
        skipped: { type: integer }
    Member:
      type: object
      required: [userId, email, displayName, role, domainIds, status, passwordSignIn, twoFactor, hasPassword, isPlatformAdmin, multiOrg]
      properties:
        userId: { type: string, format: uuid }
        email: { type: string }
        displayName: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        customRoleId: { type: string, format: uuid }
        customRoleName: { type: string }
        domainIds: { type: array, items: { type: string, format: uuid } }
        status: { type: string }
        passwordSignIn: { type: boolean, description: The account has an Aether password }
        twoFactor: { type: boolean, description: An authenticator app or security key is set up }
    TwoFactorPrompt:
      type: object
      required: [totp, securityKey]
      properties:
        totp: { type: boolean, description: An authenticator app code is accepted }
        securityKey:
          type: [object, "null"]
          description: PublicKeyCredentialRequestOptions for navigator.credentials.get(), with binary fields in standard base64; null when no security key is registered
    SecurityStatus:
      type: object
      required: [passwordSignIn, twoFactorRequired, totp, recoveryCodes, securityKeys]
      properties:
        passwordSignIn: { type: boolean }
        twoFactorRequired: { type: boolean, description: One of the caller's organizations requires two-factor authentication }
        totp: { type: boolean }
        recoveryCodes: { type: integer, description: Unused recovery codes }
        securityKeys:
          type: array
          items:
            type: object
            required: [id, name, createdAt, lastUsedAt]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              createdAt: { type: string, format: date-time }
              lastUsedAt: { type: [string, "null"], format: date-time }
    RecoveryCodes:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes: { type: array, items: { type: string } }
    PasswordConfirmation:
      type: object
      required: [password]
      properties:
        password: { type: string, description: The caller's current password }
    OrganizationSecurity:
      type: object
      required: [twoFactorPolicy]
      properties:
        twoFactorPolicy: { type: string, enum: [off, admins, everyone] }
    ActiveSession:
      type: object
      required: [id, ip, userAgent, provider, createdAt, lastSeenAt, current]
      properties:
        id: { type: string, format: uuid }
        ip: { type: string }
        userAgent: { type: string }
        provider: { type: [string, "null"], description: Identity provider the session signed in through }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        current: { type: boolean }
        hasPassword: { type: boolean }
        isPlatformAdmin: { type: boolean }
        multiOrg: { type: boolean }
    AuditEvent:
      type: object
      required: [id, createdAt, action, targetType, targetId]
      properties:
        id: { type: integer }
        createdAt: { type: string, format: date-time }
        actorEmail: { type: [string, "null"] }
        action: { type: string }
        targetType: { type: string }
        targetId: { type: string }
        ip: { type: string }
    MessageTraceStatus:
      type: string
      description: For a message with several recipients, the least successful outcome among the recipients you can see. junk means delivered to the recipient's Junk folder.
      enum: [rejected, bounced, discarded, deleted, deferred, held, queued, unknown, junk, delivered]
    MessageTraceSummary:
      type: object
      required: [id, receivedAt, status, sender, recipients, subject, messageId, service, clientIp, spam]
      properties:
        id: { type: integer }
        receivedAt: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/MessageTraceStatus" }
        sender: { type: string, description: Envelope sender with SRS rewriting undone; empty for bounce reports }
        recipients: { type: array, items: { type: string } }
        subject: { type: string }
        messageId: { type: string }
        queueId: { type: [string, "null"], description: Postfix queue ID; null when the message was rejected before it was queued }
        service: { type: string, description: "Where it arrived: smtpd (port 25), submission, submissions, sieve-relay (forwarded by a mail rule), pickup, or cleanup for reports Postfix generated" }
        clientIp: { type: string }
        tls: { type: [string, "null"], description: Protocol and cipher of the incoming connection; empty when unencrypted, null when not known }
        spamScore: { type: [number, "null"] }
        spam: { type: boolean }
        lastEvent: { type: [string, "null"] }
        detail: { type: [string, "null"], description: Server reply or reason of the latest event }
    MessageTracePage:
      type: object
      required: [messages]
      properties:
        messages: { type: array, items: { $ref: "#/components/schemas/MessageTraceSummary" } }
        retentionDays: { type: [integer, "null"], description: How long records are kept; null until the mail-trace service has run }
        readAt: { type: [string, "null"], format: date-time, description: When the mail-trace service last read the Postfix log }
    MessageTraceDetail:
      allOf:
        - { $ref: "#/components/schemas/MessageTraceSummary" }
        - type: object
          required: [clientName, saslUsername, recipientStatus, events, related]
          properties:
            clientName: { type: string }
            saslUsername: { type: string }
            size: { type: [integer, "null"] }
            recipientStatus: { type: object, additionalProperties: { $ref: "#/components/schemas/MessageTraceStatus" } }
            events:
              type: array
              items:
                type: object
                required: [at, kind, recipient, origRecipient, relay, dsn, detail, tls]
                properties:
                  at: { type: string, format: date-time }
                  kind: { type: string, enum: [delivered, relayed, forwarded, deferred, bounced, expired, rejected, discarded, held, released, deleted, notified] }
                  recipient: { type: string }
                  origRecipient: { type: string, description: The alias the recipient was reached through }
                  relay: { type: string }
                  dsn: { type: string }
                  detail: { type: string }
                  tls: { type: string }
            related:
              type: array
              description: Other records with the same Message-ID, such as a copy forwarded by a mail rule
              items:
                type: object
                required: [id, receivedAt, service, sender, status]
                properties:
                  id: { type: integer }
                  receivedAt: { type: string, format: date-time }
                  service: { type: string }
                  sender: { type: string }
                  status: { $ref: "#/components/schemas/MessageTraceStatus" }
    AppPassword:
      type: object
      required: [id, name, mailboxId, mailboxAddress, createdAt, scope]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        mailboxId: { type: string, format: uuid }
        mailboxAddress: { type: string }
        createdAt: { type: string, format: date-time }
        scope: { $ref: "#/components/schemas/AppPasswordScope" }
    MailboxAppPassword:
      type: object
      required: [id, name, userId, userEmail, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        userId: { type: string, format: uuid }
        userEmail: { type: string }
        createdAt: { type: string, format: date-time }
    Folder:
      type: object
      required: [name, specialUse, total, unread, subscribed]
      properties:
        name: { type: string, description: "Full name. Levels are separated by /." }
        specialUse: { type: string, enum: ["", inbox, drafts, sent, trash, junk, archive] }
        total: { type: integer }
        unread: { type: integer }
        subscribed: { type: boolean, description: Whether IMAP clients that show only subscribed folders list it }
        size: { type: integer, description: "Bytes the folder's messages count against the quota. The folders' sizes add up to the mailbox's usage." }
    QuotaWarnings:
      type: object
      required: [percents, notifyAdmins]
      properties:
        percents: { type: array, maxItems: 2, items: { type: integer, minimum: 50, maximum: 99 }, description: "How full a mailbox is, in percent, when it gets a warning. Defaults to 80 and 95." }
        notifyAdmins: { type: boolean, description: "Also deliver a copy to the organization's owners and administrators who have a mailbox." }
    MessageTransfer:
      type: object
      required: [to]
      properties:
        to: { type: string, description: Destination folder }
        mailboxId: { type: string, format: uuid, description: "Destination mailbox. Both mailboxes need full access. Defaults to this mailbox." }
        uids: { type: array, maxItems: 500, items: { type: integer }, description: Messages for the bulk endpoints. The single-message endpoints use the uid in the path. }
    Address:
      type: object
      required: [address]
      properties:
        name: { type: string }
        address: { type: string }
    Label:
      type: object
      required: [id, name, color, keyword, position]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string, enum: [red, orange, yellow, green, blue, purple, gray, pink] }
        keyword: { type: string, description: The IMAP keyword. It does not change when the label is renamed. }
        position: { type: integer }
    SavedSearch:
      type: object
      required: [id, name, query, unread, flagged, hasAttachments, folder, allFolders, position]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        query: { type: string }
        unread: { type: boolean }
        flagged: { type: boolean }
        hasAttachments: { type: boolean }
        from: { type: string }
        to: { type: string }
        since: { type: string, format: date }
        until: { type: string, format: date }
        labelId: { type: string, format: uuid }
        folder: { type: string, description: Empty when allFolders is true }
        allFolders: { type: boolean }
        position: { type: integer }
    SavedSearchInput:
      type: object
      required: [name, query, unread, flagged, hasAttachments, allFolders]
      properties:
        name: { type: string, maxLength: 80 }
        query: { type: string, maxLength: 500 }
        unread: { type: boolean }
        flagged: { type: boolean }
        hasAttachments: { type: boolean }
        from: { type: string, maxLength: 200 }
        to: { type: string, maxLength: 200 }
        since: { type: string, format: date }
        until: { type: string, format: date }
        labelId: { type: string, format: uuid, description: Empty when the search does not filter by a label }
        folder: { type: string, description: Required unless allFolders is true }
        allFolders: { type: boolean }
    MessageSummary:
      type: object
      required: [uid, subject, from, to, date, seen, flagged, answered, hasAttachments, size]
      properties:
        uid: { type: integer }
        folder: { type: string, description: The folder this row came from. Present when a search covers more than one folder. }
        subject: { type: string }
        from: { type: array, items: { $ref: "#/components/schemas/Address" } }
        to: { type: array, items: { $ref: "#/components/schemas/Address" } }
        date: { type: string, format: date-time }
        seen: { type: boolean }
        flagged: { type: boolean }
        answered: { type: boolean }
        hasAttachments: { type: boolean }
        size: { type: integer }
        threadUids: { type: array, items: { type: integer }, description: Present when threads=true and the conversation has more than one message }
        keywords: { type: array, items: { type: string }, description: IMAP keywords on the message, including labels and tags set by other mail apps }
        flagColor: { type: string, enum: [red, orange, yellow, green, blue, purple, gray], description: The color encoded by Apple Mail flag bits, when the message has one }
    RecoverableMessage:
      allOf:
        - { $ref: "#/components/schemas/MessageSummary" }
        - type: object
          required: [folder, deletedAt]
          properties:
            folder: { type: string, description: The folder the message was deleted from }
            deletedAt: { type: string, format: date-time }
    Message:
      allOf:
        - { $ref: "#/components/schemas/MessageSummary" }
        - type: object
          required: [cc, bcc, replyTo, messageId, inReplyTo, references, text, html, attachments]
          properties:
            cc: { type: array, items: { $ref: "#/components/schemas/Address" } }
            bcc: { type: array, items: { $ref: "#/components/schemas/Address" }, description: Present only in drafts and sent copies that carry a Bcc header }
            deliveredTo: { type: string, description: "The address this copy was delivered to, before alias expansion, from the X-Original-To header that Postfix adds." }
            replyTo: { type: array, items: { $ref: "#/components/schemas/Address" } }
            messageId: { type: string }
            inReplyTo: { type: string }
            references: { type: array, items: { type: string } }
            text: { type: string }
            html: { type: string, description: "Sanitized HTML. Render inside a sandboxed iframe whose img-src allows only data and cid, plus this server's origin when remoteImages.status is proxied." }
            remoteImages: { $ref: "#/components/schemas/RemoteImages" }
            attachments: { type: array, items: { $ref: "#/components/schemas/Attachment" } }
            unsubscribe:
              $ref: "#/components/schemas/Unsubscribe"
              description: Present when the message has a usable List-Unsubscribe header. Exactly one of oneClick, link and mailto is true, and that is the action Unsubscribe performs.
            fileLinks:
              type: array
              description: Download links attached to a draft. Present only when the message is read from the mailbox that owns them. Sent messages carry the links in the body instead.
              items: { $ref: "#/components/schemas/FileLinkSummary" }
            invitation: { $ref: "#/components/schemas/Invitation" }
            protection: { $ref: "#/components/schemas/MessageProtection" }
            related:
              type: array
              description: Messages from the same conversation in Sent, or in the Inbox when reading from Sent
              items:
                type: object
                required: [folder, uid, date]
                properties:
                  folder: { type: string }
                  uid: { type: integer }
                  date: { type: string, format: date-time }
    Unsubscribe:
      type: object
      description: Present on a message when Unsubscribe can do something. Exactly one of the flags is true, and that is the action performed.
      properties:
        oneClick: { type: boolean, description: The server POSTs List-Unsubscribe=One-Click to the https URI }
        link: { type: boolean, description: The response includes a url for the browser to open }
        mailto: { type: boolean, description: The server sends the mailto request from this mailbox }
    UnsubscribeResult:
      type: object
      required: [method]
      properties:
        method: { type: string, enum: [one-click, link, mailto] }
        url: { type: string, description: Present when method is link }
    NewsletterSender:
      type: object
      required: [address, name, subject, count, latestUid, folder, date, oneClick, link, mailto, blocked]
      properties:
        address: { type: string, format: email }
        name: { type: string }
        subject: { type: string }
        count: { type: integer, description: How many of the latest 200 matching inbox messages are from this sender }
        latestUid: { type: integer }
        folder: { type: string }
        date: { type: string, format: date-time }
        oneClick: { type: boolean }
        link: { type: boolean }
        mailto: { type: boolean }
        blocked: { type: boolean, description: A mail rule already deletes messages from this address }
    RemoteImages:
      type: object
      required: [status, remote, trackers, senderAllowed, messageAllowed, policy]
      properties:
        status: { type: string, enum: [none, hidden, proxied] }
        remote: { type: integer, description: Remote images that are not known trackers }
        trackers: { type: integer, description: Known tracking images removed before any request }
        sender: { type: string, description: Address used for Always show from this sender }
        senderAllowed: { type: boolean }
        messageAllowed: { type: boolean }
        policy: { type: string, enum: [block, proxy], description: Organization default }
    RemoteImageSender:
      type: object
      required: [address, createdAt]
      properties:
        address: { type: string }
        createdAt: { type: string, format: date-time }
    MailPrivacy:
      type: object
      required: [remoteImages]
      properties:
        remoteImages: { type: string, enum: [block, proxy] }
    Invitation:
      type: object
      required: [method, event, organizer, status, applied]
      properties:
        method: { type: string, enum: [request, reply, cancel] }
        event: { $ref: "#/components/schemas/CalendarEvent" }
        organizer: { $ref: "#/components/schemas/Address" }
        status: { type: string, enum: ["", needs-action, accepted, tentative, declined], description: Your response to a request, or the sender's response in a reply }
        eventId: { type: string, description: The matching event in your calendar, if there is one }
        applied: { type: boolean, description: Whether your calendar already reflects this message }
    Attendee:
      type: object
      required: [address, status]
      properties:
        name: { type: string }
        address: { type: string }
        status: { type: string, enum: [needs-action, accepted, tentative, declined] }
    AutoReply:
      type: object
      required: [enabled, subject, message]
      properties:
        enabled: { type: boolean }
        subject: { type: string, maxLength: 200 }
        message: { type: string, maxLength: 10000 }
        start: { type: string, format: date, description: First day replies are sent }
        end: { type: string, format: date, description: Last day replies are sent }
    TaggedMail:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [inbox, create_folder, existing_folder, reject]
