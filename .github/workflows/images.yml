name: images

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, context: ., dockerfile: infrastructure/docker/api/Dockerfile }
          - { name: web, context: apps/web, dockerfile: apps/web/Dockerfile }
          - { name: postfix, context: infrastructure/docker/postfix, dockerfile: infrastructure/docker/postfix/Dockerfile, build-contexts: "aether-source=." }
          - { name: dovecot, context: infrastructure/docker/dovecot, dockerfile: infrastructure/docker/dovecot/Dockerfile }
          - { name: rspamd, context: infrastructure/docker/rspamd, dockerfile: infrastructure/docker/rspamd/Dockerfile }
          - { name: unbound, context: infrastructure/docker/unbound, dockerfile: infrastructure/docker/unbound/Dockerfile }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ghcr.io/${{ github.repository_owner }}/aether-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-contexts: ${{ matrix.build-contexts }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
