name: images

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, context: ., dockerfile: infrastructure/docker/api/Dockerfile }
          - { name: web, context: apps/web, dockerfile: apps/web/Dockerfile }
          - { name: postfix, context: infrastructure/docker/postfix, dockerfile: infrastructure/docker/postfix/Dockerfile }
          - { name: dovecot, context: infrastructure/docker/dovecot, dockerfile: infrastructure/docker/dovecot/Dockerfile }
          - { name: rspamd, context: infrastructure/docker/rspamd, dockerfile: infrastructure/docker/rspamd/Dockerfile }
          - { name: unbound, context: infrastructure/docker/unbound, dockerfile: infrastructure/docker/unbound/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/aether-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
